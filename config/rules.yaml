# =============================================================================
# rules.yaml — Bộ quy tắc định cỡ của Sizing Copilot
# =============================================================================
#
# NGUYÊN TẮC NT3: quy tắc là DỮ LIỆU, không phải code hay prompt.
# Người nghiệp vụ sửa file này trực tiếp, KHÔNG cần lập trình viên.
# Không hard-code công thức/ngưỡng vào Python, không nhét quy tắc vào prompt.
#
# SAU MỖI LẦN SỬA FILE NÀY, BẮT BUỘC CHẠY LẠI EVAL SET (PLAN.md mục 4.4):
#   uv run python -m eval.run_eval
#
# -----------------------------------------------------------------------------
# TRẠNG THÁI: KHUNG RỖNG — chưa có quy tắc thật.
# Hai quy tắc dưới đây là VÍ DỤ MẪU (docs/ke-hoach-trien-khai.md, Phụ lục A),
# dùng để minh họa cấu trúc. Xóa hoặc thay khi điền quy tắc thật.
# Quy tắc thật chỉ được điền sau khi hoàn tất và xác nhận mục 0.1–0.4
# (bảng nháp: docs/0.1-danh-sach-quy-tac.md).
# -----------------------------------------------------------------------------
#
# LƯỢC ĐỒ MỘT QUY TẮC
# ===================
#
# Trường chung — BẮT BUỘC cho mọi quy tắc:
#   id            Mã định danh duy nhất, dạng <NHÓM>-<số>. VD: STO-01, CPU-03.
#                 Mã này xuất hiện trong `rule_ref` của mỗi finding (NT2).
#                 KHÔNG đổi mã đã dùng — sẽ làm hỏng liên kết với eval set.
#   name          Tên ngắn, một dòng, tiếng Việt.
#   type          quantitative | qualitative
#                 quantitative → C4 (src/validators/quantitative.py, thuần code)
#                 qualitative  → C5 (src/validators/qualitative.py, RAG + LLM)
#   applies_to_equipment  Loại thiết bị quy tắc áp dụng. Xem `equipment_types` bên dưới.
#                 BẮT BUỘC — mọi quy tắc đều phải điền ít nhất một giá trị.
#                 Quy tắc không gắn với thiết bị nào thì dùng `tat_ca` (áp cho mọi
#                 thiết bị: thủ tục, phương pháp định cỡ) hoặc `tai_lieu` (yêu cầu
#                 về cấu trúc/trình bày bản sizing). KHÔNG để trống.
#   applies_to_module     (tùy chọn) Module phần mềm đặc thù. Xem `module_types`.
#                 Để trống = áp dụng cho mọi module.
#   scope         Quy tắc được chấm BAO NHIÊU LẦN trên một bản sizing. Xem
#                 `evaluation_scopes` bên dưới. Khác với `applies_to_*` — hai
#                 trường đó nói quy tắc áp cho LOẠI nào, `scope` nói chấm mấy lần.
#                 Bỏ trống mặc định `he_thong` (một lần cho cả tài liệu).
#   round         1 = vòng checklist, chỉ hỏi "thành phần cần có đã có chưa".
#                 2 = vòng tài liệu định cỡ, kiểm cách tính có đúng không.
#                 C7 phải CHẶN finding vòng 2 của mục đã trượt vòng 1.
#                 Chi tiết: docs/rules/rules-checklist-flat.md
#   legacy_ref    (tùy chọn) Mã tạm ở danh sách phẳng 0.1, để truy vết ngược.
#                 VD: [R48, R49] hoặc [CPU-01]. Xem docs/rules/rules-crossmap.md.
#   code_ref      (tùy chọn) Vị trí hiện thực hóa trong web app hiện hành, nếu có.
#                 VD: "frontend/script.js:6704". Dùng để đối chiếu khi code đổi.
#   severity      critical | major | minor | info
#                 critical — chắc chắn bị trả lại (thiếu mục bắt buộc, sai công
#                            thức bắt buộc, vượt ngưỡng cứng)
#                 major    — nhiều khả năng bị hỏi lại (thiếu sở cứ, số liệu mâu thuẫn)
#                 minor    — nên sửa cho hoàn thiện (trình bày, đơn vị, làm tròn)
#                 info     — hệ thống không kiểm chứng được, người dùng tự xác nhận
#   source_doc    Trích dẫn vị trí trong tài liệu gốc (tên TL, mục, trang).
#                 BẮT BUỘC — đây là căn cứ grounding theo NT2. Không có thì
#                 finding sinh ra sẽ bị lọc bỏ.
#
# Trường riêng cho type: quantitative — dùng `check` HOẶC `formula`, tùy dạng quy tắc
#
#   check            Biểu thức ĐÚNG/SAI cho quy tắc **so ngưỡng** ("tải CPU không quá
#                    75%"). Sai (False) -> sinh finding. Dùng khi quy tắc là một bất
#                    đẳng thức, vì `formula` + `compare_with` chỉ diễn đạt được phép
#                    BẰNG. VD: "cpu_95th <= cpu_kpi * 100".
#
#   formula          Biểu thức TÍNH LẠI cho quy tắc **công thức** ("ΣCPU = ..."), rồi
#                    đối chiếu với `compare_with`. Chỉ dùng tên tham số khai trong `inputs`
#                    và các hàm số học an toàn (pow, min, max, ceil, floor, round).
#                    Đánh giá bằng asteval/simpleeval — KHÔNG BAO GIỜ dùng eval().
#   inputs           Danh sách tham số: {name, unit, required, default, role}
#                    - role: lookup    → tham số này là KHÓA TRA BẢNG, C4 dùng nó để
#                                        suy ra tham số khác (VD `loai_o` → `iops_toi_da_loai_o`),
#                                        nên KHÔNG xuất hiện trong `check`/`formula`.
#                                        Thiếu khóa tra thì KHÔNG đoán: sinh finding
#                                        nhóm "thiếu thông tin" (NT4).
#                    - required: true  → thiếu thì KHÔNG đoán, sinh finding
#                                        category "thiếu thông tin" (NT4)
#                    - default         → chỉ dùng khi tài liệu tiêu chí cho phép
#                                        mặc định; ghi rõ trong source_doc
#   compare_with     Tên trường trong bản sizing để đối chiếu với kết quả `formula`.
#                    Chỉ dùng cùng `formula`, không dùng với `check`.
#   tolerance        Sai lệch tương đối cho phép, dạng thập phân (0.10 = 10%).
#
#   Quy tắc định lượng nào KHÔNG có cả `check` lẫn `formula` (vì nó là một quy ước
#   xử lý dữ liệu, ví dụ "tải đánh giá lấy giá trị 95th") thì BẮT BUỘC có `note`
#   giải thích C4 hiện thực hóa nó ở đâu — để không ai tưởng là bỏ sót.
#   message_template Mẫu câu tiếng Việt cho finding. Biến dùng được:
#                    {expected} {declared} {diff_pct} {unit} + tên các inputs.
#
# Trường riêng cho type: qualitative
#   criteria         Tiêu chí "thế nào là ĐẠT", viết CỤ THỂ. Tránh "hợp lý",
#                    "đầy đủ", "phù hợp" — LLM sẽ tự chế tiêu chuẩn riêng.
#                    Nêu rõ cả trường hợp KHÔNG đạt.
#   examples         (khuyến nghị) {pass: [...], fail: [...]} — trích từ bản
#                    sizing thật, dùng làm few-shot cho C5.
#
# Trường tùy chọn cho cả hai loại
#   applies_when     Biểu thức ĐÚNG/SAI quyết định quy tắc CÓ áp dụng cho bản sizing
#                    này không. Sai -> trả "không áp dụng", KHÔNG sinh finding và
#                    KHÔNG tính vào recall. Dùng cho các quy tắc loại trừ lẫn nhau —
#                    điển hình MTH-01..MTH-04 (Dạng I / II / III): C5 phải xác định
#                    dạng định cỡ TRƯỚC, rồi chỉ chạy đúng một quy tắc.
#                    Tên dùng trong biểu thức phải khai ở `inputs` (kể cả với quy tắc
#                    định tính) hoặc `globals`.
#   see_also         Danh sách mã quy tắc liên quan, để C7 gom finding cùng chủ đề
#                    thành một khối thay vì báo rời rạc.
#   enabled          true (mặc định) | false — tắt tạm một quy tắc mà không xóa.
#   confidence_floor high | medium | low — chỉ xuất finding từ quy tắc này khi
#                    độ tin cậy đạt mức trở lên. Dùng để siết false positive.
#   note             Ghi chú nội bộ, không hiển thị cho người dùng cuối.
# =============================================================================

