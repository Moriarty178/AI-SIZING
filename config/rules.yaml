    note: >
      Ngưỡng 32 GB không có trong Guideline — cần văn bản nội bộ làm căn cứ
      (rules-crossmap.md mục 3). Code cũng ghim vCPU 8 (Sentinel) / 16 (Cluster);
      phần vCPU không số hóa thành quy tắc riêng vì chưa rõ căn cứ.
    see_also: [ARC-20, ARC-21, ARC-22, RAM-03]
    message_template: >
      Dữ liệu Redis {tong_du_lieu_gb} GB nhưng chọn mô hình {mo_hinh_redis}. Quy ước
      nội bộ: dưới 32 GB dùng Sentinel, từ 32 GB dùng Cluster. Đề nghị xác nhận.

  - id: ARC-20
    name: "Redis Cluster: số master là số lẻ nhỏ nhất giữ RAM mỗi node dưới 64 GB"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-06]
    code_ref: "frontend/script.js:15147-15164"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15147)"
    applies_when: "mo_hinh_redis == 'cluster'"
    check: >
      so_master % 2 == 1
      and ram_moi_node_gb < redis_ram_toi_da_node_gb
    inputs:
      - {name: mo_hinh_redis,   unit: "sentinel | cluster", required: true}
      - {name: so_master,       unit: node, required: true}
      - {name: ram_moi_node_gb, unit: GB,   required: true}
    note: >
      Code chọn N là số LẺ nhỏ nhất lớn hơn 1 sao cho RAM/node dưới 64 GB; nếu đã dưới
      64 GB ngay thì N = 1. Quy tắc này chỉ kiểm hai điều kiện KẾT QUẢ (lẻ, và dưới
      ngưỡng), không ép đúng giá trị N mà code chọn — tránh báo sai khi tài liệu chọn
      N lớn hơn vì lý do khác (ví dụ phân vùng theo nghiệp vụ).
    see_also: [ARC-19, ARC-22]
    message_template: >
      Redis Cluster khai {so_master} master, RAM mỗi node {ram_moi_node_gb} GB. Quy ước
      nội bộ: số master phải LẺ và RAM mỗi node dưới 64 GB.

  - id: ARC-21
    name: "Redis: số slave mỗi master theo mức độ quan trọng"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-07]
    code_ref: "frontend/script.js:15216"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15216)"
    check: "so_slave_moi_master >= so_slave_yeu_cau"
    inputs:
      - {name: so_slave_moi_master, unit: node, required: true}
      - {name: so_slave_yeu_cau,    unit: node, required: true,
         }
    note: >
      Quy ước code: 2 slave nếu mức quan trọng là DBQT, ngược lại 1; riêng Sentinel
      LUÔN 2 slave. C4 tính `so_slave_yeu_cau` từ mức độ quan trọng và mô hình trước,
      rồi so. Dùng ">=" chứ không "==" cùng lý do với ARC-12: nhiều slave hơn mức yêu
      cầu không phải lỗi.
    see_also: [ARC-19, ARC-22]
    message_template: >
      Redis khai {so_slave_moi_master} slave mỗi master, dưới mức {so_slave_yeu_cau}
      theo quy ước nội bộ. Đề nghị xác nhận.

  - id: ARC-22
    name: "Redis: tổng số server = số master × (1 + số slave mỗi master)"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-08]
    code_ref: "frontend/script.js:15243"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15243)"
    formula: "so_master * (1 + so_slave_moi_master)"
    inputs:
      - {name: so_master,           unit: node, required: true}
      - {name: so_slave_moi_master, unit: node, required: true}
    compare_with: tong_server_redis_khai
    tolerance: 0
    note: "Kiểm nhất quán số thuần túy — tổng phải khớp tích, không có dung sai."
    see_also: [ARC-19, ARC-20, ARC-21]
    message_template: >
      Tổng server Redis khai {declared}, tính lại {so_master} master × (1 +
      {so_slave_moi_master} slave) được {expected}.

  - id: ARC-23
    name: "Kafka: RAM mỗi broker = S × R / N + 8, giữ trong dải 16–64 GB"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [kafka]
    scope: phan_he
    round: 2
    legacy_ref: [KFK-05]
    code_ref: "frontend/script.js:15880-15897"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15880)"
    formula: "du_lieu_30_phut_gb * he_so_replica / so_broker + 8"
    inputs:
      - {name: du_lieu_30_phut_gb, unit: GB,   required: true}
      - {name: he_so_replica,      unit: lần,  required: true}
      - {name: so_broker,          unit: node, required: true}
    compare_with: ram_broker_khai
    tolerance: 0.05
    note: >
      Hằng số 8 GB (cho HĐH và JVM overhead) và dải 16–64 GB đều là quy ước nội bộ,
      không có trong Guideline. Phần kiểm dải do ARC-25 làm để tách bạch: quy tắc này
      kiểm CÔNG THỨC, ARC-25 kiểm SỐ BROKER và dải RAM kết quả.
    see_also: [ARC-24, ARC-25, STO-21]
    message_template: >
      RAM mỗi broker khai {declared} GB, tính lại theo quy ước nội bộ được {expected}
      GB (chênh {diff_pct}%).

