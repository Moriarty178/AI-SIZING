# HAI TRỤC PHÂN LOẠI — xem docs/rules/rules-crossmap.md mục 5.
# Một quy tắc có thể thuộc cả hai: bản sizing Redis vừa là "định cỡ máy chủ" theo
# Guideline, vừa là "module Redis" theo web app.
#
# Trục 1 — loại thiết bị, theo cách Guideline chia chương (dùng cho MỌI quy tắc).
equipment_types:
  - may_chu          # 4. Định cỡ máy chủ          (R36–R52)
  - luu_tru          # 5. Định cỡ thiết bị lưu trữ (R54–R69)
  - sao_luu          # 6. Định cỡ thiết bị sao lưu (R70–R76)
  - san_switch       # 7. SAN switch                (R77–R78)
  - lan_switch       # 8. LAN switch                (R79–R82)
  - firewall         # 9. Firewall                  (R83–R85)
  - load_balancer    # 10. Cân bằng tải             (R86–R87)
  - rack             # 11. Tủ Rack                  (R88–R90)
  - cap_phat         # B. Cấp phát, thu hồi         (R91–R97)
  - kiem_thu         # C. Kiểm thử hiệu năng        (R98–R99)
  # --- Hai giá trị bổ sung 2026-08-26, quyết định khi gỡ chặn cho mục 0.5 ---
  # Guideline chia chương theo LOẠI THIẾT BỊ, nhưng ~21 quy tắc không gắn được
  # với thiết bị nào: 10 quy tắc thủ tục/phương pháp áp cho mọi thiết bị (R26,
  # R30, R102…) và 11 mục checklist chỉ nói về cấu trúc tài liệu (CL-2.2, CL-2.6…).
  # Vì `applies_to_equipment` là trường BẮT BUỘC, cần hai giá trị này — nếu không
  # sẽ phải liệt kê cả 10 loại thiết bị cho một quy tắc về... mục lục tài liệu.
  - tat_ca          # áp cho MỌI loại thiết bị — quy tắc thủ tục, phương pháp
                    # định cỡ, nguyên tắc chung. VD: R26, R30, R31, R102, R103.
  - tai_lieu        # KHÔNG gắn thiết bị nào — yêu cầu về cấu trúc/trình bày của
                    # bản sizing. VD: CL-2.2 mô tả tổng quan, CL-2.6 mô hình
                    # logic, CL-2.8 luồng nghiệp vụ, CL-2.9 bảng tổng hợp.
#
# QUY ƯỚC "thiết bị mạng": Guideline nói chung "thiết bị mạng" ở R09 và R12.
# KHÔNG thêm giá trị `mang` (sẽ chồng lấn và gây nhập nhằng khi so khớp) — thay
# vào đó liệt kê đủ bốn loại:
#     applies_to_equipment: [san_switch, lan_switch, firewall, load_balancer]

# Phạm vi chấm — một quy tắc sinh bao nhiêu lần đánh giá trên một bản sizing.
# Checklist thẩm định phân rõ ba cấp: Tổng quan / từng phân hệ / từng công nghệ
# lưu trữ trong phân hệ. Độ mịn này khớp sẵn với web app hiện hành
# (moduleInstanceReviews[].instanceKey và storageRowReviews[].rowIndex).
evaluation_scopes:
  - he_thong                      # một lần cho cả hệ thống
  - phan_he                       # một lần cho mỗi phân hệ có trong tài liệu
  - phan_he_x_cong_nghe_luu_tru   # một lần cho mỗi công nghệ lưu trữ trong mỗi phân hệ

# Trục 2 — module phần mềm, theo web app hiện hành (frontend/script.js —
# MODULE_TEMPLATE_MAPPING). CHỈ điền cho quy tắc đặc thù công nghệ; để trống
# nghĩa là quy tắc áp dụng cho mọi module.
module_types:
  - app
  - mariadb
  - redis
  - kafka
  - k8s
  - lb_fw
  - other

# Ngưỡng dùng chung, tham chiếu được từ `formula` của nhiều quy tắc.
# Giữ ở một chỗ để sửa một lần, tránh lệch giữa các quy tắc.
#
# Giá trị đã ĐỐI CHIẾU với Guideline (docs/rules/rules-formulas.md), nhưng vẫn phụ
# thuộc việc xác minh tài liệu còn hiệu lực — xem `sources.status` ở trên.
globals:
  # Hệ số đảm bảo KPI — R49 (trang 23); tương ứng ngưỡng R02/R03/R04 (trang 8)
  cpu_kpi: 0.75         # Kkpi_cpu  — tải CPU tối đa 75%
  ram_kpi: 0.90         # Kkpi_ram  — tải RAM tối đa 90%
  disk_kpi: 0.80        # Kkpi_dia  — tải ổ cứng tối đa 80%
  error_margin: 1.10    # Ksaisố    — dự phòng sai số 10% (R19, R49)

  # Dự phòng thiết bị mạng — R09 (trang 9); dùng lại ở R77, R79, R83, R84, R86
  port_reserve: 1.20    # Kdph_port / Kdph_thongluong / Kdph_CPS / Kdph_luuluong

  # Hệ số dung lượng thô — R57 (trang 26)
  format_ratio: 1.10    # TyLe_format
  storage_error_ratio: 1.10   # TyLe_saiso (lưu trữ — tách khỏi error_margin máy chủ)
  storage_reserve: 1.25 # TyLe_duphong — mục tiêu dùng ≤ 80% dung lượng

  # Overcommit — R21, R22 (trang 7). Lưu ý R94 (cấp phát) cho ram ≤ 1.5, khác ngữ
  # cảnh với R22 (định cỡ) = 1. Xem rules-formulas.md điểm 9.
  overcommit_cpu: 4     # OR CPU thường; = 2 với VM hiệu năng cao
  overcommit_ram: 1     # OR RAM khi ĐỊNH CỠ

  # Quy ước thay Phụ lục 02 (đã chốt 2026-08-24) — rules-formulas.md
  cint_rated_per_vcpu: 3   # VM (~90% trường hợp)
  # Máy chủ vật lý (~10%): KHÔNG có mặc định → None, tự lấy từ spec.org (NT4)

  # Ngoại lệ ngưỡng dung lượng lưu trữ — R07, R08 (trang 8)
  ssd_kpi: 0.75         # SSD cho HĐH / DB OLTP / cache / snapshot (R07)
  volume_lon_kpi: 0.90  # volume lớn, dữ liệu lâu dài > 03 tháng, media, CDR (R08)
  # [CHƯA CHẮC] R08 cho một KHOẢNG 80–90%, không phải hằng số. Đang lấy cận trên 0.90
  # để không sinh cảnh báo sai; chờ người thẩm định chốt. rules-formulas.md điểm 6.

  # Độ dài tối thiểu của khoảng đo tải — R36 (trang 18)
  do_dai_do_toi_thieu_ngay: 30

  # Quy ước chung: mọi kết quả định cỡ làm tròn LÊN (thay cho quy tắc MDB-07 của
  # code web app — xem docs/rules/rules-id-map.md, mục quy tắc bị loại).
  lam_tron: "ceil"

  # Quy đổi SPEC CPU2006 -> CPU2017 — R17 (trang 9)
  spec2006_to_2017_int_peak: 8.38
  spec2006_to_2017_int_base: 9.36
  spec2006_to_2017_fp_peak: 6.74
  spec2006_to_2017_fp_base: 7.38

  # Overcommit CPU cho VM hiệu năng cao — R21 (trang 7); mức thường là `overcommit_cpu`
  overcommit_cpu_hieu_nang_cao: 2

  # Tài nguyên hệ thống nền — R46, R47 (trang 21)
  hdh_min_core: 2            # HĐH máy chủ tối thiểu 02 core
  hdh_min_ram_gb: 4          # và 04 GB RAM
  hypervisor_cpu_ratio: 0.10 # hypervisor chiếm 10% CPU máy chủ
  hypervisor_ram_gb: 6       # và 6 GB RAM

  # Quy đổi máy ảo — R52 (trang 23)
  thread_per_core_intel: 2   # Hyper-Threading

  # Kafka — ngưỡng chọn vCPU broker (quy ước nội bộ, frontend/script.js:15934)
  kafka_nguong_throughput_mbs: 50
  kafka_vcpu_broker_thap: 8
  kafka_vcpu_broker_cao: 16

  # Sao lưu — R73, R74 (trang 31–32)
  tape_so_ban_toi_thieu: 2      # mỗi tập dữ liệu nằm trên >= 02 băng từ khác nhau
  tape_he_so_du_phong: 1.1      # [CHƯA CHẮC] suy từ R74, R71/R72 không ghi tường minh
  tape_driver_toi_thieu: 2
  tape_duong_ket_noi_toi_thieu: 2

  # Tỷ lệ đọc/ghi mặc định — R63 (trang 27)
  read_ratio: 0.65
  write_ratio: 0.35
  # [CHƯA CHẮC] "đa phần ứng dụng Viettel" — cần xác nhận có được thay bằng số liệu
  # đo thực tế của hệ thống khi có hay không. rules-formulas.md điểm 10.

  # Hotspare — R69 (trang 30)
  hotspare_min: 2          # tối thiểu 02 ổ mỗi loại
  hotspare_ratio: 0.07     # hoặc 7% số ổ cùng loại, làm tròn LÊN

  # Thời gian đo IOPS tối thiểu — R60 (trang 26)
  iops_do_toi_thieu_ngay: 7

  # -------------------------------------------------------------------------
  # NGƯỠNG NỘI BỘ theo công nghệ — KHÔNG có trong Guideline, lấy từ code web app
  # (rules-crossmap.md mục 3). Quy tắc dùng chúng đều để `severity: minor` +
  # `confidence_floor: high` cho tới khi có văn bản làm căn cứ.
  # -------------------------------------------------------------------------
  mariadb_so_master_active_active: 3   # code chia cứng cho 3 khi Active-Active
  redis_nguong_cluster_gb: 32          # < 32 GB -> Sentinel; >= 32 GB -> Cluster
  redis_ram_toi_da_node_gb: 64         # chọn N lẻ sao cho RAM/node dưới mức này
  redis_disk_tren_ram: 4               # DISK = 4 x RAM
  kafka_ram_broker_min_gb: 16
  kafka_ram_broker_max_gb: 64
  kafka_broker_min: 3                  # cluster tối thiểu 3 broker
  kafka_broker_max: 20

  # KHÔNG có nguồn trong Guideline — giữ null, không tự điền (NT2/NT4)
  datanode_kpi: null    # code ghim 0.50 nhưng R01–R110 không có quy tắc này


rules:

  # ===========================================================================
  # NHÓM KPI — ngưỡng và hệ số chung, áp cho nhiều loại tài nguyên cùng lúc
  # Bảng mã: docs/rules/rules-id-map.md
  # Công thức gốc: docs/rules/rules-formulas.md
  # ===========================================================================

  - id: KPI-01
    name: "Tải dùng để đánh giá KPI phải là giá trị 95th"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R01]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    note: >
      Quy ước xử lý dữ liệu, không phải một phép so ngưỡng nên không có `check`.
      C4 hiện thực hóa bằng cách LẤY giá trị 95th của chuỗi tải làm đầu vào cho mọi
      quy tắc KPI-02..KPI-08. Quy tắc này sinh finding khi tài liệu nêu rõ đã dùng
      trung bình hoặc đỉnh tuyệt đối thay cho 95th.
    message_template: >
      Tài liệu dùng giá trị {phuong_phap_do} làm tải đánh giá. Theo Guideline, tải
      đánh giá KPI phải lấy giá trị 95th của khoảng đo. Đề nghị tính lại theo 95th.

  - id: KPI-02
    name: "Máy chủ: tải CPU không vượt quá 75%"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R02]
    checklist_ref: [CL-3.x.13]
    code_ref: "frontend/script.js:3845"
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "cpu_95th <= cpu_kpi * 100"
    inputs:
      - {name: cpu_95th, unit: "%", required: true}
    message_template: >
      Tải CPU khai báo {cpu_95th}% vượt ngưỡng 75% của Guideline. Đề nghị tăng cấu
      hình hoặc số node để tải sau khi định cỡ nằm dưới ngưỡng.

  - id: KPI-03
    name: "Máy chủ: tỷ lệ sử dụng RAM không vượt quá 90%"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R03]
    checklist_ref: [CL-3.x.14]
    code_ref: "frontend/script.js:3845"
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "ram_su_dung_gb <= ram_kpi * ram_cau_hinh_gb"
    inputs:
      - {name: ram_su_dung_gb,  unit: GB, required: true}
      - {name: ram_cau_hinh_gb, unit: GB, required: true}
    message_template: >
      RAM sử dụng {ram_su_dung_gb} GB trên cấu hình {ram_cau_hinh_gb} GB, vượt ngưỡng
      90% của Guideline.

  - id: KPI-04
    name: "Máy chủ: tỷ lệ sử dụng ổ cứng không vượt quá 80%"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R04]
    checklist_ref: [CL-3.x.17]
    code_ref: "frontend/script.js:3845"
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "dung_luong_dung_gb <= disk_kpi * dung_luong_kha_dung_gb"
    inputs:
      - {name: dung_luong_dung_gb,     unit: GB, required: true}
      - {name: dung_luong_kha_dung_gb, unit: GB, required: true}
    note: >
      `dung_luong_kha_dung_gb` là dung lượng SAU RAID/format, không phải dung lượng
      thô — đúng tinh thần EVD-01 (R23). Nếu tài liệu không phân biệt hai thứ này thì
      EVD-01 bắt lỗi trước, quy tắc này trả về "chưa đánh giá được".
    message_template: >
      Dung lượng sử dụng {dung_luong_dung_gb} GB trên {dung_luong_kha_dung_gb} GB khả
      dụng, vượt ngưỡng 80% của Guideline.

  - id: KPI-05
    name: "Thiết bị lưu trữ: hiệu năng IOPS không vượt quá 80% năng lực"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R05]
    checklist_ref: [CL-3.x.15]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "iops_95th <= disk_kpi * iops_toi_da"
    inputs:
      - {name: iops_95th,   unit: IOPS, required: true}
      - {name: iops_toi_da, unit: IOPS, required: true}
    note: >
      `iops_toi_da` tra theo loại ổ ở STO-03 (R55). Thiếu loại ổ thì không tra được →
      sinh finding nhóm "thiếu thông tin", KHÔNG đoán (NT4).
    message_template: >
      IOPS thiết kế {iops_95th} trên năng lực {iops_toi_da} IOPS, vượt ngưỡng 80%.

  - id: KPI-06
    name: "Thiết bị lưu trữ: dung lượng sử dụng không vượt quá 80%"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R06]
    checklist_ref: [CL-3.x.17]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "dung_luong_dung_gb <= disk_kpi * dung_luong_kha_dung_gb"
    inputs:
      - {name: dung_luong_dung_gb,     unit: GB, required: true}
      - {name: dung_luong_kha_dung_gb, unit: GB, required: true}
    note: >
      Hai ngoại lệ KPI-07 (SSD 75%) và KPI-08 (volume lớn 80–90%) ĐÈ lên quy tắc này.
      C4 phải xét ngoại lệ trước, khớp mới áp ngưỡng 80% mặc định.
    message_template: >
      Dung lượng lưu trữ sử dụng {dung_luong_dung_gb} GB trên {dung_luong_kha_dung_gb}
      GB khả dụng, vượt ngưỡng 80%.

  - id: KPI-07
    name: "Ngoại lệ: SSD cho HĐH / DB OLTP / cache / snapshot dùng ngưỡng 75%"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R07]
    checklist_ref: [CL-3.x.17]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "dung_luong_dung_gb <= ssd_kpi * dung_luong_kha_dung_gb"
    inputs:
      - {name: dung_luong_dung_gb,     unit: GB, required: true}
      - {name: dung_luong_kha_dung_gb, unit: GB, required: true}
    note: >
      Ngưỡng chặt hơn KPI-06 vì SSD vượt mức này thì tốc độ ghi suy giảm đáng kể
      (xem STO-15 / R68). Chỉ áp khi phân vùng được khai là SSD phục vụ HĐH, DB OLTP,
      cache hoặc snapshot.
    message_template: >
      Phân vùng SSD dùng {dung_luong_dung_gb}/{dung_luong_kha_dung_gb} GB, vượt ngưỡng
      75% áp cho SSD của HĐH / DB OLTP / cache / snapshot.

  - id: KPI-08
    name: "Ngoại lệ: volume lớn, dữ liệu lâu dài, media, CDR dùng ngưỡng 80–90%"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R08]
    checklist_ref: [CL-3.x.17]
    severity: minor
    confidence_floor: high
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 8"
    check: "dung_luong_dung_gb <= volume_lon_kpi * dung_luong_kha_dung_gb"
    inputs:
      - {name: dung_luong_dung_gb,     unit: GB, required: true}
      - {name: dung_luong_kha_dung_gb, unit: GB, required: true}
    note: >
      "[CHƯA CHẮC]" Guideline cho một KHOẢNG 80–90%, không phải hằng số. Đang lấy cận
      TRÊN (`volume_lon_kpi` = 0.90) để không sinh cảnh báo sai — ưu tiên độ chính xác
      hơn độ phủ. Vì vậy `severity: minor` + `confidence_floor: high`.
      Cần người thẩm định chốt giá trị; xem rules-formulas.md điểm 6.
    message_template: >
      Volume dữ liệu dài hạn dùng {dung_luong_dung_gb}/{dung_luong_kha_dung_gb} GB,
      vượt cả cận trên 90% của khoảng cho phép. Đề nghị rà soát.

  - id: KPI-09
    name: "Phải áp hệ số dự phòng sai số tính toán 10%"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R19]
    checklist_ref: [CL-3.x.19]
    code_ref: "frontend/script.js:3846"
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    check: "he_so_sai_so_khai == error_margin"
    inputs:
      - {name: he_so_sai_so_khai, unit: "hệ số", required: true}
    message_template: >
      Tài liệu áp hệ số dự phòng sai số {he_so_sai_so_khai}; Guideline quy định 1.1
      (dự phòng 10%). Đề nghị tính lại.

  - id: KPI-10
    name: "Khoảng đo tải phải dài tối thiểu 01 tháng"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R36]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 18"
    check: "so_ngay_do >= do_dai_do_toi_thieu_ngay"
    inputs:
      - {name: so_ngay_do, unit: ngày, required: true}
    note: >
      Guideline còn yêu cầu bỏ khoảng máy chủ chạy không tải và nêu nguồn số liệu
      (kiểm thử hiệu năng / giám sát / script / log). Phần "nêu nguồn" do EVD-05
      (R37) và PRC-01 (R30) kiểm, không lặp ở đây.
    message_template: >
      Khoảng đo tải chỉ {so_ngay_do} ngày, chưa đủ tối thiểu 01 tháng theo Guideline.

  - id: KPI-11
    name: "Diskgroup / raidgroup: tải dung lượng và hiệu năng không quá 80%"
    type: quantitative
    applies_to_equipment: [luu_tru, may_chu]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R38]
    checklist_ref: [CL-3.x.15, CL-3.x.17]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 17"
    check: >
      dung_luong_dung_gb <= disk_kpi * dung_luong_kha_dung_gb
      and iops_95th <= disk_kpi * iops_toi_da
    inputs:
      - {name: dung_luong_dung_gb,     unit: GB,   required: true}
      - {name: dung_luong_kha_dung_gb, unit: GB,   required: true}
      - {name: iops_95th,              unit: IOPS, required: true}
      - {name: iops_toi_da,            unit: IOPS, required: true}
    note: >
      Khác KPI-04/KPI-06 ở chỗ chấm theo TỪNG diskgroup/raidgroup, không phải theo
      tổng của phân hệ. Một hệ có tổng dung lượng dưới ngưỡng vẫn có thể có một
      raidgroup vượt. Ngoại lệ theo KPI-07, KPI-08.
    message_template: >
      Diskgroup/raidgroup vượt ngưỡng 80%: dung lượng {dung_luong_dung_gb}/
      {dung_luong_kha_dung_gb} GB, IOPS {iops_95th}/{iops_toi_da}.

  - id: KPI-12
    name: "Hệ số so sánh Ksosánh = thông số hệ mới / hệ tham chiếu"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R40]
    checklist_ref: [CL-2.4]
    code_ref: "frontend/script.js:6695"
    severity: critical
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 20"
    formula: "thong_so_he_moi / thong_so_he_tham_chieu"
    inputs:
      - {name: thong_so_he_moi,        unit: "theo thông số (CCU / TPS / QPS…)", required: true}
      - {name: thong_so_he_tham_chieu, unit: "theo thông số (CCU / TPS / QPS…)", required: true}
    compare_with: he_so_so_sanh_khai
    tolerance: 0.01
    note: >
      Trong web app gọi là `factor = định_cỡ / POC` (SCL-01, KFK-01) — cùng một thứ.
      Hai thông số phải CÙNG loại và cùng đơn vị; so CCU của hệ mới với TPS của hệ
      tham chiếu là sai phương pháp.
    message_template: >
      Hệ số so sánh khai {declared}, tính lại theo thông số đầu vào được {expected}
      (chênh {diff_pct}%). Đề nghị rà soát.

  - id: KPI-13
    name: "Công thức tổng tài nguyên: Σ dùng × Ksosánh / Kkpi × Ksaisố"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R48]
    checklist_ref: [CL-3.x.13, CL-3.x.14, CL-3.x.17]
    code_ref: "frontend/script.js:6704"
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 22"
    formula: "tong_su_dung * he_so_so_sanh / he_so_kpi * error_margin"
    inputs:
      - {name: tong_su_dung,    unit: "theo tài nguyên (SPEC / GB)", required: true}
      - {name: he_so_so_sanh,   unit: "hệ số", required: true}
      - {name: he_so_kpi,       unit: "hệ số", required: true}
    compare_with: tong_tai_nguyen_khai
    tolerance: 0.02
    note: >
      Một công thức dùng cho cả CPU, RAM và ổ cứng — chỉ khác `he_so_kpi`
      (0.75 / 0.9 / 0.8, xem KPI-14). C4 chạy ba lần, mỗi lần một loại tài nguyên.
      Hệ số KPI và hệ số sai số áp ĐÚNG MỘT LẦN trên tổng tài nguyên; áp hai lần là
      lỗi C-02 mà web app đang mắc với Redis (rules-crossmap.md mục 2).
    message_template: >
      Tổng tài nguyên khai {declared}, tính lại theo công thức Guideline được
      {expected} (chênh {diff_pct}%). Đề nghị rà soát cách áp hệ số.

  - id: KPI-14
    name: "Hệ số đảm bảo KPI: CPU 0.75 · RAM 0.9 · ổ cứng 0.8"
    type: quantitative
    applies_to_equipment: [may_chu, luu_tru]
    scope: phan_he
    round: 2
    legacy_ref: [R49]
    checklist_ref: [CL-3.x.13, CL-3.x.14, CL-3.x.17]
    code_ref: "frontend/script.js:6704-6705"
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 22"
    check: >
      he_so_kpi_cpu_khai == cpu_kpi
      and he_so_kpi_ram_khai == ram_kpi
      and he_so_kpi_dia_khai == disk_kpi
    inputs:
      - {name: he_so_kpi_cpu_khai, unit: "hệ số", required: true}
      - {name: he_so_kpi_ram_khai, unit: "hệ số", required: true}
      - {name: he_so_kpi_dia_khai, unit: "hệ số", required: true}
    note: >
      Đây chính là chỗ web app đang sai với Redis: dùng 0.8 cho RAM thay vì 0.9
      (rules-crossmap.md C-01). Quy tắc này bắt được đúng kiểu lỗi đó trên bản Word.
    message_template: >
      Hệ số đảm bảo KPI khai (CPU {he_so_kpi_cpu_khai} / RAM {he_so_kpi_ram_khai} /
      ổ cứng {he_so_kpi_dia_khai}) khác quy định 0.75 / 0.9 / 0.8.

  - id: KPI-15
    name: "Datanode: hiệu suất sử dụng không quá 50%"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [other]
    scope: phan_he
    round: 2
    legacy_ref: [KPI-04]
    code_ref: "frontend/script.js:3845"
    severity: minor
    confidence_floor: high
    enabled: false
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js FIXED_SIZING_RULE)"
    check: "datanode_95th <= datanode_kpi * 100"
    inputs:
      - {name: datanode_95th, unit: "%", required: true}
    note: >
      `enabled: false` vì `globals.datanode_kpi` đang là `null` — quy tắc này KHÔNG có
      nguồn trong Guideline (rules-crossmap.md C-04) và web app cũng chưa cài đặt ở
      đâu. Bật lại khi có văn bản gốc cho ngưỡng 50%; trước đó bật lên là vi phạm NT2.
    message_template: >
      Hiệu suất sử dụng datanode {datanode_95th}% vượt ngưỡng nội bộ 50%.

  - id: KPI-16
    name: "Tính tăng trưởng mở rộng trong vòng 01 năm"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [GRW-01]
    checklist_ref: [CL-2.10a]
    code_ref: "frontend/script.js:3843"
    severity: minor
    confidence_floor: high
    enabled: false
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js FIXED_SIZING_RULE)"
    check: "chu_ky_tang_truong_thang == 12"
    inputs:
      - {name: chu_ky_tang_truong_thang, unit: tháng, required: true}
    note: >
      "[CHƯA CHẮC] MÂU THUẪN CHƯA GIẢI" — web app ghim 01 năm cho định cỡ, trong khi
      ALC-01 (R93) quy định cấp phát đảm bảo hoạt động 06 THÁNG. Hai mốc có thể phục
      vụ hai việc khác nhau (định cỡ vs cấp phát) hoặc là lệch thật; xem
      rules-crossmap.md C-05. Giữ `enabled: false` cho tới khi người thẩm định trả lời
      — bật lên khi chưa rõ sẽ sinh cảnh báo mâu thuẫn với chính ALC-01.
    message_template: >
      Tài liệu tính tăng trưởng cho {chu_ky_tang_truong_thang} tháng; quy ước nội bộ
      của web app là 01 năm. Đề nghị làm rõ chu kỳ áp dụng.

  # ===========================================================================
  # NHÓM MTH — phương pháp định cỡ (Dạng I / II / III)
  #
  # BỐN QUY TẮC NÀY LOẠI TRỪ LẪN NHAU. C5 phải xác định `dang_dinh_co` TRƯỚC, rồi
  # `applies_when` chỉ mở đúng một quy tắc; ba quy tắc còn lại trả "không áp dụng".
  # Chạy cả bốn sẽ sinh ba finding sai cho mọi bản sizing.
  # Tiêu chí đầy đủ: docs/rules/rules-criteria.md mục 4 và 5.3.
  # ===========================================================================

  - id: MTH-01
    name: "Dạng I: phải nêu đặc điểm tương đồng của hệ thống tham chiếu"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R26]
    checklist_ref: [CL-2.1, CL-2.4]
    severity: major
    source_doc: "TL-DINH-CO, mục A.2 Cơ sở định cỡ, trang 10"
    applies_when: "dang_dinh_co == 1 and co_he_tham_chieu"
    inputs:
      - {name: dang_dinh_co,       unit: "1 | 2 | 3", required: true}
      - {name: co_he_tham_chieu,   unit: "đúng/sai", required: true}
    criteria: >
      Tài liệu phải nêu đặc điểm tương đồng giữa hệ định cỡ và hệ tham chiếu trên CẢ
      NĂM phương diện mà Guideline liệt kê: (1) kiến trúc, (2) công nghệ, (3) các chức
      năng, (4) luồng nghiệp vụ chính, (5) đối tượng sử dụng.
      Nêu TÊN hệ tham chiếu thôi là CHƯA ĐẠT — Guideline yêu cầu "nêu các đặc điểm
      tương đồng", tức phải có so sánh.
      KHÔNG ĐẠT khi: chỉ nêu tên hệ tham chiếu mà không so sánh phương diện nào; so
      sánh qua loa một hai phương diện (thường chỉ "cùng dùng Java/Oracle") rồi kết
      luận tương đồng; hoặc hệ tham chiếu khác hẳn về đối tượng sử dụng hay luồng
      nghiệp vụ chính nhưng vẫn được dùng làm cơ sở (ví dụ lấy hệ nội bộ vài trăm
      người dùng làm tham chiếu cho hệ phục vụ hàng triệu khách hàng).
    examples:
      pass:
        - "Tương đồng về: kiến trúc (microservice trên K8S, 3 lớp); công nghệ (Spring
           Boot, MariaDB, Redis, Kafka); chức năng (tạo/tra cứu/cập nhật đơn, đối soát
           cuối ngày); luồng nghiệp vụ chính (đơn hàng → duyệt → xuất kho → đối soát);
           đối tượng sử dụng (nhân viên giao dịch tại điểm bán, 3.000–4.000 CCU)."
      fail:
        - "Định cỡ dựa trên hệ thống Quản lý đơn hàng hiện có, là hệ thống tương tự về
           quy mô và công nghệ."
    see_also: [MTH-02, MTH-03, MTH-04]
    note: >
      NÂNG MỨC: nếu là hệ CNTT nội bộ Tập đoàn định cỡ theo Dạng I thì theo trích dẫn
      bổ sung cùng trang, hệ đó KHÔNG được cấp phát trên hạ tầng Tập đoàn cho tới khi
      có kiểm thử hiệu năng. Trường hợp đó C7 sinh finding riêng mức `critical` —
      người dùng cần biết ngay là hồ sơ sẽ bị trả lại bất kể phần còn lại viết tốt
      đến đâu. Xem thêm ARC-10 (R91).

  - id: MTH-02
    name: "Dạng I không có hệ tham chiếu: phải hoàn thiện sản phẩm và kiểm thử hiệu năng"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R27]
    checklist_ref: [CL-2.1, CL-2.4]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.2 Cơ sở định cỡ, trang 10"
    applies_when: "dang_dinh_co == 1 and not co_he_tham_chieu"
    inputs:
      - {name: dang_dinh_co,     unit: "1 | 2 | 3", required: true}
      - {name: co_he_tham_chieu, unit: "đúng/sai", required: true}
    criteria: >
      Tài liệu phải thừa nhận không có hệ tham chiếu tương đồng, VÀ nêu rõ kế hoạch
      hoàn thiện sản phẩm cộng kiểm thử hiệu năng trước khi xin cấp phát chính thức.
      KHÔNG ĐẠT khi: không có hệ tham chiếu nhưng vẫn đưa ra con số tài nguyên cụ thể
      như thể đã đo được; hoặc lấy một hệ KHÔNG tương đồng làm tham chiếu để né yêu
      cầu kiểm thử (trường hợp này MTH-01 bắt phần "không tương đồng", quy tắc này
      bắt phần "chưa kiểm thử").
    examples:
      pass:
        - "Sản phẩm chưa hoàn thiện và không có hệ thống tương đồng trong Tập đoàn.
           Bản định cỡ này phục vụ đầu tư môi trường kiểm thử. Sau khi hoàn thiện sản
           phẩm, đơn vị sẽ kiểm thử hiệu năng và định cỡ lại trước khi xin cấp phát
           production."
      fail:
        - "Đây là sản phẩm mới, chưa có hệ thống tương tự. Ước tính nhu cầu: 12 máy chủ
           ứng dụng 16 vCPU/32 GB và cụm DB 03 node."
    see_also: [MTH-01, MTH-03, MTH-04]
    note: >
      `severity: critical` vì hệ CNTT nội bộ Tập đoàn định cỡ theo Dạng I KHÔNG được
      cấp phát cho tới khi có kiểm thử hiệu năng (trích dẫn tại MTH-01).

  - id: MTH-03
    name: "Dạng II: định cỡ bằng môi trường kiểm thử, không dùng cách của Dạng I"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R28]
    checklist_ref: [CL-2.1, CL-2.4]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.2 Cơ sở định cỡ, trang 10"
    applies_when: "dang_dinh_co == 2"
    inputs:
      - {name: dang_dinh_co, unit: "1 | 2 | 3", required: true}
    criteria: >
      Phải có đủ BA điều: (1) nêu rõ đã đo trên MÔI TRƯỜNG KIỂM THỬ, không phải ước
      lượng; (2) đo theo NHIỀU MẪU ĐẦU VÀO khác nhau (liên hệ TST-01 / R41: tối thiểu
      5 mẫu, mỗi mẫu 5 lần); (3) tính ra BÌNH QUÂN tài nguyên trên mỗi người dùng hoặc
      mỗi giao dịch, rồi mới nhân lên theo quy mô mục tiêu.
      KHÔNG ĐẠT — trường hợp quan trọng nhất: đã có phần mềm nhưng vẫn định cỡ theo hệ
      tham chiếu tương đồng (cách của Dạng I); Guideline cấm rõ điều này.
      Cũng KHÔNG ĐẠT khi: có đo nhưng chỉ một mẫu đầu vào duy nhất; hoặc nhảy thẳng từ
      số liệu đo sang tổng tài nguyên mà không qua bước bình quân trên mỗi giao dịch.
    examples:
      pass:
        - "Đo trên môi trường kiểm thử với 05 mức tải (500/1.000/2.000/3.000/5.000
           CCU), mỗi mức lặp 05 lần. Bình quân 1 CCU tiêu thụ 0,018 vCPU và 12 MB RAM.
           Với mục tiêu 60.000 CCU → 1.080 vCPU, 720 GB RAM trước khi áp hệ số KPI và
           sai số."
      fail:
        - "Sản phẩm đã triển khai tại đơn vị A. Định cỡ cho đơn vị B tham chiếu theo
           cấu hình đang chạy tại A, nhân hệ số 1,5 theo tỷ lệ người dùng."
    see_also: [MTH-01, MTH-02, MTH-04, TST-01]

  - id: MTH-04
    name: "Dạng III: định cỡ theo hiện trạng và yêu cầu mở rộng"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R29]
    checklist_ref: [CL-2.1, CL-2.4]
    severity: major
    source_doc: "TL-DINH-CO, mục A.2 Cơ sở định cỡ, trang 11"
    applies_when: "dang_dinh_co == 3"
    inputs:
      - {name: dang_dinh_co, unit: "1 | 2 | 3", required: true}
    criteria: >
      Phải có CẢ HAI VẾ.
      Vế hiện trạng: tải thực tế đang chạy (giá trị 95th, khoảng đo tối thiểu 01 tháng
      theo KPI-10 / R36), số người dùng hiện tại, chất lượng dịch vụ hiện tại.
      Vế yêu cầu mở rộng: con số mục tiêu cụ thể — số người dùng, CCU/TPS/RPS, latency
      yêu cầu.
      Thiếu một trong hai vế thì không tính được hệ số so sánh Ksosánh (KPI-12 / R40),
      tức không có cơ sở tính toán.
      KHÔNG ĐẠT khi: chỉ nêu cấu hình đang chạy mà không nêu tải thực tế đo được; chỉ
      nêu mục tiêu mở rộng mà không nêu hiện trạng; hoặc nêu cả hai nhưng lấy tải đỉnh
      tuyệt đối / trung bình thay vì 95th.
    examples:
      pass:
        - "Hiện trạng: 03 máy chủ ứng dụng, tải CPU 95th = 62% (đo tháng 5–6/2026 qua
           Zabbix), phục vụ 18.000 CCU giờ cao điểm, latency P95 = 240 ms. Yêu cầu mở
           rộng: 45.000 CCU, giữ latency P95 ≤ 300 ms → Ksosánh = 45.000/18.000 = 2,5."
      fail:
        - "Hệ thống hiện có 03 máy chủ 16 vCPU/32 GB. Do nhu cầu tăng, đề nghị bổ sung
           thêm 04 máy chủ cùng cấu hình."
    see_also: [MTH-01, MTH-02, MTH-03, KPI-10, KPI-12]

  # ===========================================================================
  # NHÓM ARC — kiến trúc, dự phòng, hạ tầng, số lượng node
  # ARC-01..14 Guideline · ARC-15..16 checklist · ARC-17..25 code web app
  # ARC-26..27 849/QĐ-CNVTQĐ
  # ===========================================================================

  - id: ARC-01
    name: "Thiết bị mạng: dự phòng 20% số port và thông lượng"
    type: quantitative
    applies_to_equipment: [san_switch, lan_switch, firewall, load_balancer]
    scope: he_thong
    round: 2
    legacy_ref: [R09]
    checklist_ref: [CL-3.x.11, CL-3.x.12]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    check: >
      port_thiet_ke >= port_dung * port_reserve
      and throughput_thiet_ke >= throughput_dung * port_reserve
    inputs:
      - {name: port_thiet_ke,       unit: port, required: true}
      - {name: port_dung,           unit: port, required: true}
      - {name: throughput_thiet_ke, unit: Mbps, required: true}
      - {name: throughput_dung,     unit: Mbps, required: true}
    note: >
      Hệ số 1.2 (`port_reserve`) ở đây là nguồn gốc của Kdph dùng lại trong SAN-01,
      LAN-01, FWL-01, FWL-02, LBA-01 — sửa một chỗ trong `globals` là đổi cả loạt.
    message_template: >
      Thiết bị mạng thiết kế {port_thiet_ke} port / {throughput_thiet_ke} Mbps, chưa
      đạt mức dự phòng 20% so với nhu cầu {port_dung} port / {throughput_dung} Mbps.

  - id: ARC-02
    name: "Hệ dự phòng không được quá tải khi một node lỗi"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: phan_he
    round: 2
    legacy_ref: [R10]
    checklist_ref: [CL-2.11, CL-3.x.6]
    code_ref: "frontend/script.js:3844"
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    applies_when: "so_node >= 2"
    inputs:
      - {name: so_node, unit: node, required: true}
    criteria: >
      Tài liệu phải cho thấy đã tính đến kịch bản MẤT 1 NODE, gồm cả ba: (1) nêu rõ mô
      hình dự phòng của phân hệ (active-active hay active-standby); (2) có phép tính
      hoặc lập luận cho thấy tải dồn về các node còn lại VẪN DƯỚI ngưỡng KPI (CPU 75%,
      RAM 90%, ổ cứng 80% — theo KPI-02/03/04); (3) với active-active N node, tải mỗi
      node khi mất 1 node là tổng_tải/(N-1), và giá trị đó phải được đối chiếu với
      ngưỡng.
      KHÔNG ĐẠT khi: chỉ khai "có dự phòng" mà không có phép tính kịch bản mất node;
      tính tải chia đều cho N node nhưng không xét trường hợp còn N-1; hoặc cấu hình
      vừa khít ở trạng thái bình thường, mất 1 node là vượt ngưỡng.
    examples:
      pass:
        - "Cụm App gồm 03 node active-active, mỗi node 16 vCPU. Tải giờ cao điểm 24
           vCPU, phân bổ 8 vCPU/node (50%). Khi mất 01 node: 24/2 = 12 vCPU/node =
           75% — vẫn ở ngưỡng cho phép."
      fail:
        - "Cụm App gồm 03 node active-active, mỗi node 16 vCPU, tải 24 vCPU chia đều
           8 vCPU/node. Hệ thống có dự phòng đầy đủ."
    see_also: [ARC-03, ARC-12, KPI-02, KPI-03, KPI-04]

  - id: ARC-03
    name: "Máy chủ dự phòng tối thiểu N+1 ở mức vật lý"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R11]
    checklist_ref: [CL-3.x.6]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    check: "so_may_du_phong >= 1"
    inputs:
      - {name: so_may_du_phong, unit: máy, required: true}
    note: >
      Guideline diễn đạt bằng kết quả mong muốn: "các ứng dụng, cơ sở dữ liệu hoạt
      động bình thường khi có 01 máy chủ gặp sự cố". Phần kiểm SỐ LƯỢNG ở đây; phần
      kiểm TẢI sau khi mất node do ARC-02 làm. Mức N+M chi tiết xem ARC-09.
    message_template: >
      Phân hệ khai {so_may_du_phong} máy dự phòng. Guideline yêu cầu tối thiểu N+1,
      tức ít nhất 01 máy dự phòng ở mức vật lý.

  - id: ARC-04
    name: "Thiết bị mạng phải dự phòng 1+1"
    type: quantitative
    applies_to_equipment: [san_switch, lan_switch, firewall, load_balancer]
    scope: he_thong
    round: 2
    legacy_ref: [R12]
    checklist_ref: [CL-3.x.11, CL-3.x.12]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    check: "so_thiet_bi >= 2"
    inputs:
      - {name: so_thiet_bi, unit: thiết bị, required: true}
    message_template: >
      Chỉ khai {so_thiet_bi} thiết bị mạng. Guideline yêu cầu dự phòng 1+1 — đủ 02 bộ,
      01 hoạt động và 01 dự phòng.

  - id: ARC-05
    name: "Máy chủ ảo hóa: không quá 32 vCPU và 128 GB RAM mỗi VM"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R13]
    checklist_ref: [CL-3.x.3]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    applies_when: "hinh_thuc_cap_phat == 'ao_hoa'"
    check: "vcpu_moi_vm <= 32 and ram_moi_vm_gb <= 128"
    inputs:
      - {name: hinh_thuc_cap_phat, unit: "ao_hoa | vat_ly | bare_metal", required: true}
      - {name: vcpu_moi_vm,        unit: vCPU, required: true}
      - {name: ram_moi_vm_gb,      unit: GB,   required: true}
    note: >
      Vượt ngưỡng KHÔNG tự động là sai — Guideline cho phép chuyển sang định cỡ máy
      chủ vật lý (ARC-06 / R14). Câu finding phải đề nghị chuyển sang vật lý, không
      đề nghị ép cấu hình xuống cho vừa ngưỡng.
    see_also: [ARC-06]
    message_template: >
      VM khai {vcpu_moi_vm} vCPU / {ram_moi_vm_gb} GB RAM, vượt giới hạn máy chủ ảo
      hóa (32 vCPU, 128 GB). Đề nghị chuyển sang định cỡ máy chủ vật lý và nêu lý do.

  - id: ARC-06
    name: "Dịch vụ vượt cấu hình ảo hóa phải định cỡ máy chủ vật lý"
    type: qualitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R14]
    checklist_ref: [CL-3.x.3]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    applies_when: "hinh_thuc_cap_phat == 'ao_hoa'"
    inputs:
      - {name: hinh_thuc_cap_phat, unit: "ao_hoa | vat_ly | bare_metal", required: true}
    criteria: >
      ĐẠT khi một trong hai: (1) cấu hình mỗi VM nằm trong giới hạn ảo hóa (tối đa 32
      vCPU và 128 GB RAM, theo ARC-05); hoặc (2) vượt giới hạn nhưng tài liệu ĐÃ
      chuyển sang định cỡ máy chủ vật lý VÀ nêu rõ lý do.
      KHÔNG ĐẠT khi: khai VM trên 32 vCPU hoặc trên 128 GB RAM mà vẫn để hình thức cấp
      phát là ảo hóa; hoặc nhu cầu tính ra vượt giới hạn nhưng tài liệu "ép" xuống cho
      vừa ngưỡng mà không giải trình.
    examples:
      pass:
        - "Phân hệ xử lý luồng thời gian thực cần 48 vCPU, vượt giới hạn 32 vCPU của
           máy chủ ảo hóa nên định cỡ trên máy chủ vật lý 2 × 24 core."
      fail:
        - "Phân hệ xử lý luồng thời gian thực: 01 VM cấu hình 48 vCPU, 192 GB RAM."
    see_also: [ARC-05, ARC-11]
    note: >
      Phần so ngưỡng 32 vCPU / 128 GB là ĐỊNH LƯỢNG, do ARC-05 (C4) làm. Quy tắc này
      chỉ kiểm phần GIẢI TRÌNH khi vượt — phần C5. Hai quy tắc bổ sung nhau, không
      trùng; khi cả hai cùng trượt thì C7 gom lại một khối.

  - id: ARC-07
    name: "VM dự phòng 1+N phải phân bổ trên ít nhất hai máy chủ vật lý"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R15]
    checklist_ref: [CL-3.x.6]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    applies_when: "hinh_thuc_cap_phat == 'ao_hoa' and so_node >= 2"
    check: "so_host_vat_ly >= 2"
    inputs:
      - {name: hinh_thuc_cap_phat, unit: "ao_hoa | vat_ly | bare_metal", required: true}
      - {name: so_node,            unit: node, required: true}
      - {name: so_host_vat_ly,     unit: host, required: true}
    note: >
      Chống lỗi cùng host: 02 VM làm DB dự phòng 1+1 mà nằm chung một máy chủ vật lý
      thì hỏng phần cứng là mất cả cặp. Liên quan ALC-05 (R108) — phần quy hoạch cấp
      phát cũng yêu cầu điều này.
    see_also: [ALC-05]
    message_template: >
      {so_node} VM dự phòng đang nằm trên {so_host_vat_ly} máy chủ vật lý. Guideline
      yêu cầu phân bổ trên tối thiểu 02 máy chủ vật lý khác nhau.

  - id: ARC-08
    name: "Cấu hình 01 máy chủ = tổng tài nguyên / số máy hoạt động"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R50]
    checklist_ref: [CL-3.x.20]
    code_ref: "frontend/script.js:6587"
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 23"
    formula: "tong_tai_nguyen / so_may_hoat_dong"
    inputs:
      - {name: tong_tai_nguyen,    unit: "theo tài nguyên (SPEC / GB)", required: true}
      - {name: so_may_hoat_dong,   unit: máy, required: true}
    compare_with: cau_hinh_moi_may_khai
    tolerance: 0.02
    note: >
      `so_may_hoat_dong` là N (số máy CHẠY), không tính máy dự phòng M — xem ARC-09.
      Kết quả làm tròn LÊN theo quy ước `globals.lam_tron`.
    message_template: >
      Cấu hình mỗi máy khai {declared}, tính lại từ tổng {tong_tai_nguyen} chia
      {so_may_hoat_dong} máy được {expected} (chênh {diff_pct}%).

  - id: ARC-09
    name: "Mức dự phòng N+M; M mặc định bằng 1"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R51]
    checklist_ref: [CL-3.x.6, CL-3.2.4]
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 23"
    check: "tong_may_khai == so_may_hoat_dong + so_may_du_phong"
    inputs:
      - {name: tong_may_khai,     unit: máy, required: true}
      - {name: so_may_hoat_dong,  unit: máy, required: true}
      - {name: so_may_du_phong,   unit: máy, required: true}
    note: >
      Kiểm tính nhất quán: tổng số máy đề xuất phải bằng N + M. M mặc định 1 (ARC-03
      kiểm mức tối thiểu này), điều chỉnh theo phân loại hệ thống — mức cao hơn thì
      cần dẫn chiếu phân loại, xem ARC-13.
    see_also: [ARC-03, ARC-13]
    message_template: >
      Tổng số máy khai {tong_may_khai} không khớp {so_may_hoat_dong} máy hoạt động +
      {so_may_du_phong} máy dự phòng. Đề nghị rà soát bảng đề xuất cấu hình.

  - id: ARC-10
    name: "Hệ thống nội bộ phải triển khai trên Cloud Tập đoàn, trừ ngoại lệ có lý do"
    type: qualitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 2
    legacy_ref: [R91]
    checklist_ref: [CL-2.2, CL-3.x.3]
    severity: major
    source_doc: "TL-DINH-CO, mục B.1 Quan điểm cấp phát, trang 40"
    applies_when: "la_he_thong_noi_bo"
    inputs:
      - {name: la_he_thong_noi_bo, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi một trong hai: (1) tài liệu nêu rõ hệ thống triển khai trên hạ tầng Cloud
      Tập đoàn; hoặc (2) KHÔNG triển khai trên Cloud nhưng nêu rõ thuộc ngoại lệ nào —
      triển khai phân tán ở vị trí không có hạ tầng Cloud, cô lập về hạ tầng, hoặc
      thiết bị đặc chủng — kèm lý do cụ thể.
      KHÔNG ĐẠT khi: không nói gì về hình thức hạ tầng triển khai; hoặc đề xuất hạ
      tầng riêng mà chỉ nói chung chung "do yêu cầu đặc thù", không chỉ ra thuộc ngoại
      lệ nào trong ba ngoại lệ Guideline liệt kê.
    examples:
      pass:
        - "Hệ thống triển khai trên Cloud Tập đoàn tại DC Hòa Lạc. Riêng 04 node thu
           thập dữ liệu đặt phân tán tại 04 tỉnh chưa có hạ tầng Cloud — thuộc ngoại lệ
           triển khai phân tán."
      fail:
        - "Hệ thống đề xuất đầu tư 12 máy chủ vật lý đặt tại phòng máy đơn vị do yêu
           cầu đặc thù."
    see_also: [ARC-11]

  - id: ARC-11
    name: "Big data cấp Bare-Metal, hệ còn lại cấp máy chủ ảo hóa"
    type: qualitative
    applies_to_equipment: [cap_phat, may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R95]
    checklist_ref: [CL-3.x.3]
    severity: major
    source_doc: "TL-DINH-CO, mục B.2 Quy định cấp phát, trang 41"
    applies_when: "tren_cloud_tap_doan"
    inputs:
      - {name: tren_cloud_tap_doan, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi: phân hệ Big data (Hadoop, Spark, HDFS, Kafka quy mô lớn, xử lý dữ liệu
      phân tán) khai Bare-Metal; phân hệ còn lại khai máy chủ ảo hóa; và mọi trường
      hợp lệch khỏi hai quy tắc trên đều có giải trình.
      KHÔNG ĐẠT khi: hệ Big data khai chạy trên VM mà không giải trình; hệ thường xin
      cấp Bare-Metal mà không nêu lý do (thường là dấu hiệu xin dư tài nguyên); hoặc
      không khai hình thức cấp phát.
    examples:
      pass:
        - "Phân hệ Hadoop (06 datanode) cấp Bare-Metal trên Cloud. Phân hệ Application
           và MariaDB cấp máy chủ ảo hóa."
      fail:
        - "Toàn bộ hệ thống gồm cụm Spark 08 node và 04 máy chủ ứng dụng, đề xuất cấp
           Bare-Metal."
    see_also: [ARC-06, ARC-10]

  - id: ARC-12
    name: "Cơ chế dự phòng bắt buộc theo mức độ quan trọng"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: phan_he
    round: 2
    legacy_ref: [R101]
    checklist_ref: [CL-2.11, CL-3.x.6]
    code_ref: "frontend/script.js:3844"
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    applies_when: "muc_do_quan_trong != 'binh_thuong'"
    check: "bac_co_che_khai >= bac_co_che_yeu_cau"
    inputs:
      - {name: muc_do_quan_trong, required: true,
         unit: "dac_biet_quan_trong | rat_quan_trong | quan_trong | binh_thuong"}
      - {name: bac_co_che_khai, required: true,
         unit: "0 = không khai · 1 = active-standby · 2 = active-active"}
      - {name: bac_co_che_yeu_cau, required: true,
         unit: "2 nếu mức từ rất quan trọng trở lên · 1 nếu quan trọng"}
    note: >
      Ánh xạ enum -> enum, SO THEO BẬC chứ không so bằng: Guideline quy định mức TỐI
      THIỂU theo phân loại, không cấm dự phòng cao hơn. Hệ "Quan trọng" chọn
      active-active là ĐẠT. So bằng sẽ sinh cảnh báo sai.
      "[CHƯA CHẮC] (a)" mức `binh_thuong`: Guideline im lặng -> `applies_when` loại ra,
      KHÔNG sinh finding. "[CHƯA CHẮC] (b)": có nên cảnh báo `minor` khi khai CAO HƠN
      yêu cầu (dư chi phí) không? Mặc định hiện tại là không. Cả hai chờ đơn vị thẩm
      định; xem rules-formulas.md điểm 12–13.
    see_also: [ARC-02, ARC-13, ARC-27]
    message_template: >
      Hệ thống mức "{muc_do_quan_trong}" yêu cầu cơ chế dự phòng bậc
      {bac_co_che_yeu_cau} (2 = active-active, 1 = active-standby), tài liệu khai bậc
      {bac_co_che_khai}. Đề nghị nâng cơ chế dự phòng cho đúng phân loại.

  - id: ARC-13
    name: "Mức độ dự phòng phải căn cứ phân loại hệ thống, không tự đặt"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R102]
    checklist_ref: [CL-2.10, CL-2.11, CL-3.x.6]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    criteria: >
      Phải có đủ ba: (1) nêu MỨC ĐỘ QUAN TRỌNG của hệ thống, đúng một trong bốn giá
      trị "đặc biệt quan trọng / rất quan trọng / quan trọng / bình thường"; (2) nêu
      MỨC ĐỘ DỰ PHÒNG tương ứng cho từng hệ thống, thiết bị; (3) NỐI được hai thứ đó
      với nhau — tài liệu chỉ ra mức dự phòng được chọn VÌ hệ thuộc phân loại nào,
      hoặc dẫn chiếu quy định dự phòng hiện hành của Tập đoàn.
      KHÔNG ĐẠT khi: có mức độ quan trọng nhưng không nói gì về mức dự phòng, hoặc
      ngược lại; có cả hai nhưng KHÔNG có liên hệ nào (mức dự phòng khai như một lựa
      chọn kỹ thuật độc lập); hoặc mức độ quan trọng ghi bằng chữ tự đặt ("khá quan
      trọng", "mức trung bình") không thuộc bốn giá trị chuẩn.
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu rõ: "các quy định về dự phòng hiện
      hành" trỏ tới 849/QĐ-CNVTQĐ mà Copilot CHƯA CÓ văn bản, nên chỉ kiểm được tài
      liệu có nêu và có nối hay không, KHÔNG đối chiếu được với nội dung 849/QĐ.
    examples:
      pass:
        - "Hệ thống được phân loại Rất quan trọng theo 849/QĐ-CNVTQĐ. Căn cứ phân loại
           này, mức dự phòng áp dụng: nội site active-active cho phân hệ Application và
           Database; chưa yêu cầu DC-DR (chỉ bắt buộc với mức Đặc biệt quan trọng)."
      fail:
        - "Hệ thống là hệ thống quan trọng của đơn vị. Các phân hệ đều triển khai dự
           phòng active-active để đảm bảo tính sẵn sàng."
    see_also: [ARC-12, ARC-26, ARC-27]
    note: >
      Phân vai với ARC-12: ARC-12 là ĐỊNH LƯỢNG, ánh xạ cứng mức độ -> cơ chế, C4 so
      bằng code. ARC-13 chỉ kiểm phần TRÌNH BÀY CĂN CỨ, C5 làm. Một bản khai đúng cơ
      chế nhưng không nói vì sao thì qua ARC-12, trượt ARC-13 — đúng thiết kế.

  - id: ARC-14
    name: "Module đã đủ năng lực giao dịch vẫn phải thiết kế cho sẵn sàng và dự phòng"
    type: qualitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R106]
    checklist_ref: [CL-3.x.19, CL-3.x.6]
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 20"
    criteria: >
      Phần định cỡ của phân hệ phải cho thấy HAI BƯỚC TÁCH BẠCH: (1) con số tài nguyên
      đủ đáp ứng tải giao dịch (kết quả của KPI-13 và các công thức CPU/RAM); (2) con
      số đó ĐƯỢC NÂNG LÊN hoặc nhân số node để đáp ứng tính sẵn sàng và dự phòng — ví
      dụ từ "cần 24 vCPU" thành "3 node × 16 vCPU active-active" — và nêu rõ căn cứ
      (mức dự phòng theo ARC-12/ARC-13, chỉ tiêu kỹ thuật đã ban hành).
      KHÔNG ĐẠT khi: bảng cấu hình đề xuất ĐÚNG BẰNG nhu cầu tính ra theo tải, không
      có phần cho dự phòng; có nhiều node nhưng không nói vì sao chọn số node đó (không
      phân biệt được là chia tải hay dự phòng); hoặc không nhắc gì tới chỉ tiêu kỹ
      thuật của hệ thống trong phần định cỡ phân hệ.
    examples:
      pass:
        - "Nhu cầu tải giờ cao điểm của phân hệ App: 24 vCPU, 96 GB RAM. Theo mức dự
           phòng active-active (hệ Rất quan trọng), đề xuất 03 node × 16 vCPU / 64 GB —
           khi mất 01 node, 02 node còn lại gánh 12 vCPU/node = 75%, vẫn trong ngưỡng."
      fail:
        - "Nhu cầu tính toán của phân hệ App là 24 vCPU, 96 GB RAM. Đề xuất cấu hình:
           02 node × 12 vCPU / 48 GB."
    see_also: [ARC-02, ARC-03, ARC-09, ARC-12]
    note: >
      Ranh giới với ARC-02: ARC-02 kiểm PHÉP TÍNH kịch bản mất 1 node. ARC-14 kiểm
      BƯỚC THIẾT KẾ — có nâng cấu hình lên vì lý do sẵn sàng/dự phòng hay không. Một
      bản chỉ tính đủ tải rồi dừng sẽ trượt ARC-14 kể cả khi không có gì để ARC-02 tính.

  - id: ARC-15
    name: "Phải nêu nguồn request — từ nội bộ hay từ bên ngoài"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.9]
    checklist_ref: [CL-3.x.9]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.9 / 3.2.10"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1 — nguyên văn cột Ghi chú của checklist: "Yêu cầu chỉ cần
      có thông tin là được đánh giá OK. OK chỉ mang tính pass vòng checklist còn đúng
      sai chi tiết sẽ đánh giá sau khi pass vòng này để đánh giá sâu hơn về mặt cấp
      phát thông qua các rules trong Guiline định cỡ".
      Cụ thể ở mục này: tài liệu có nêu request của phân hệ đến TỪ ĐÂU — từ phân hệ nội
      bộ khác, hay từ bên ngoài / internet.
      KHÔNG ĐẠT khi: không có thông tin nào về nguồn request; hoặc chỉ có tiêu đề mục
      mà bỏ trống nội dung.
      KHÔNG được đánh trượt vì thấy số liệu vô lý — việc đó thuộc Vòng 2.
    see_also: [ARC-16, FWL-04]
    note: >
      Là ĐẦU VÀO quyết định của FWL-04 (ZONE-01): có đường ra internet/public thì bắt
      buộc phải có phần định cỡ firewall và LB. Thiếu mục này thì FWL-04 không chạy
      được, sinh finding nhóm "thiếu thông tin" (NT4).

  - id: ARC-16
    name: "Phải nêu giao thức của request và port sử dụng"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.10]
    checklist_ref: [CL-3.x.10]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.10 / 3.2.11"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1 (nguyên văn ở ARC-15). Cụ thể ở mục này: tài liệu có nêu
      GIAO THỨC của request (HTTP, HTTPS, gRPC, JDBC…) VÀ PORT sử dụng.
      KHÔNG ĐẠT khi: không có thông tin nào về giao thức hoặc port; hoặc chỉ có tiêu đề
      mục mà bỏ trống nội dung.
      KHÔNG được đánh trượt vì thấy lựa chọn giao thức chưa tối ưu — việc đó thuộc
      Vòng 2.
    see_also: [ARC-15, FWL-04]

  - id: ARC-17
    name: "MariaDB Active-Active: CPU chia đều cho 3 master"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [mariadb]
    scope: phan_he
    round: 2
    legacy_ref: [MDB-01]
    code_ref: "frontend/script.js:14550"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:14550)"
    applies_when: "mo_hinh_trien_khai == 'active_active'"
    formula: "tong_cpu / mariadb_so_master_active_active"
    inputs:
      - {name: mo_hinh_trien_khai, unit: "active_active | active_standby", required: true}
      - {name: tong_cpu,           unit: vCPU, required: true}
    compare_with: cpu_moi_master_khai
    tolerance: 0.02
    note: >
      CẢNH BÁO VỀ CHÍNH QUY TẮC NÀY: code web app chia CỨNG cho 3, tức ngầm giả định
      cụm Active-Active có ĐÚNG 3 master. Mô hình 2 hoặc 5 master thì công thức sai.
      Guideline không có quy tắc nào tương ứng (rules-crossmap.md mục 3), nên để
      `severity: minor` + `confidence_floor: high` cho tới khi có văn bản.
      Nếu tài liệu khai số master khác 3, C4 phải sinh finding "quy ước nội bộ giả định
      3 master, tài liệu khai N master — cần xác nhận" thay vì áp thẳng công thức.
    see_also: [ARC-18, KPI-13]
    message_template: >
      CPU mỗi master khai {declared} vCPU; theo quy ước nội bộ (tổng {tong_cpu} chia 3
      master Active-Active) được {expected} (chênh {diff_pct}%).

