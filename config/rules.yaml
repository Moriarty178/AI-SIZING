    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-03, RDS-11]
    code_ref: "frontend/script.js:15220-15242"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15220)"
