  - id: ARC-26
    name: "Mức độ quan trọng và DC-DR phải tương ứng hai chiều"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [QD849-01]
    checklist_ref: [CL-2.10, CL-2.11, CL-3.x.6]
    severity: critical
    source_doc: "QD849, quy tắc lõi — xác nhận trực tiếp 2026-08-25, chờ văn bản"
    check: "co_dc_dr == (muc_do_quan_trong == 'dac_biet_quan_trong')"
    inputs:
      - {name: muc_do_quan_trong, required: true,
         unit: "dac_biet_quan_trong | rat_quan_trong | quan_trong | binh_thuong"}
      - {name: co_dc_dr, unit: "đúng/sai", required: true}
    note: >
      Quan hệ HAI CHIỀU, có đúng hai kiểu vi phạm và cả hai đều `critical`:
      (1) mức "đặc biệt quan trọng" nhưng KHÔNG có DC-DR -> thiếu dự phòng bắt buộc;
      (2) mức khác nhưng CÓ DC-DR -> không được phép, dư thừa tài nguyên.
      Đã chốt 2026-08-25 để kiểu #2 ở `critical` theo đúng câu "không được phép".
      Thiếu một trong hai tham số -> KHÔNG suy đoán, sinh finding "thiếu thông tin" (NT4).
      NT2: finding neo vào `computed_evidence` nên hợp lệ, nhưng bản thân ngưỡng chưa
      có sở cứ giấy tờ — bổ sung trích dẫn khi nhận được 849/QĐ.
    see_also: [ARC-13, ARC-27]
    message_template: >
      Hệ thống mức "{muc_do_quan_trong}" và trạng thái DC-DR "{co_dc_dr}" không tương
      ứng. Theo 849/QĐ, chỉ hệ "đặc biệt quan trọng" mới có DC-DR, và hệ "đặc biệt
      quan trọng" thì bắt buộc phải có.

  - id: ARC-27
    name: "Mọi hệ thống đều phải khai dự phòng nội site cho từng module"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: phan_he
    round: 2
    legacy_ref: [QD849-02]
    checklist_ref: [CL-2.11, CL-3.x.6]
    severity: critical
    source_doc: "QD849, quy tắc lõi — xác nhận trực tiếp 2026-08-25, chờ văn bản"
    check: "co_khai_du_phong_noi_site"
    inputs:
      - {name: co_khai_du_phong_noi_site, unit: "đúng/sai", required: true}
    note: >
      Dự phòng nội site bắt buộc với MỌI mức độ quan trọng, khai theo TỪNG module.
      ĐIỂM DỄ HIỂU NHẦM, phải kiểm riêng: hệ "đặc biệt quan trọng" CÓ DC-DR thì VẪN
      phải khai dự phòng nội site cho từng module — DC-DR là clone toàn hệ sang site
      khác, KHÔNG thay thế được dự phòng nội site.
      Quy tắc này chỉ kiểm CÓ KHAI hay không; việc khai ĐÚNG cơ chế theo mức độ quan
      trọng do ARC-12 (R101) kiểm.
    see_also: [ARC-12, ARC-26]
    message_template: >
      Phân hệ chưa khai cơ chế dự phòng nội site (active-active hoặc active-standby).
      Yêu cầu này áp cho mọi mức độ quan trọng; có DC-DR cũng không được miễn.

  # ===========================================================================
  # NHÓM STO — định cỡ lưu trữ
  # STO-01..16 Guideline · STO-17..18 checklist · STO-19..23 code web app
  # ===========================================================================

  - id: STO-01
    name: "Thiết bị lưu trữ phải đánh giá bằng cả IOPS và latency"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R18]
    checklist_ref: [CL-3.x.15]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    check: "co_neu_iops and co_neu_latency"
    inputs:
      - {name: co_neu_iops,    unit: "đúng/sai", required: true}
      - {name: co_neu_latency, unit: "đúng/sai", required: true}
    note: >
      "[CHƯA CHẮC]" Guideline yêu cầu đánh giá bằng IOPS VÀ latency nhưng KHÔNG cho
      ngưỡng số cho latency. Vì vậy quy tắc này chỉ kiểm CÓ NÊU hay không; phần so
      ngưỡng IOPS do KPI-05 làm. Khi có ngưỡng latency (theo loại ổ / loại hệ thống)
      thì bổ sung `check` so ngưỡng ở đây. rules-formulas.md điểm 7.
    see_also: [KPI-05, EVD-04]
    message_template: >
      Phần lưu trữ thiếu chỉ số bắt buộc (IOPS: {co_neu_iops}, latency:
      {co_neu_latency}). Guideline yêu cầu đánh giá thiết bị lưu trữ bằng cả hai.

  - id: STO-02
    name: "Ổ NL-SAS / SATA 7.2k nên dùng RAID 6"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R54]
    checklist_ref: [CL-3.x.18]
    severity: minor
    source_doc: "TL-DINH-CO, mục 5 Định cỡ thiết bị lưu trữ, trang 24"
    applies_when: "loai_o == 'nl_sas_sata_7k2'"
    check: "cap_raid == 6"
    inputs:
      - {name: loai_o,   unit: "nl_sas_sata_7k2 | sas_10k | sas_fc_15k | ssd", required: true, role: lookup}
      - {name: cap_raid, unit: "0 | 1 | 5 | 6 | 10", required: true, role: lookup}
    note: >
      Lý do: ổ 7.2k rpm rebuild rất lâu, RAID 6 chịu được hỏng 2 ổ đồng thời trong lúc
      rebuild. Guideline dùng chữ "khuyến cáo" nên `severity: minor` — câu thông báo
      phải là đề nghị, không phải khẳng định sai.
    see_also: [STO-09, STO-14]
    message_template: >
      Phân vùng dùng ổ {loai_o} với RAID {cap_raid}. Guideline khuyến cáo RAID 6 cho ổ
      7.2k rpm do thời gian rebuild dài. Đề nghị xác nhận lựa chọn.

  - id: STO-03
    name: "IOPS tối đa theo loại ổ"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R55]
    checklist_ref: [CL-3.x.15]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ thiết bị lưu trữ, trang 24"
    check: "iops_moi_o_khai <= iops_toi_da_loai_o"
    inputs:
      - {name: loai_o,             unit: "nl_sas_sata_7k2 | sas_10k | sas_fc_15k | ssd", required: true, role: lookup}
      - {name: iops_moi_o_khai,    unit: IOPS, required: true}
      - {name: iops_toi_da_loai_o, unit: IOPS, required: true}
    note: >
      Bảng tra (Guideline ghi là giá trị THAM KHẢO):
      NL-SAS / SATA 7.2k = 100 · SAS 10k = 140 · SAS/FC 15k = 210 · Flash/SSD từ 5000
      (tùy chip SLC/MLC/eMLC/TLC).
      C4 tra `iops_toi_da_loai_o` từ `loai_o` rồi so. Thiếu `loai_o` thì không tra được
      -> finding "thiếu thông tin" (NT4), KHÔNG lấy giá trị giữa bảng.
      Với SSD, bảng chỉ cho cận DƯỚI (>= 5000) nên chỉ cảnh báo khi khai THẤP hơn 5000
      — khai cao hơn là bình thường.
    see_also: [KPI-05, STO-12, STO-13]
    message_template: >
      Ổ {loai_o} khai {iops_moi_o_khai} IOPS, vượt mức tham khảo {iops_toi_da_loai_o}
      IOPS của loại ổ này. Đề nghị nêu căn cứ (CTKT thiết bị) hoặc tính lại số ổ.

  - id: STO-04
    name: "Dung lượng thô = tổng cần thiết × RAID × format × sai số × dự phòng"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R56]
    checklist_ref: [CL-3.x.16, CL-3.x.17]
    severity: critical
    source_doc: "TL-DINH-CO, mục 5 Định cỡ thiết bị lưu trữ, trang 25"
    formula: >
      tong_can_thiet_gb * ty_le_raid * format_ratio
      * storage_error_ratio * storage_reserve
    inputs:
      - {name: tong_can_thiet_gb, unit: GB,     required: true}
      - {name: ty_le_raid,        unit: "hệ số", required: true}
    compare_with: dung_luong_tho_khai
    tolerance: 0.02
    note: >
      Bốn hệ số lấy từ `globals` (STO-05 / R57): `format_ratio` 1.1, `storage_error_ratio`
      1.1, `storage_reserve` 1.25. Riêng `ty_le_raid` phụ thuộc cấu hình RAID cụ thể
      nên là input, tính theo STO-05.
      Đây là chỗ hay bị bỏ sót nhất: nhiều bản sizing lấy thẳng dung lượng dữ liệu làm
      dung lượng đặt mua, thiếu cả bốn hệ số.
    see_also: [STO-05, STO-12, EVD-01]
    message_template: >
      Dung lượng thô khai {declared} GB, tính lại từ {tong_can_thiet_gb} GB dữ liệu qua
      các hệ số RAID/format/sai số/dự phòng được {expected} GB (chênh {diff_pct}%).

  - id: STO-05
    name: "Tỷ lệ RAID, format, sai số, dự phòng của lưu trữ"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R57]
    checklist_ref: [CL-3.x.17]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ thiết bị lưu trữ, trang 25"
    check: >
      ty_le_raid_khai == tong_so_o / so_o_luu_du_lieu
      and ty_le_format_khai == format_ratio
      and ty_le_sai_so_khai == storage_error_ratio
      and ty_le_du_phong_khai == storage_reserve
    inputs:
      - {name: ty_le_raid_khai,     unit: "hệ số", required: true}
      - {name: tong_so_o,           unit: ổ,      required: true}
      - {name: so_o_luu_du_lieu,    unit: ổ,      required: true}
      - {name: ty_le_format_khai,   unit: "hệ số", required: true}
      - {name: ty_le_sai_so_khai,   unit: "hệ số", required: true}
      - {name: ty_le_du_phong_khai, unit: "hệ số", required: true}
    note: >
      `ty_le_raid` = tổng số ổ / số ổ lưu dữ liệu. Ví dụ Guideline nêu: RAID 5 với 6 ổ
      -> 6/5; RAID 6 với 8 ổ -> 8/6.
      `ty_le_du_phong` = 1.25 chính là hệ quả của mục tiêu "dùng không quá 80% dung
      lượng" (KPI-06) — 1/0.8 = 1.25. Hai quy tắc phải nhất quán với nhau.
    see_also: [STO-04, KPI-06]
    message_template: >
      Hệ số dung lượng thô khai (RAID {ty_le_raid_khai} / format {ty_le_format_khai} /
      sai số {ty_le_sai_so_khai} / dự phòng {ty_le_du_phong_khai}) khác quy định của
      Guideline (RAID = {tong_so_o}/{so_o_luu_du_lieu}, 1.1, 1.1, 1.25).

  - id: STO-06
    name: "Phải cộng thêm dung lượng cho khả năng phục hồi"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R58]
    checklist_ref: [CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ thiết bị lưu trữ, trang 25"
    formula: "so_ban_luu * dung_luong_1_ban_gb + dung_luong_restore_gb"
    inputs:
      - {name: so_ban_luu,             unit: bản, required: true}
      - {name: dung_luong_1_ban_gb,    unit: GB,  required: true}
      - {name: dung_luong_restore_gb,  unit: GB,  required: true}
    compare_with: dung_luong_phuc_hoi_khai
    tolerance: 0.02
    note: >
      Theo ví dụ của Guideline: lưu online 3 bản backup 1 TB (3 TB) CỘNG khả năng
      restore 1 bản (1 TB) = 4 TB. Chỗ hay quên là số hạng `dung_luong_restore_gb` —
      không có chỗ trống để restore thì bản backup vô dụng khi cần phục hồi.
    see_also: [BAK-01, STO-04]
    message_template: >
      Dung lượng phục hồi khai {declared} GB, tính lại ({so_ban_luu} bản ×
      {dung_luong_1_ban_gb} GB + {dung_luong_restore_gb} GB chỗ restore) được
      {expected} GB.

  - id: STO-07
    name: "IOPS hệ thống = tổng IOPS các máy chủ, đo tối thiểu 7 ngày"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: he_thong
    round: 2
    legacy_ref: [R60]
    checklist_ref: [CL-3.x.15]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 26"
    check: "so_ngay_do_iops >= iops_do_toi_thieu_ngay"
    inputs:
      - {name: so_ngay_do_iops, unit: ngày, required: true}
    note: >
      Guideline nêu cách đo cụ thể: `iostat` định kỳ 1 phút/lần, thống kê tối thiểu
      7 ngày, lấy `r/s` + `w/s`, dùng giá trị 95th (KPI-01).
      Phần cộng dồn `IOPS_hethong = Σ IOPS_maychu` là phép tổng thuần túy, C4 thực hiện
      khi gom số liệu — không cần `formula` riêng vì số hạng thay đổi theo từng bản.
      Lưu ý 7 ngày ở đây KHÁC 1 tháng của KPI-10 (R36): KPI-10 cho tải CPU/RAM nói
      chung, STO-07 cho riêng phép đo IOPS.
    see_also: [KPI-01, KPI-10, STO-08]
    message_template: >
      Khoảng đo IOPS chỉ {so_ngay_do_iops} ngày, chưa đủ tối thiểu 07 ngày theo
      Guideline.

  - id: STO-08
    name: "Backend IOPS = Frontend IOPS × (%đọc + write penalty × %ghi)"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R61]
    checklist_ref: [CL-3.x.15]
    severity: critical
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 26"
    formula: "frontend_iops * (read_ratio + write_penalty * write_ratio)"
    inputs:
      - {name: frontend_iops,  unit: IOPS,   required: true}
      - {name: write_penalty,  unit: "hệ số", required: true}
    compare_with: backend_iops_khai
    tolerance: 0.02
    note: >
      Frontend IOPS = IOPS hệ thống (STO-07). Backend IOPS mới là con số dùng để tính
      SỐ Ổ theo hiệu năng (STO-12).
      Đây là bước hay bị bỏ qua nhất trong định cỡ lưu trữ: bỏ write penalty thì với
      RAID 6 (penalty 6) số ổ tính ra thiếu tới vài lần.
      `write_penalty` tra theo cấp RAID ở STO-09; `read_ratio`/`write_ratio` mặc định
      65/35 ở STO-10.
    see_also: [STO-07, STO-09, STO-10, STO-12]
    message_template: >
      Backend IOPS khai {declared}, tính lại từ frontend {frontend_iops} IOPS với write
      penalty {write_penalty} được {expected} (chênh {diff_pct}%).

  - id: STO-09
    name: "Write penalty theo cấp RAID: 0/1 → 1 · RAID 5 → 5 · RAID 6 → 6"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R62]
    checklist_ref: [CL-3.x.15]
    severity: critical
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 26"
    check: "write_penalty_khai == write_penalty_theo_raid"
    inputs:
      - {name: cap_raid,                unit: "0 | 1 | 5 | 6 | 10", required: true, role: lookup}
      - {name: write_penalty_khai,      unit: "hệ số", required: true}
      - {name: write_penalty_theo_raid, unit: "hệ số", required: true}
    note: >
      Bảng tra: RAID 0 = 1 · RAID 1 = 1 · RAID 5 = 5 · RAID 6 = 6.
      Guideline KHÔNG nêu RAID 10; nếu tài liệu dùng RAID 10 thì C4 để
      `write_penalty_theo_raid` là `None` và sinh finding "thiếu thông tin" (NT4),
      KHÔNG tự suy ra giá trị 2 như thông lệ ngành — đó sẽ là bịa.
    see_also: [STO-02, STO-08]
    message_template: >
      Write penalty khai {write_penalty_khai} cho RAID {cap_raid}; Guideline quy định
      {write_penalty_theo_raid}.

  - id: STO-10
    name: "Tỷ lệ đọc/ghi mặc định 65/35"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R63]
    checklist_ref: [CL-3.x.15]
    severity: minor
    confidence_floor: high
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 27"
    check: >
      (ty_le_doc_khai == read_ratio and ty_le_ghi_khai == write_ratio)
      or co_so_lieu_do_thuc_te
    inputs:
      - {name: ty_le_doc_khai,       unit: "tỷ lệ", required: true}
      - {name: ty_le_ghi_khai,       unit: "tỷ lệ", required: true}
      - {name: co_so_lieu_do_thuc_te, unit: "đúng/sai", required: true}
    note: >
      "[CHƯA CHẮC]" Guideline nói 65/35 đúng với "đa phần ứng dụng Viettel"
      (fio rwmixread=65) — tức là MẶC ĐỊNH, không phải ngưỡng cứng. Vì vậy `check` chấp
      nhận tỷ lệ khác NẾU tài liệu có số liệu đo thực tế của chính hệ thống đó.
      Cần đơn vị thẩm định xác nhận cách hiểu này. rules-formulas.md điểm 10.
    see_also: [STO-08]
    message_template: >
      Tỷ lệ đọc/ghi khai {ty_le_doc_khai}/{ty_le_ghi_khai} khác mặc định 65/35 mà không
      kèm số liệu đo thực tế. Đề nghị bổ sung căn cứ hoặc dùng tỷ lệ mặc định.

  - id: STO-11
    name: "Số ổ cứng = MAX(ổ theo dung lượng, ổ theo hiệu năng) + hotspare"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R64]
    checklist_ref: [CL-3.x.17]
    severity: critical
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 29"
    formula: "max(so_o_theo_dung_luong, so_o_theo_hieu_nang) + so_o_hotspare"
    inputs:
      - {name: so_o_theo_dung_luong, unit: ổ, required: true}
      - {name: so_o_theo_hieu_nang,  unit: ổ, required: true}
      - {name: so_o_hotspare,        unit: ổ, required: true}
    compare_with: so_o_khai
    tolerance: 0
    note: >
      MAX chứ không phải tổng — hai con số là hai cách tính cùng một nhu cầu, lấy cái
      lớn hơn. Cộng nhầm sẽ ra gấp đôi số ổ cần.
      Hai số hạng đầu tính ở STO-12, hotspare ở STO-16.
    see_also: [STO-12, STO-16]
    message_template: >
      Số ổ khai {declared}, tính lại MAX({so_o_theo_dung_luong} theo dung lượng,
      {so_o_theo_hieu_nang} theo hiệu năng) + {so_o_hotspare} hotspare = {expected}.

  - id: STO-12
    name: "Số ổ theo dung lượng và số ổ theo hiệu năng"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R65]
    checklist_ref: [CL-3.x.17]
    severity: critical
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 29"
    check: >
      so_o_theo_dung_luong_khai >= dung_luong_tho_gb / dung_luong_1_o_gb
      and so_o_theo_hieu_nang_khai >= backend_iops * storage_reserve / iops_loai_o
    inputs:
      - {name: so_o_theo_dung_luong_khai, unit: ổ,   required: true}
      - {name: dung_luong_tho_gb,         unit: GB,  required: true}
      - {name: dung_luong_1_o_gb,         unit: GB,  required: true}
      - {name: so_o_theo_hieu_nang_khai,  unit: ổ,   required: true}
      - {name: backend_iops,              unit: IOPS, required: true}
      - {name: iops_loai_o,               unit: IOPS, required: true}
    note: >
      Dùng ">=" vì kết quả phải làm tròn LÊN (`globals.lam_tron`) — khai bằng đúng phần
      nguyên trở lên là đạt, khai thấp hơn là thiếu ổ.
      Hệ số `storage_reserve` (1.25) trong nhánh hiệu năng chính là mục tiêu "dùng
      không quá 80% hiệu năng" — nhất quán với KPI-05.
    see_also: [STO-04, STO-08, STO-11, KPI-05]
    message_template: >
      Số ổ khai theo dung lượng {so_o_theo_dung_luong_khai} / theo hiệu năng
      {so_o_theo_hieu_nang_khai} chưa đủ so với nhu cầu tính lại. Đề nghị rà soát.

  - id: STO-13
    name: "Dung lượng mỗi ổ nên nằm trong dải thông dụng của loại ổ"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R66]
    checklist_ref: [CL-3.x.18]
    severity: minor
    confidence_floor: high
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 29"
    check: >
      dung_luong_1_o_gb >= dai_thong_dung_min_gb
      and dung_luong_1_o_gb <= dai_thong_dung_max_gb
    inputs:
      - {name: loai_o,                unit: "nl_sas_sata_7k2 | sas_10k | sas_fc_15k | ssd", required: true, role: lookup}
      - {name: dung_luong_1_o_gb,     unit: GB, required: true}
      - {name: dai_thong_dung_min_gb, unit: GB, required: true}
      - {name: dai_thong_dung_max_gb, unit: GB, required: true}
    note: >
      Bảng tra dải thông dụng: Flash/SSD 100 GB – 1.92 TB · SAS/FC 15k 300 – 600 GB ·
      SAS/FC 10k 300 GB – 2 TB · SATA/NL-SAS 7.2k 1 – 8 TB.
      Đây là dải THÔNG DỤNG, không phải giới hạn cứng. Ra ngoài dải không phải là sai —
      chỉ là dấu hiệu nên rà lại (ổ quá lạ khó mua, rebuild lâu, hoặc gõ nhầm đơn vị).
      Vì vậy `severity: minor` và câu thông báo là ĐỀ NGHỊ XÁC NHẬN.
      R66 chuyển từ định tính sang định lượng ngày 2026-08-25 — cùng hình dạng "bảng
      tra theo loại ổ" với STO-03 (R55).
    see_also: [STO-03, STO-14]
    message_template: >
      Ổ {loai_o} khai dung lượng {dung_luong_1_o_gb} GB, ngoài dải thông dụng
      {dai_thong_dung_min_gb}–{dai_thong_dung_max_gb} GB. Đề nghị xác nhận lựa chọn.

  - id: STO-14
    name: "Hệ đọc/ghi ngẫu nhiên cao nên dùng ổ tốc độ cao, dung lượng dưới 1 TB"
    type: qualitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R67]
    checklist_ref: [CL-3.x.18]
    severity: minor
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 29"
    applies_when: "doc_ghi_ngau_nhien_cao"
    inputs:
      - {name: doc_ghi_ngau_nhien_cao, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi cả hai: (1) loại ổ chọn là 10krpm, 15krpm hoặc SSD; (2) dung lượng mỗi ổ
      dưới 1 TB. Lệch một trong hai thì cần giải trình (ví dụ đã dùng SSD dung lượng
      lớn nhưng có lý do về mật độ rack).
      KHÔNG ĐẠT khi: hệ OLTP nhưng chọn ổ NL-SAS/SATA 7.2k; chọn ổ tốc độ cao nhưng
      dung lượng 4–8 TB (thời gian rebuild rất lâu, đúng điều tài liệu muốn tránh);
      hoặc không nêu loại ổ nào cả.
      PHẠM VI: chỉ áp cho phân hệ thuộc nhóm đọc/ghi ngẫu nhiên cao — VAS, CSDL OLTP,
      File server nhiều file nhỏ. KHÔNG áp cho lưu trữ tuần tự, dữ liệu lớn ít truy
      cập, archive, media, backup.
    examples:
      pass:
        - "Phân vùng CSDL OLTP dùng 12 ổ SSD 960 GB, RAID 10 — ưu tiên IOPS và thời
           gian rebuild ngắn."
      fail:
        - "Phân vùng CSDL dùng 06 ổ NL-SAS 4 TB, RAID 6."
    see_also: [STO-02, STO-03, STO-13, STO-15]
    note: >
      `severity: minor` vì Guideline dùng chữ "nên" — khuyến nghị, không phải ngưỡng
      cứng. Câu thông báo phải là đề nghị xác nhận, không phải khẳng định sai.

  - id: STO-15
    name: "SSD dùng từ 75% dung lượng trở lên thì tốc độ ghi suy giảm"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R68]
    checklist_ref: [CL-3.x.17]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 29"
    applies_when: "loai_o == 'ssd'"
    check: "ty_le_dung_ssd < ssd_kpi"
    inputs:
      - {name: loai_o,         unit: "nl_sas_sata_7k2 | sas_10k | sas_fc_15k | ssd", required: true, role: lookup}
      - {name: ty_le_dung_ssd, unit: "tỷ lệ", required: true}
    note: >
      Đây là LÝ DO đằng sau ngưỡng 75% của KPI-07 — hai quy tắc dùng chung hằng số
      `ssd_kpi`. KPI-07 là ngưỡng định cỡ; STO-15 là cảnh báo hệ quả hiệu năng.
      Khi cả hai cùng trượt, C7 gom lại một khối thay vì báo hai lần.
    see_also: [KPI-07, STO-14]
    message_template: >
      Phân vùng SSD dự kiến dùng {ty_le_dung_ssd} dung lượng, từ 75% trở lên tốc độ
      ghi suy giảm đáng kể. Đề nghị tăng dung lượng hoặc giảm dữ liệu lưu.

  - id: STO-16
    name: "Hotspare tối thiểu 02 ổ mỗi loại hoặc 7%, làm tròn lên"
    type: quantitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R69]
    checklist_ref: [CL-3.x.17]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ lưu trữ, trang 30"
    formula: "max(hotspare_min, ceil(hotspare_ratio * so_o_cung_loai))"
    inputs:
      - {name: so_o_cung_loai, unit: ổ, required: true}
    compare_with: so_o_hotspare_khai
    tolerance: 0
    note: >
      Lấy MAX của hai mức: tối thiểu 02 ổ mỗi loại, hoặc 7% số ổ cùng loại làm tròn
      LÊN. Cụm nhiều ổ thì nhánh 7% thắng.
      Tính hotspare THEO TỪNG LOẠI Ổ, không tính trên tổng số ổ của cả hệ — một cụm có
      cả SSD và NL-SAS cần hotspare riêng cho mỗi loại.
    see_also: [STO-11]
    message_template: >
      Hotspare khai {declared} ổ cho {so_o_cung_loai} ổ cùng loại; theo Guideline cần
      {expected} ổ (tối thiểu 02, hoặc 7% làm tròn lên).

  - id: STO-17
    name: "Phải nêu loại lưu trữ sử dụng — Block, Object, File local hay File NAS"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.18]
    checklist_ref: [CL-3.x.18]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.18 / 3.2.20"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1 — nguyên văn cột Ghi chú của checklist: "Yêu cầu chỉ cần
      có thông tin là được đánh giá OK. OK chỉ mang tính pass vòng checklist còn đúng
      sai chi tiết sẽ đánh giá sau khi pass vòng này để đánh giá sâu hơn về mặt cấp
      phát thông qua các rules trong Guiline định cỡ".
      Cụ thể ở mục này: tài liệu có nêu loại lưu trữ mà phân hệ dùng — Block, Object,
      File local hoặc File NAS.
      KHÔNG ĐẠT khi: không có thông tin nào về loại lưu trữ; hoặc chỉ có tiêu đề mục mà
      bỏ trống nội dung.
      KHÔNG được đánh trượt vì cho rằng loại lưu trữ chọn chưa tối ưu — việc đó thuộc
      Vòng 2.
    note: >
      Guideline KHÔNG có khái niệm này — đây là thông số checklist thêm vào. Nó quyết
      định `scope` của cả nhóm quy tắc lưu trữ: một phân hệ dùng hai công nghệ lưu trữ
      thì các quy tắc `phan_he_x_cong_nghe_luu_tru` chấm hai lần.
    see_also: [STO-14]

  - id: STO-18
    name: "Phân hệ Database phải đảm bảo 3 phân vùng /data, /log, /backup"
    type: quantitative
    applies_to_equipment: [luu_tru, may_chu]
    applies_to_module: [mariadb]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.2.7a]
    checklist_ref: [CL-3.2.7a]
    code_ref: "frontend/script.js:14554-14556"
    severity: major
    source_doc: "CHECKLIST-TD, dòng 50 (thiếu số thứ tự trong file gốc)"
    check: "co_phan_vung_data and co_phan_vung_log and co_phan_vung_backup"
    inputs:
      - {name: co_phan_vung_data,   unit: "đúng/sai", required: true}
      - {name: co_phan_vung_log,    unit: "đúng/sai", required: true}
      - {name: co_phan_vung_backup, unit: "đúng/sai", required: true}
    note: >
      Là mục Vòng 1 (kiểm ĐỦ THÀNH PHẦN) nhưng kiểm được bằng code nên để
      `type: quantitative` — không cần LLM phán đoán.
      Dòng 50 của file Excel có nội dung nhưng THIẾU số thứ tự; đã đặt mã tạm
      `CL-3.2.7a` (checklist-tham-dinh.md mục 8.2). Nên báo đơn vị thẩm định bổ sung.
      Phần định cỡ dung lượng của từng phân vùng do KPI-13 (R48) và STO-04 làm.
    see_also: [BAK-10, STO-04]
    message_template: >
      Phân hệ Database thiếu phân vùng bắt buộc (/data: {co_phan_vung_data}, /log:
      {co_phan_vung_log}, /backup: {co_phan_vung_backup}).

  - id: STO-19
    name: "Redis: số key sau định cỡ = số key POC × hệ số so sánh"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-01]
    code_ref: "frontend/script.js:15175"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15175)"
    formula: "so_key_poc * he_so_so_sanh"
    inputs:
      - {name: so_key_poc,    unit: key,     required: true}
      - {name: he_so_so_sanh, unit: "hệ số", required: true}
    compare_with: so_key_khai
    tolerance: 0.02
    note: >
      Cùng bản chất với KPI-12 (R40) — `he_so_so_sanh` chính là `factor` của web app.
      Số key là đầu vào để tính dung lượng dữ liệu Redis (RAM-03 / RDS-02).
    see_also: [KPI-12, RAM-03, ARC-19]
    message_template: >
      Số key sau định cỡ khai {declared}, tính lại {so_key_poc} × {he_so_so_sanh} được
      {expected} (chênh {diff_pct}%).

  - id: STO-20
    name: "Redis: dung lượng ổ mỗi server bằng 4 lần RAM"
    type: quantitative
    applies_to_equipment: [luu_tru, may_chu]
    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-05]
    code_ref: "frontend/script.js:15225"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15225)"
    formula: "redis_disk_tren_ram * ram_moi_node_gb"
    inputs:
      - {name: ram_moi_node_gb, unit: GB, required: true}
    compare_with: disk_moi_node_khai
    tolerance: 0.02
    note: >
      Hệ số 4 không có trong Guideline — cần văn bản nội bộ làm căn cứ
      (rules-crossmap.md mục 3). Lý do kỹ thuật thông thường là chỗ cho RDB snapshot
      và AOF, nhưng đó là suy đoán của tôi, KHÔNG phải căn cứ — không đưa vào
      `source_doc`.
    see_also: [ARC-19, ARC-20]
    message_template: >
      Dung lượng ổ mỗi node Redis khai {declared} GB; quy ước nội bộ là 4 × RAM
      ({ram_moi_node_gb} GB) = {expected} GB.

  - id: STO-21
    name: "Kafka: dung lượng lưu trữ theo throughput, thời gian giữ và replica"
    type: quantitative
    applies_to_equipment: [luu_tru]
    applies_to_module: [kafka]
    scope: phan_he
    round: 2
    legacy_ref: [KFK-02]
    code_ref: "frontend/script.js:15923"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15923)"
    formula: >
      throughput_mbs * 3600 * thoi_gian_giu_gio * he_so_replica
      * he_so_nen * error_margin / disk_kpi
    inputs:
      - {name: throughput_mbs,      unit: MB/s,   required: true}
      - {name: thoi_gian_giu_gio,   unit: giờ,    required: true}
      - {name: he_so_replica,       unit: lần,    required: true}
      - {name: he_so_nen,           unit: "tỷ lệ", required: true}
    compare_with: dung_luong_kafka_khai_mb
    tolerance: 0.02
    note: >
      Phần `error_margin / disk_kpi` (1.1 / 0.8) là ĐÚNG theo KPI-13/KPI-14 — web app
      áp chuẩn ở chỗ này. Phần riêng của Kafka là ba tham số T, R, C_nén (xem STO-22),
      không có trong Guideline.
    see_also: [KPI-13, KPI-14, STO-22, ARC-23]
    message_template: >
      Dung lượng Kafka khai {declared} MB, tính lại được {expected} MB
      (chênh {diff_pct}%).

  - id: STO-22
    name: "Kafka: mặc định giữ 168 giờ, 3 replica, tỷ lệ nén 0.5"
    type: quantitative
    applies_to_equipment: [luu_tru]
    applies_to_module: [kafka]
    scope: phan_he
    round: 2
    legacy_ref: [KFK-03]
    code_ref: "frontend/script.js:15902-15904"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15902)"
    check: "thoi_gian_giu_gio > 0 and he_so_replica >= 2 and he_so_nen > 0"
    inputs:
      - {name: thoi_gian_giu_gio, unit: giờ,    required: true}
      - {name: he_so_replica,     unit: lần,    required: true}
      - {name: he_so_nen,         unit: "tỷ lệ", required: true}
    note: >
      CỐ Ý KHÔNG ép đúng ba giá trị mặc định (168 giờ / 3 / 0.5). Đó là MẶC ĐỊNH của
      form web app, không phải quy định — thời gian giữ và tỷ lệ nén phụ thuộc nghiệp
      vụ từng hệ. Ép bằng sẽ sinh cảnh báo sai hàng loạt.
      Quy tắc này chỉ kiểm ba tham số CÓ ĐƯỢC KHAI và nằm trong khoảng có nghĩa; riêng
      replica dưới 2 là mất dự phòng nên cảnh báo.
    see_also: [STO-21]
    message_template: >
      Tham số Kafka khai (giữ {thoi_gian_giu_gio} giờ, {he_so_replica} replica, nén
      {he_so_nen}) chưa hợp lệ. Mặc định của công cụ hiện hành là 168 giờ / 3 / 0.5 —
      nếu dùng giá trị khác, đề nghị nêu căn cứ nghiệp vụ.

  - id: STO-23
    name: "Kafka: dung lượng dữ liệu 30 phút dùng để tính RAM broker"
    type: quantitative
    applies_to_equipment: [luu_tru]
    applies_to_module: [kafka]
    scope: phan_he
    round: 2
    legacy_ref: [KFK-04]
    code_ref: "frontend/script.js:15928"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15928)"
    formula: "throughput_mbs * 1800 / 1024"
    inputs:
      - {name: throughput_mbs, unit: MB/s, required: true}
    compare_with: du_lieu_30_phut_khai_gb
    tolerance: 0.02
    note: >
      1800 giây = 30 phút; chia 1024 để đổi MB sang GB. Con số này là đầu vào của
      ARC-23 (RAM mỗi broker). Mốc 30 phút là quy ước nội bộ, không có trong Guideline.
    see_also: [ARC-23, STO-21]
    message_template: >
      Dữ liệu 30 phút khai {declared} GB, tính lại từ {throughput_mbs} MB/s được
      {expected} GB.

  # ===========================================================================
  # NHÓM EVD — sở cứ và mô tả bắt buộc
  # EVD-01..11 Guideline (Vòng 2) · EVD-12..22 checklist (Vòng 1)
  #
  # EVD-12..22 đều dùng TIÊU CHÍ MẶC ĐỊNH VÒNG 1. Nguyên văn cột Ghi chú checklist:
  #   "Yêu cầu chỉ cần có thông tin là được đánh giá OK. OK chỉ mang tính pass vòng
  #    checklist còn đúng sai chi tiết sẽ đánh giá sau khi pass vòng này để đánh giá
  #    sâu hơn về mặt cấp phát thông qua các rules trong Guiline định cỡ"
  # Bar RẤT THẤP: chỉ hỏi "có thông tin thực chất hay không". KHÔNG được đánh trượt
  # vì thấy nội dung sơ sài hay số liệu đáng ngờ — việc đó thuộc Vòng 2.
  # ===========================================================================

  - id: EVD-01
    name: "Phân biệt rõ dung lượng lưu trữ khả dụng và dung lượng thô"
    type: qualitative
    applies_to_equipment: [luu_tru, may_chu]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R23]
    checklist_ref: [CL-2.5, CL-3.x.17]
    severity: major
    source_doc: "TL-DINH-CO, mục Khái niệm, trang 6"
    criteria: >
      Với MỖI con số dung lượng trong tài liệu, phải xác định được nó là loại nào —
      ĐẠT khi một trong hai: (1) ghi rõ nhãn "khả dụng" / "sau RAID" hoặc "thô" /
      "trước RAID"; (2) nêu đồng thời cả hai giá trị kèm tỷ lệ RAID dùng để quy đổi.
      KHÔNG ĐẠT khi: bảng chỉ ghi "Dung lượng: 6 TB" không rõ loại (ca phổ biến nhất);
      trộn hai loại trong cùng một bảng mà không phân biệt; hoặc lấy dung lượng THÔ đem
      so với ngưỡng 80% — ngưỡng đó áp cho dung lượng KHẢ DỤNG.
    examples:
      pass:
        - "Nhu cầu dữ liệu 6 TB khả dụng. Với RAID 6 (8 ổ, tỷ lệ 8/6), format 1.1, sai
           số 1.1, dự phòng 1.25 → dung lượng thô cần cấp: 6 × 1.333 × 1.1 × 1.1 × 1.25
           = 12,1 TB."
      fail:
        - "Nhu cầu lưu trữ của hệ thống: 6 TB. Đề xuất cấp 6 TB trên thiết bị lưu trữ SAN."
    see_also: [STO-04, STO-05, KPI-06]
    note: >
      VÌ SAO NGHIÊM TRỌNG: nhầm hai loại này làm sai TOÀN BỘ chuỗi tính từ STO-04 (dung
      lượng thô) tới STO-11/STO-12 (số ổ cứng). Với RAID 6 8 ổ, chênh lệch là 33%.
      Khi quy tắc này trượt, C4 nên coi mọi kết quả lưu trữ phía sau là "chưa đánh giá
      được" thay vì tính trên số liệu không rõ nghĩa.

  - id: EVD-02
    name: "Chỉ rõ yếu tố mở rộng dọc/ngang làm sở cứ mở rộng sau này"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R25, R32]
    severity: major
    source_doc: "TL-DINH-CO, mục A.2 và bảng quy trình định cỡ, trang 9 và 13"
    criteria: >
      Phải trả lời được CẢ BA: (1) khi tải tăng, MODULE NÀO phải mở rộng; (2) mỗi
      module mở rộng theo CHIỀU DỌC hay CHIỀU NGANG; (3) với module scale out, thêm
      node có kèm Load Balancing không, và hiệu năng SUY GIẢM BAO NHIÊU % khi thêm node
      (do overhead đồng bộ).
      Cách trình bày đạt yêu cầu là nêu một kịch bản cụ thể CÓ SỐ, như ví dụ 100 TPS →
      200 TPS trong chính tài liệu.
      KHÔNG ĐẠT khi: chỉ nói chung "hệ thống có khả năng mở rộng ngang" mà không chỉ ra
      module nào; nêu module nhưng không nói dọc hay ngang; hoặc không đề cập mức suy
      giảm hiệu năng khi scale out.
    examples:
      pass:
        - "Từ 100 TPS lên 200 TPS: module API Gateway và App Service mở rộng ngang
           (thêm node sau LB, hiệu năng suy giảm ~8%/node do đồng bộ session); module
           MariaDB mở rộng dọc (tăng RAM buffer pool) vì mô hình master-slave không
           chia tải ghi."
      fail:
        - "Hệ thống thiết kế theo kiến trúc microservice nên có khả năng mở rộng linh
           hoạt khi nhu cầu tăng."
    note: >
      GỘP HAI QUY TẮC R25 + R32 làm một, hai `source_doc` trên cùng một quy tắc: cả hai
      cùng yêu cầu chỉ rõ yếu tố scale up/out, để riêng thì một bản sizing thiếu phần
      này sẽ bị bắt lỗi HAI LẦN với hai trích dẫn khác nhau. R32 (trang 13) giữ vai trò
      trích dẫn chính vì câu chữ cụ thể hơn và có ví dụ 100→200 TPS.
      `checklist_ref` CỐ Ý ĐỂ TRỐNG: checklist thẩm định không có mục nào phủ nội dung
      này, nên Vòng 1 không bắt được nếu tài liệu thiếu hẳn phần đó — chỉ Vòng 2 bắt
      được. Đây là một trong bốn quy tắc không map được sang checklist; xem
      rules-crossmap.md mục 7.

  - id: EVD-03
    name: "Thông số chọn để định cỡ phải ảnh hưởng tới năng lực xử lý"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R35]
    checklist_ref: [CL-2.5]
    severity: minor
    source_doc: "TL-DINH-CO, bảng quy trình định cỡ, trang 15"
    criteria: >
      ĐẠT khi: (1) thông số dùng làm cơ sở tính toán là loại CÓ QUAN HỆ NHÂN QUẢ với
      tải tài nguyên — CCU, TPS, RPS, QPS, số giao dịch, khối lượng dữ liệu, IOPS;
      (2) nếu dùng thông số nghiệp vụ GIÁN TIẾP (số thuê bao, số chi nhánh, doanh
      thu…), phải nêu CÁCH QUY ĐỔI sang thông số tải.
      KHÔNG ĐẠT khi: định cỡ dựa thẳng vào con số nghiệp vụ mà không quy đổi — ví dụ
      "hệ thống phục vụ 5 triệu thuê bao nên cần 20 máy chủ"; hoặc thông số nêu ra
      không được dùng ở bất kỳ phép tính nào phía sau.
    examples:
      pass:
        - "Quy mô 5,2 triệu thuê bao, tỷ lệ hoạt động đồng thời giờ cao điểm 0,8% →
           42.000 CCU, tương ứng 3.500 TPS đo được trên môi trường kiểm thử."
      fail:
        - "Hệ thống phục vụ 5 triệu thuê bao trên toàn quốc, đề xuất 20 máy chủ ứng dụng."
    see_also: [EVD-09, EVD-11]

  - id: EVD-04
    name: "Cấu hình hệ thống tham chiếu phải nêu đủ CPU, RAM, ổ cứng"
    type: qualitative
    applies_to_equipment: [may_chu]
    scope: he_thong
    round: 2
    legacy_ref: [R37]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 19"
    applies_when: "dang_dinh_co != 1"
    inputs:
      - {name: dang_dinh_co, unit: "1 | 2 | 3", required: true}
    criteria: >
      Phải có đủ CẢ BỐN: (1) CPU — nêu SỐ LƯỢNG và DÒNG/MODEL cụ thể (ví dụ
      "2 × Intel Xeon Gold 6248R"); chỉ ghi số lượng mà không có model là chưa đạt.
      (2) RAM — nêu dung lượng theo GB. (3) Ổ cứng — nêu dung lượng KHẢ DỤNG SAU RAID,
      hoặc nêu rõ là không dùng RAID. (4) IOPS và latency của TỪNG PHÂN VÙNG phục vụ
      mục đích/nghiệp vụ khác nhau — không phải một con số gộp cho cả máy.
      KHÔNG ĐẠT khi: bảng cấu hình chỉ có số lượng CPU, không có model; ổ cứng chỉ ghi
      dung lượng thô hoặc không nói rõ đã trừ RAID chưa; có nhiều phân vùng nhưng chỉ
      nêu một giá trị IOPS/latency chung; hoặc thiếu hẳn IOPS hay latency.
      SẮC THÁI PHẢI GIỮ: tài liệu dùng "cần chỉ rõ" (bắt buộc) cho CPU, ổ cứng,
      IOPS/latency — nhưng dùng "NÊN chỉ rõ" (khuyến nghị) riêng cho phần vCPU tương
      ứng model pCPU. Thiếu phần vCPU↔pCPU thì hạ xuống mức `minor`, KHÔNG tính là
      không đạt.
    examples:
      pass:
        - "Hệ thống tham chiếu gồm 03 máy chủ, mỗi máy: 2 × Intel Xeon Gold 6248R
           (24 core), RAM 256 GB. Ổ cứng: /u01 800 GB khả dụng sau RAID 10, IOPS đo
           được 12.400, latency 0,8 ms; /u02 4 TB khả dụng sau RAID 6, IOPS 950,
           latency 6,2 ms."
      fail:
        - "Hệ thống tham chiếu: 3 máy chủ, 48 CPU, RAM 256 GB, ổ cứng 6 TB, IOPS
           khoảng 10.000."
    see_also: [EVD-01, MTH-03, MTH-04]
    note: >
      KHÔNG áp dụng cho Dạng I không có hệ tham chiếu (khi đó MTH-02 áp dụng thay).
      CẠM BẪY GẮN checklist_ref: R37 và CL-3.x.15 cùng nói về "IOPS và latency" nhưng
      khác bản chất — R37 là IOPS/latency ĐO ĐƯỢC của hệ tham chiếu (số liệu ĐẦU VÀO),
      còn CL-3.x.15 là IOPS/latency TÍNH RA cho hệ mới (kết quả ĐẦU RA). Gắn nhầm thì
      Copilot báo "đã có" cho một mục thực ra còn thiếu.

  - id: EVD-05
    name: "Định cỡ theo tổng tải giao dịch giờ cao điểm"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R42]
    checklist_ref: [CL-3.x.7]
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 19"
    check: "tong_tai_peak_khai >= tong_tai_cac_nghiep_vu"
    inputs:
      - {name: tong_tai_peak_khai,      unit: "TPS | RPS | CCU", required: true}
      - {name: tong_tai_cac_nghiep_vu,  unit: "TPS | RPS | CCU", required: true}
    note: >
      Module phục vụ nhiều loại giao dịch phải định cỡ theo TỔNG giao dịch tại giờ
      peak, không phải theo loại giao dịch lớn nhất. `tong_tai_cac_nghiep_vu` là tổng
      các số hạng mà C4 cộng từ bảng phân tách nghiệp vụ (EVD-11 / R110).
      Dùng ">=" vì định cỡ dư so với tổng tải không phải lỗi ở quy tắc này.
      Thiếu bảng phân tách nghiệp vụ thì không cộng được -> finding "thiếu thông tin"
      (NT4), và EVD-11 bắt phần thiếu đó.
    see_also: [EVD-11, KPI-12]
    message_template: >
      Tổng tải dùng để định cỡ khai {tong_tai_peak_khai}, nhỏ hơn tổng tải các loại
      nghiệp vụ tại giờ peak ({tong_tai_cac_nghiep_vu}). Đề nghị định cỡ theo tổng tải.

  - id: EVD-06
    name: "Mô tả tài nguyên dành riêng và cơ chế swap / huge-page"
    type: qualitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R53]
    checklist_ref: [CL-3.x.2]
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 24"
    applies_when: "dung_tai_nguyen_danh_rieng or dung_nhieu_ram"
    inputs:
      - {name: dung_tai_nguyen_danh_rieng, unit: "đúng/sai", required: true}
      - {name: dung_nhieu_ram,             unit: "đúng/sai", required: true}
    criteria: >
      Hai nhánh, xét riêng.
      NHÁNH (a) phân hệ dùng tài nguyên dành riêng (DPDK, CPU pinning, dedicate RAM
      như Storm): ĐẠT khi nêu rõ LOẠI tài nguyên dành riêng và SỐ LƯỢNG (bao nhiêu core
      pinning, bao nhiêu GB RAM dành riêng), TÁCH khỏi phần tài nguyên dùng chung.
      NHÁNH (b) phân hệ dùng nhiều RAM (IMDB, Redis, Memcached, cache in-memory): ĐẠT
      khi nêu rõ CÓ BẬT SWAP KHÔNG; nếu có thì NGƯỠNG %RAM bắt đầu dùng swap; và có
      dùng HUGE-PAGE không.
      KHÔNG ĐẠT khi: phân hệ Redis/IMDB chỉ khai tổng RAM, không nói gì về swap và
      huge-page; hoặc khai dùng DPDK nhưng không tách số core dành riêng khỏi tổng vCPU.
      KHÔNG ÁP DỤNG khi phân hệ không thuộc cả hai nhánh — ứng dụng web/API thông
      thường, DB quan hệ tiêu chuẩn.
    examples:
      pass:
        - "Cụm Redis: 8 vCPU/node, RAM 64 GB, TẮT swap để tránh độ trễ; bật huge-page
           2 MB cho vùng dữ liệu. Dung lượng dữ liệu tối đa giữ ở 80% RAM."
      fail:
        - "Phân hệ Redis: 03 node, mỗi node 8 vCPU và 64 GB RAM."
    see_also: [ARC-19, EVD-18]

  - id: EVD-07
    name: "Hệ hiệu năng cao phải tính hiệu năng cho từng phân vùng riêng"
    type: qualitative
    applies_to_equipment: [luu_tru]
    scope: phan_he_x_cong_nghe_luu_tru
    round: 2
    legacy_ref: [R59]
    checklist_ref: [CL-3.x.15]
    severity: major
    source_doc: "TL-DINH-CO, mục 5 Định cỡ thiết bị lưu trữ, trang 25"
    applies_when: "he_hieu_nang_cao"
    inputs:
      - {name: he_hieu_nang_cao, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi đủ ba: (1) có phần tính HIỆU NĂNG (IOPS, latency) cho thiết bị lưu trữ,
      không chỉ dung lượng; (2) tính RIÊNG CHO TỪNG PHÂN VÙNG theo loại dữ liệu — tối
      thiểu tách được phân vùng DB, phân vùng backup, phân vùng archive nếu hệ thống
      có; (3) mỗi phân vùng có IOPS và latency riêng, không gộp một con số cho cả
      thiết bị.
      KHÔNG ĐẠT khi: chỉ tính dung lượng, bỏ hẳn phần hiệu năng; có nhiều phân vùng
      nhưng chỉ một giá trị IOPS chung; hoặc gộp phân vùng DB và backup làm một khi
      hai loại có đặc tính I/O khác hẳn nhau.
      PHẠM VI: hệ thuộc một trong các loại tài liệu liệt kê — VDI, lưu trữ dùng chung
      cho nhiều hệ hiệu năng cao, CSDL OLTP, ảo hóa số lượng lớn, media, dữ liệu lớn.
    examples:
      pass:
        - "Phân vùng DB (OLTP): 12 ổ SSD RAID 10, 18.000 IOPS backend, latency mục tiêu
           dưới 1 ms. Phân vùng backup: 8 ổ NL-SAS RAID 6, 900 IOPS, latency dưới 10 ms.
           Phân vùng archive: tính riêng theo dung lượng, không yêu cầu IOPS."
      fail:
        - "Thiết bị lưu trữ dùng chung cho CSDL và backup, tổng 20 TB, IOPS thiết kế
           15.000."
    see_also: [STO-01, STO-08, EVD-04]

  - id: EVD-08
    name: "Phải nêu tính sẵn sàng và thời gian downtime cho phép"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R103]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 18"
    criteria: >
      Phải có CẢ HAI con số, kèm đơn vị: (1) TÍNH SẴN SÀNG — thời gian cho phép
      downtime MỖI THÁNG, tính bằng phút/tháng; (2) THỜI GIAN DOWNTIME CHO PHÉP CHO
      MỖI SỰ CỐ, tính bằng phút.
      Khai theo tỷ lệ phần trăm (99,9%) được chấp nhận NẾU quy đổi ra phút/tháng ngay
      tại chỗ, hoặc con số phút/tháng xuất hiện ở nơi khác trong tài liệu; nếu chỉ có
      "99,9%" đơn độc thì hạ xuống mức `minor` và đề nghị bổ sung, không tính là không đạt.
      KHÔNG ĐẠT khi: bảng thông số đầu vào không có dòng nào về tính sẵn sàng/downtime;
      chỉ có một trong hai con số (thường chỉ có tính sẵn sàng tháng, thiếu downtime
      mỗi sự cố); nêu bằng lời không có số ("đảm bảo hoạt động liên tục 24/7"); hoặc có
      số nhưng sai đơn vị so với tài liệu.
    examples:
      pass:
        - "Tính sẵn sàng: cho phép downtime tối đa 43 phút/tháng (tương đương 99,9%).
           Thời gian downtime cho phép với mỗi sự cố: 15 phút."
      fail:
        - "Hệ thống yêu cầu tính sẵn sàng cao, hoạt động 24/7, đảm bảo phục hồi nhanh
           khi có sự cố."
    see_also: [ARC-13, BAK-01]
    note: >
      Đây là THÔNG SỐ ĐẦU VÀO, không phải kết quả định cỡ. Nó là căn cứ để đánh giá
      mức dự phòng có tương xứng không — thiếu nó thì ARC-12/ARC-13 mất một phần sở cứ.

  - id: EVD-09
    name: "Phải nêu các yếu tố ảnh hưởng thông số tài nguyên máy chủ"
    type: qualitative
    applies_to_equipment: [may_chu]
    scope: he_thong
    round: 2
    legacy_ref: [R104]
    checklist_ref: [CL-2.5, CL-3.x.7]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 18"
    criteria: >
      ĐẠT khi cả hai: (1) MỌI yếu tố mà chính bản sizing dùng làm đầu vào cho một phép
      tính đều được khai trong bảng thông số đầu vào, có giá trị và đơn vị — nói cách
      khác, không có con số nào xuất hiện lần đầu ngay trong công thức mà không có
      nguồn ở phần đầu vào; (2) bảng thông số đầu vào nêu được ít nhất các yếu tố ứng
      với MỤC ĐÍCH SỬ DỤNG MÁY CHỦ đã khai (CSDL / ứng dụng / media / SAN).
      KHÔNG ĐẠT khi: bảng thông số đầu vào không có yếu tố nào trong danh sách
      Guideline liệt kê; công thức định cỡ dùng một con số mà con số đó không có ở phần
      thông số đầu vào (không truy được nguồn); hoặc chỉ khai một yếu tố tổng ("5 triệu
      thuê bao") rồi tính thẳng, không phân biệt đăng ký / active / đồng thời — ba con
      số khác nhau nhiều bậc, gộp lại là mất căn cứ.
    examples:
      pass:
        - "Thuê bao đăng ký 5.200.000; thuê bao active 1.800.000; người dùng đồng thời
           giờ cao điểm 42.000; request đồng thời 3.500; số giao dịch/người dùng/ngày 7;
           kích thước bản tin trung bình 12 KB; mục đích máy chủ: ứng dụng và CSDL.
           Toàn bộ công thức mục 4 dùng lại đúng các giá trị này."
      fail:
        - "Hệ thống phục vụ khoảng 5 triệu thuê bao. Định cỡ CPU dựa trên 3.500 request
           đồng thời tại giờ cao điểm."
    see_also: [EVD-03, EVD-11]
    note: >
      "[CẦN XÁC NHẬN] CỐ Ý KHÔNG ép đủ cả 11 yếu tố" mà Guideline liệt kê. Tài liệu
      không nói yếu tố nào BẮT BUỘC, và nhiều yếu tố không áp dụng cho mọi hệ (ví dụ
      "số thiết bị kết nối đồng thời" với hệ thuần web nội bộ). Ép đủ 11 sẽ sinh cảnh
      báo sai hàng loạt — trái với ưu tiên độ chính xác hơn độ phủ. Tiêu chí trên vì
      vậy neo vào NHỮNG YẾU TỐ BẢN SIZING THỰC SỰ DÙNG.
      Cần hỏi đơn vị thẩm định: có tập yếu tố tối thiểu bắt buộc không?

  - id: EVD-10
    name: "Định cỡ ở cả hai mức; tổng toàn hệ bằng tổng các module"
    type: quantitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R105]
    checklist_ref: [CL-2.9, CL-3.x.20]
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 20"
    check: >
      abs(tong_toan_he - (tong_cac_phan_he + tong_thanh_phan_dung_chung))
      <= max(1, 0.005 * tong_toan_he)
    inputs:
      - {name: tong_toan_he,                unit: "theo tài nguyên", required: true}
      - {name: tong_cac_phan_he,            unit: "theo tài nguyên", required: true}
      - {name: tong_thanh_phan_dung_chung,  unit: "theo tài nguyên", required: true}
    note: >
      SỐ HẠNG DÙNG CHUNG LÀ BẮT BUỘC. Guideline nói rõ bảng tổng hợp toàn hệ gồm cả
      "một số thành phần dùng chung như mạng, Firewall, LB" — những thứ không thuộc
      phân hệ nào. Bỏ số hạng này sẽ báo lệch giả cho MỌI bản sizing có FW/LB.
      C4 chạy quy tắc này một lần cho mỗi loại tài nguyên (vCPU, RAM, lưu trữ, IOPS,
      băng thông, số node).
      "[CHƯA CHẮC] DUNG SAI": Guideline không cho con số. Đang dùng "lệch không quá 1
      đơn vị HOẶC 0,5%" để hấp thụ sai lệch làm tròn — chưa được người thẩm định xác
      nhận. rules-formulas.md điểm 14.
      THIẾU BẢNG: thiếu hẳn bảng tổng hợp toàn hệ hoặc bảng của một phân hệ -> finding
      nhóm "thiếu thông tin", KHÔNG phải "sai số liệu". Đó cũng chính là mục Vòng 1
      EVD-16 / EVD-22; trượt Vòng 1 thì C7 CHẶN finding này.
    see_also: [EVD-16, EVD-22]
    message_template: >
      Bảng tổng hợp toàn hệ thống ghi {tong_toan_he}, trong khi tổng các phân hệ
      ({tong_cac_phan_he}) cộng thành phần dùng chung ({tong_thanh_phan_dung_chung})
      cho kết quả khác. Đề nghị rà soát để hai bảng khớp nhau.

  - id: EVD-11
    name: "Bảng thông số đầu vào phải tách tải theo loại nghiệp vụ kèm tỉ lệ"
    type: qualitative
    applies_to_equipment: [may_chu]
    scope: he_thong
    round: 2
    legacy_ref: [R110]
    checklist_ref: [CL-2.5, CL-3.x.7]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 17"
    criteria: >
      Phải có đủ CẢ BA: (1) TỔNG SỐ THUÊ BAO/NGƯỜI DÙNG sử dụng dịch vụ, có đơn vị;
      (2) TỔNG SỐ GIAO DỊCH ĐỒNG THỜI TẠI THỜI ĐIỂM PEAK, theo TPS (hoặc TPM), hoặc
      CCU/RPS như tài liệu cho phép; (3) PHÂN TÁCH THEO LOẠI NGHIỆP VỤ — liệt kê các
      loại tải chính, mỗi loại có TỈ LỆ % trên tổng số giao dịch, và TỔNG CÁC TỈ LỆ
      BẰNG 100%, kèm một câu về căn cứ của tỉ lệ giả định (số liệu hệ đang chạy, thống
      kê, hoặc hệ tham chiếu).
      KHÔNG ĐẠT khi: chỉ có một con số TPS tổng, không tách loại nghiệp vụ nào, trong
      khi phần mô tả hệ thống cho thấy có nhiều nhóm chức năng khác nhau; có tách loại
      nghiệp vụ nhưng không có tỉ lệ %, hoặc tổng các tỉ lệ khác 100%; tỉ lệ đưa ra
      không kèm bất kỳ căn cứ nào; hoặc thiếu tổng số thuê bao/người dùng.
      KHÔNG ÁP DỤNG phần tách nghiệp vụ cho hệ CHỈ CÓ MỘT LOẠI GIAO DỊCH duy nhất —
      nhưng tài liệu phải nói rõ điều đó, và hai dòng tổng vẫn bắt buộc.
    examples:
      pass:
        - "Tổng số thuê bao sử dụng dịch vụ: 5.200.000. Tổng giao dịch đồng thời giờ
           Peak: 4.000 TPS, gồm: tra cứu số dư 60% (2.400 TPS), chuyển tiền 25%
           (1.000 TPS), nạp thẻ 15% (600 TPS). Tỉ lệ lấy theo thống kê 03 tháng gần
           nhất của hệ thống hiện hành."
      fail:
        - "Hệ thống cần đáp ứng 4.000 TPS tại giờ cao điểm cho toàn bộ các nghiệp vụ
           tra cứu, chuyển tiền và nạp thẻ."
    see_also: [EVD-05, EVD-09]
    note: >
      PHÂN VAI VỚI EVD-05 (R42): EVD-05 là định lượng, kiểm định cỡ có làm theo TỔNG
      tải hay không. EVD-11 kiểm tài liệu có TRÌNH BÀY PHÂN TÁCH tổng đó theo loại
      nghiệp vụ kèm tỉ lệ hay không. Một bản tính đúng theo tổng nhưng không tách loại
      thì qua EVD-05, trượt EVD-11.
      Phần "tổng các tỉ lệ = 100%" KIỂM ĐƯỢC BẰNG CODE — khi hiện thực hóa ở C4/C5, nên
      tách ý này thành `computed_evidence` để finding có căn cứ mạnh hơn `rule_quote`.

  - id: EVD-12
    name: "Phải có mô tả tổng quan hệ thống"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.2]
    checklist_ref: [CL-2.2]
    severity: major
    source_doc: "CHECKLIST-TD, mục 2.2"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: tài liệu có THÔNG TIN THỰC CHẤT về mục này là ĐẠT.
      Cụ thể: có phần mô tả tổng quan hệ thống — hệ thống làm gì, phục vụ ai, gồm những
      thành phần nào.
      KHÔNG ĐẠT khi: không có mục này; hoặc chỉ có tiêu đề mà bỏ trống nội dung; hoặc
      nội dung là chỗ giữ chỗ chưa điền ("...", "TBD", "sẽ bổ sung").
      KHÔNG được đánh trượt vì mô tả sơ sài hay thiếu chi tiết kỹ thuật — Vòng 1 chỉ
      hỏi CÓ hay KHÔNG.

  - id: EVD-13
    name: "Phải có mô hình logic tổng quan, đủ thành phần"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.6]
    checklist_ref: [CL-2.6]
    severity: major
    source_doc: "CHECKLIST-TD, mục 2.6"
    criteria: >
      TIÊU CHÍ RIÊNG (nguyên văn cột Ghi chú checklist cho mục 2.6–2.9): "Gồm đầy đủ
      các thành phần đang chạy và thêm mới (nếu có)".
      ĐẠT khi: có mô hình logic tổng quan, VÀ mô hình đó thể hiện cả thành phần ĐANG
      CHẠY lẫn thành phần THÊM MỚI (nếu bản sizing là mở rộng hệ đang vận hành).
      KHÔNG ĐẠT khi: không có mô hình logic; hoặc là bản sizing mở rộng nhưng mô hình
      chỉ vẽ phần thêm mới, không có phần đang chạy.
    see_also: [EVD-14, EVD-15]
    note: >
      Mô hình thường là HÌNH ẢNH. Theo NT4, nếu C2 không đọc được nội dung hình thì
      xuất cảnh báo "không kiểm chứng được, đề nghị người dùng tự xác nhận" — KHÔNG
      kết luận thiếu, cũng không im lặng bỏ qua.

  - id: EVD-14
    name: "Phải có mô hình vật lý tổng quan, đủ thành phần"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.7]
    checklist_ref: [CL-2.7]
    severity: major
    source_doc: "CHECKLIST-TD, mục 2.7"
    criteria: >
      TIÊU CHÍ RIÊNG (nguyên văn, mục 2.6–2.9): "Gồm đầy đủ các thành phần đang chạy và
      thêm mới (nếu có)".
      ĐẠT khi có mô hình vật lý tổng quan thể hiện cả thành phần đang chạy lẫn thêm mới.
      KHÔNG ĐẠT khi không có mô hình vật lý, hoặc mô hình chỉ vẽ phần thêm mới với bản
      sizing mở rộng.
    see_also: [EVD-13, ARC-10, ALC-05]
    note: >
      Là nơi ALC-05 (R108) soi để kiểm quy hoạch cấp phát — vị trí LB/lưu trữ so với
      phân hệ dùng chúng, và phân bổ node ảo hóa quan trọng trên các host khác nhau.
      Áp dụng cùng lưu ý NT4 về hình ảnh như EVD-13.

  - id: EVD-15
    name: "Phải có luồng nghiệp vụ tổng quan, gồm nội bộ và giao tiếp ngoài"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.8]
    checklist_ref: [CL-2.8]
    severity: major
    source_doc: "CHECKLIST-TD, mục 2.8"
    criteria: >
      TIÊU CHÍ RIÊNG (nguyên văn, mục 2.6–2.9): "Gồm đầy đủ các thành phần đang chạy và
      thêm mới (nếu có)".
      ĐẠT khi có phần luồng nghiệp vụ tổng quan, thể hiện cả luồng NỘI BỘ giữa các phân
      hệ lẫn luồng GIAO TIẾP RA NGOÀI hệ thống.
      KHÔNG ĐẠT khi: không có phần luồng nghiệp vụ; hoặc chỉ mô tả luồng nội bộ mà
      không nói gì tới giao tiếp với hệ thống bên ngoài.
    see_also: [ARC-15, FWL-04]
    note: >
      Là ĐẦU VÀO để xác định `co_duong_ra_public` của FWL-04 (ZONE-01) — cùng với
      ARC-15 (nguồn request) và ARC-16 (giao thức, port).

  - id: EVD-16
    name: "Phải có bảng tổng hợp đề xuất cấu hình toàn hệ thống"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.9]
    checklist_ref: [CL-2.9]
    severity: critical
    source_doc: "CHECKLIST-TD, mục 2.9"
    criteria: >
      TIÊU CHÍ RIÊNG (nguyên văn, mục 2.6–2.9): "Gồm đầy đủ các thành phần đang chạy và
      thêm mới (nếu có)".
      ĐẠT khi có bảng tổng hợp đề xuất cấu hình cho TOÀN HỆ THỐNG, liệt kê các thành
      phần và tài nguyên tương ứng.
      KHÔNG ĐẠT khi: không có bảng tổng hợp toàn hệ; hoặc chỉ có bảng của từng phân hệ
      mà thiếu bảng tổng.
      Vòng 1 KHÔNG kiểm các con số trong bảng có cộng đúng không — việc đó là EVD-10.
    see_also: [EVD-10, EVD-22]
    note: >
      Trượt quy tắc này thì C7 phải CHẶN finding EVD-10 (tổng toàn hệ = tổng các phân
      hệ) — báo "công thức cộng sai" cho người chưa lập bảng tổng là vô nghĩa.

  - id: EVD-17
    name: "Phải có mô tả chi tiết từng phân hệ"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.1]
    checklist_ref: [CL-3.x.1]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.1 / 3.2.1"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: mỗi phân hệ có
      phần mô tả chi tiết — phân hệ làm gì, vai trò trong hệ thống.
      KHÔNG ĐẠT khi không có mục này cho phân hệ đang xét, hoặc chỉ có tiêu đề trống.
      KHÔNG được đánh trượt vì mô tả ngắn — Vòng 1 chỉ hỏi CÓ hay KHÔNG.

  - id: EVD-18
    name: "Phải nêu công nghệ sử dụng của từng phân hệ"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.2]
    checklist_ref: [CL-3.x.2]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.2 / 3.2.2"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: nêu công nghệ mà
      phân hệ sử dụng (ví dụ Spring Boot, MariaDB, Redis, Kafka, Kubernetes).
      KHÔNG ĐẠT khi không có thông tin công nghệ nào cho phân hệ đang xét.
    see_also: [EVD-06]
    note: >
      Là ĐẦU VÀO xác định `applies_to_module` của cả loạt quy tắc theo công nghệ
      (ARC-17..25, RAM-03, STO-19..23). Thiếu mục này thì các quy tắc đó không biết áp
      hay không -> trả "không áp dụng", không đoán.

  - id: EVD-19
    name: "Phải có mô hình logic của từng phân hệ"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.4]
    checklist_ref: [CL-3.x.4]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.4 / 3.2.5"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: phân hệ có mô
      hình logic riêng, không chỉ dựa vào mô hình tổng quan của cả hệ thống.
      KHÔNG ĐẠT khi không có mô hình logic cho phân hệ đang xét.
    see_also: [EVD-13, EVD-20]
    note: "Áp dụng cùng lưu ý NT4 về hình ảnh như EVD-13."

  - id: EVD-20
    name: "Phải có mô hình vật lý của từng phân hệ"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.5]
    checklist_ref: [CL-3.x.5]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.5 / 3.2.6"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: phân hệ có mô
      hình vật lý riêng — số node, cách bố trí, kết nối.
      KHÔNG ĐẠT khi không có mô hình vật lý cho phân hệ đang xét.
    see_also: [EVD-14, EVD-19, ARC-07]
    note: "Áp dụng cùng lưu ý NT4 về hình ảnh như EVD-13."

  - id: EVD-21
    name: "Phải nêu lưu lượng dữ liệu mỗi request"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.8]
    checklist_ref: [CL-3.x.8]
    severity: major
    source_doc: "CHECKLIST-TD, mục 3.1.8 / 3.2.9"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: nêu lưu lượng
      dữ liệu trao đổi cho mỗi request (kích thước bản tin), có đơn vị.
      KHÔNG ĐẠT khi không có thông tin nào về lưu lượng dữ liệu mỗi request.
    see_also: [FWL-04, EVD-09]
    note: >
      Guideline KHÔNG có thông số này — checklist thêm vào. Đây chính là "kích thước
      bản tin" mà FWL-04 (ZONE-01) dùng để tính băng thông firewall/LB, và nó KHÁC gói
      chuẩn 1518/512 Byte của FWL-03 (R85) — gói chuẩn dùng để ĐỌC NĂNG LỰC THIẾT BỊ,
      còn cái này là số liệu thực của ứng dụng dùng để TÍNH NHU CẦU. Lẫn hai thứ là sai
      phương pháp.

  - id: EVD-22
    name: "Phải có bảng tổng hợp đề xuất cấu hình cho từng phân hệ"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: phan_he
    round: 1
    legacy_ref: [CL-3.x.20]
    checklist_ref: [CL-3.x.20]
    severity: critical
    source_doc: "CHECKLIST-TD, mục 3.1.20 / 3.2.22"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: mỗi phân hệ có
      bảng tổng hợp đề xuất cấu hình — số node và tài nguyên mỗi node.
      KHÔNG ĐẠT khi không có bảng đề xuất cấu hình cho phân hệ đang xét.
      Vòng 1 KHÔNG kiểm con số trong bảng có đúng không — việc đó là KPI-13, ARC-08.
    see_also: [EVD-10, EVD-16, ARC-08]
    note: >
      Trượt quy tắc này thì C7 CHẶN mọi finding Vòng 2 về định cỡ của phân hệ đó,
      gồm cả EVD-10 (tổng toàn hệ = tổng các phân hệ).

  # ===========================================================================
  # NHÓM CPU — chỉ số SPEC, quy đổi, công thức tài nguyên CPU
  # CPU-01..10 Guideline · CPU-11 code web app
  #
  # PHỤ THUỘC CHUNG: nhiều quy tắc trong nhóm cần `Cint_rated`. Bảng gốc nằm ở
  # Phụ lục 02 — KHÔNG có trong file PDF. Đã chốt 2026-08-24 thay bằng quy ước theo
  # hình thức cấp phát: VM (~90%) 1 vCPU = 3 (`globals.cint_rated_per_vcpu`);
  # máy chủ vật lý (~10%) KHÔNG có mặc định -> `None`, người làm sizing tự lấy từ
  # spec.org. Thiếu thì sinh finding "thiếu thông tin" (NT4), KHÔNG bịa giá trị.
  # ===========================================================================

  - id: CPU-01
    name: "Đánh giá CPU bằng Cint_rated / Cfp_rated theo chuẩn SPEC CPU2017"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R16]
    checklist_ref: [CL-3.x.13]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    check: "chuan_spec == 2017 or not co_ket_qua_2017"
    inputs:
      - {name: chuan_spec,       unit: "2017 | 2006", required: true}
      - {name: co_ket_qua_2017,  unit: "đúng/sai", required: true}
    note: >
      Bắt buộc SPEC CPU2017; chỉ được dùng SPEC CPU2006 khi CPU đó KHÔNG có kết quả
      2017 công bố. Khi dùng 2006 thì phải quy đổi theo CPU-02 (R17).
      Chọn chỉ số nào — `Cint_rated` hay `Cfp_rated` — do CPU-10 (R100) quyết định.
    see_also: [CPU-02, CPU-10]
    message_template: >
      Tài liệu dùng chuẩn SPEC CPU{chuan_spec} trong khi CPU có kết quả 2017. Guideline
      yêu cầu dùng SPEC CPU2017; 2006 chỉ dùng khi không có kết quả 2017.

  - id: CPU-02
    name: "Quy đổi SPEC CPU2006 sang CPU2017 theo hệ số của Guideline"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R17]
    checklist_ref: [CL-3.x.13]
    severity: critical
    source_doc: "TL-DINH-CO, mục A.1 Nguyên tắc định cỡ, trang 9"
    applies_when: "chuan_spec == 2006"
    formula: "spec2006 * he_so_quy_doi"
    inputs:
      - {name: chuan_spec,     unit: "2017 | 2006", required: true, role: lookup}
      - {name: spec2006,       unit: points,        required: true}
      - {name: he_so_quy_doi,  unit: "hệ số",       required: true}
    compare_with: spec2017_khai
    tolerance: 0.01
    note: >
      Bốn hệ số KHÁC NHAU theo hạng mục, C4 tra `he_so_quy_doi` từ hạng mục rồi nhân:
      int_rate_peak 8.38 · int_rate_base 9.36 · fp_rate_peak 6.74 · fp_rate_base 7.38
      (`globals.spec2006_to_2017_*`).
      Dùng nhầm hệ số giữa peak và base lệch khoảng 12% — đủ để sai một bậc cấu hình.
    see_also: [CPU-01, CPU-10]
    message_template: >
      Chỉ số SPEC2017 khai {declared}, quy đổi từ SPEC2006 {spec2006} × hệ số
      {he_so_quy_doi} được {expected}.

  - id: CPU-03
    name: "Quy đổi SPEC của vCPU theo tỷ lệ overcommit"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R20]
    checklist_ref: [CL-3.x.13]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Khái niệm, trang 6"
    formula: "spec_1_cpu / (so_core_1_cpu * ty_le_overcommit)"
    inputs:
      - {name: spec_1_cpu,        unit: points,  required: true}
      - {name: so_core_1_cpu,     unit: core,    required: true}
      - {name: ty_le_overcommit,  unit: "hệ số", required: true}
    compare_with: spec_1_vcpu_khai
    tolerance: 0.02
    note: >
      `ty_le_overcommit` lấy theo CPU-04 (R21): 4 với VM thường, 2 với VM hiệu năng cao.
      Lưu ý phân biệt với CPU-09 (R52) — CPU-09 quy đổi NGƯỢC từ tổng SPEC ra số vCPU
      và dùng số thread/core, không dùng overcommit.
    see_also: [CPU-04, CPU-09]
    message_template: >
      SPEC mỗi vCPU khai {declared}, tính lại {spec_1_cpu} / ({so_core_1_cpu} core ×
      overcommit {ty_le_overcommit}) được {expected}.

  - id: CPU-04
    name: "Tỷ lệ overcommit CPU bằng 4, hoặc 2 với VM hiệu năng cao"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R21]
    checklist_ref: [CL-3.x.13]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Khái niệm, trang 6"
    check: >
      (vm_hieu_nang_cao and ty_le_overcommit_khai == overcommit_cpu_hieu_nang_cao)
      or (not vm_hieu_nang_cao and ty_le_overcommit_khai == overcommit_cpu)
    inputs:
      - {name: vm_hieu_nang_cao,        unit: "đúng/sai", required: true}
      - {name: ty_le_overcommit_khai,   unit: "hệ số",    required: true}
    note: >
      Guideline nêu thêm: tỷ lệ 2:1 hoặc tỷ lệ riêng khác phải THAM KHẢO VTNet. Vì vậy
      khi tài liệu dùng tỷ lệ ngoài hai giá trị chuẩn, câu finding nên đề nghị bổ sung
      ý kiến VTNet chứ không khẳng định sai.
      Đừng nhầm với ALC-02 (R94) — cấp phát cho phép overcommit CPU tới 4 nhưng đó là
      ngưỡng của khâu CẤP PHÁT, ngữ cảnh khác.
    see_also: [CPU-03, ALC-02]
    message_template: >
      Tỷ lệ overcommit CPU khai {ty_le_overcommit_khai}. Guideline quy định 4 cho VM
      thường và 2 cho VM hiệu năng cao; tỷ lệ khác cần tham khảo ý kiến TCT VTNet.

  - id: CPU-05
    name: "CPU sử dụng của máy chủ vật lý"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R43]
    checklist_ref: [CL-3.x.13]
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 21"
    applies_when: "hinh_thuc_cap_phat != 'ao_hoa'"
    formula: "cpu_95th_ty_le * cint_rated_1_cpu * so_cpu_vat_ly"
    inputs:
      - {name: hinh_thuc_cap_phat, unit: "ao_hoa | vat_ly | bare_metal", required: true, role: lookup}
      - {name: cpu_95th_ty_le,     unit: "tỷ lệ 0–1", required: true}
      - {name: cint_rated_1_cpu,   unit: points,      required: true}
      - {name: so_cpu_vat_ly,      unit: CPU,         required: true}
    compare_with: cpu_su_dung_khai
    tolerance: 0.02
    note: >
      "[CHƯA CHẮC]" Với máy chủ VẬT LÝ, `cint_rated_1_cpu` KHÔNG có giá trị mặc định —
      người làm sizing phải tự lấy từ spec.org theo đúng model CPU. Thiếu thì C4 để
      `None` và sinh finding "cần bổ sung Cint từ spec.org" (NT4), KHÔNG bịa.
      Kết quả là tải quy về SPEC, chưa phải cấu hình đề xuất — còn phải qua KPI-13.
    see_also: [CPU-06, CPU-10, KPI-13]
    message_template: >
      CPU sử dụng khai {declared} points-SPEC, tính lại ({cpu_95th_ty_le} ×
      {cint_rated_1_cpu} × {so_cpu_vat_ly} CPU) được {expected}.

  - id: CPU-06
    name: "CPU sử dụng của máy chủ ảo"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R44]
    checklist_ref: [CL-3.x.13]
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 21"
    applies_when: "hinh_thuc_cap_phat == 'ao_hoa'"
    formula: >
      cpu_95th_ty_le * (vcpu_may_ao / tong_vcpu_vat_ly)
      * cint_rated_1_cpu * so_cpu_vat_ly
    inputs:
      - {name: hinh_thuc_cap_phat, unit: "ao_hoa | vat_ly | bare_metal", required: true, role: lookup}
      - {name: cpu_95th_ty_le,     unit: "tỷ lệ 0–1", required: true}
      - {name: vcpu_may_ao,        unit: vCPU,        required: true}
      - {name: tong_vcpu_vat_ly,   unit: vCPU,        required: true}
      - {name: cint_rated_1_cpu,   unit: points,      required: true}
      - {name: so_cpu_vat_ly,      unit: CPU,         required: true}
    compare_with: cpu_su_dung_khai
    tolerance: 0.02
    note: >
      Khác CPU-05 ở thừa số tỷ lệ vCPU máy ảo trên tổng vCPU của host — phần tài nguyên
      vật lý mà VM thực sự chiếm.
      Với hệ VM (khoảng 90% trường hợp), `cint_rated_1_cpu` suy được từ quy ước
      1 vCPU = 3 (`globals.cint_rated_per_vcpu`) nên công thức chạy được ngay.
    see_also: [CPU-05, CPU-03, KPI-13]
    message_template: >
      CPU sử dụng của máy ảo khai {declared}, tính lại được {expected}
      (chênh {diff_pct}%).

  - id: CPU-07
    name: "Hệ điều hành máy chủ cần tối thiểu 02 core và 04 GB RAM"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R46]
    checklist_ref: [CL-3.x.13, CL-3.x.14]
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 21"
    check: >
      core_danh_cho_hdh >= hdh_min_core
      and ram_danh_cho_hdh_gb >= hdh_min_ram_gb
    inputs:
      - {name: core_danh_cho_hdh,   unit: core, required: true}
      - {name: ram_danh_cho_hdh_gb, unit: GB,   required: true}
    note: >
      Đây là phần CỘNG THÊM vào nhu cầu của ứng dụng, không phải trừ đi. Bỏ qua thì
      cấu hình đề xuất thiếu đúng bằng phần HĐH chiếm.
      Quy tắc chạm cả CPU lẫn RAM nhưng xếp nhóm CPU vì ràng buộc core là phần chính;
      phần RAM nằm trong cùng một câu của Guideline nên giữ chung một quy tắc.
    see_also: [CPU-08, RAM-02]
    message_template: >
      Phần dành cho hệ điều hành khai {core_danh_cho_hdh} core / {ram_danh_cho_hdh_gb}
      GB RAM, dưới mức tối thiểu 02 core và 04 GB của Guideline.

  - id: CPU-08
    name: "Hypervisor chiếm 10% CPU máy chủ và 6 GB RAM"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R47]
    checklist_ref: [CL-3.x.13, CL-3.x.14]
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 21"
    applies_when: "hinh_thuc_cap_phat == 'ao_hoa'"
    check: >
      cpu_danh_cho_hypervisor >= hypervisor_cpu_ratio * cpu_may_chu
      and ram_danh_cho_hypervisor_gb >= hypervisor_ram_gb
    inputs:
      - {name: hinh_thuc_cap_phat,          unit: "ao_hoa | vat_ly | bare_metal", required: true, role: lookup}
      - {name: cpu_danh_cho_hypervisor,     unit: "points | core", required: true}
      - {name: cpu_may_chu,                 unit: "points | core", required: true}
      - {name: ram_danh_cho_hypervisor_gb,  unit: GB, required: true}
    note: >
      Chỉ áp cho máy chủ ảo hóa. Cộng thêm cùng phần HĐH của CPU-07 — hai khoản khác
      nhau, không thay thế nhau: hypervisor là lớp ảo hóa của HOST, HĐH là của từng VM.
    see_also: [CPU-07, ARC-05]
    message_template: >
      Phần dành cho hypervisor khai {cpu_danh_cho_hypervisor} CPU /
      {ram_danh_cho_hypervisor_gb} GB RAM, dưới mức 10% CPU máy chủ ({cpu_may_chu}) và
      6 GB RAM theo Guideline.

  - id: CPU-09
    name: "Quy đổi tổng SPEC ra số vCPU"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R52]
    checklist_ref: [CL-3.x.13]
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 23"
    formula: >
      tong_spec_thanh_phan
      / (cint_rated_1_cpu / so_core_1_cpu / so_thread_1_core)
    inputs:
      - {name: tong_spec_thanh_phan, unit: points, required: true}
      - {name: cint_rated_1_cpu,     unit: points, required: true}
      - {name: so_core_1_cpu,        unit: core,   required: true}
      - {name: so_thread_1_core,     unit: thread, required: true}
    compare_with: so_vcpu_khai
    tolerance: 0.02
    note: >
      `so_thread_1_core` = 2 với CPU Intel có Hyper-Threading
      (`globals.thread_per_core_intel`). Với CPU không bật Hyper-Threading hoặc kiến
      trúc khác, giá trị này KHÁC 2 — C4 không được mặc định 2 mà phải lấy từ tài liệu;
      thiếu thì sinh finding "thiếu thông tin" (NT4).
      Đây là bước cuối để ra con số vCPU đề xuất, sau khi đã qua KPI-13.
    see_also: [CPU-03, CPU-10, KPI-13]
    message_template: >
      Số vCPU khai {declared}, quy đổi từ {tong_spec_thanh_phan} points-SPEC được
      {expected} vCPU (chênh {diff_pct}%).

  - id: CPU-10
    name: "Chọn chỉ số Cint_rated hay Cfp_rated theo loại hệ thống"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R100]
    checklist_ref: [CL-3.x.13]
    severity: major
    source_doc: "TL-DINH-CO, mục Khái niệm — mapping chỉ số CPU, trang 6"
    check: "chi_so_chon == chi_so_dung_cho_loai_he"
    inputs:
      - {name: loai_he_thong,            unit: "thong_thuong | tinh_toan_hieu_nang_cao", required: true, role: lookup}
      - {name: chi_so_chon,              unit: "cint_base | cint_peak | cfp_base | cfp_peak", required: true}
      - {name: chi_so_dung_cho_loai_he,  unit: "cint_base | cint_peak | cfp_base | cfp_peak", required: true}
    note: >
      Bảng mapping: `Cint_Rated` ứng với SPECrate_int_base (hệ CNTT thông thường) hoặc
      SPECrate_int_peak (hệ tính toán tối ưu); `Cfp_Rated` ứng với SPECrate_fp_base
      (dấu phảy động thông thường) hoặc SPECrate_fp_peak (tính toán-biên dịch tối ưu).
      `Cint_rated` dùng cho hầu hết trường hợp — phần mềm, ứng dụng, CSDL thông dụng
      phục vụ quản lý, kinh doanh. `Cfp_rated` dùng cho games, tính toán hiệu năng cao,
      khoa học, mô phỏng, xử lý đồ họa.
      Chọn nhầm int/fp làm sai toàn bộ chuỗi tính CPU.
    see_also: [CPU-01, CPU-05, CPU-06]
    message_template: >
      Tài liệu dùng chỉ số {chi_so_chon} cho hệ loại "{loai_he_thong}"; theo bảng
      mapping của Guideline phải dùng {chi_so_dung_cho_loai_he}.

  - id: CPU-11
    name: "Kafka: vCPU mỗi broker theo ngưỡng throughput 50 MB/s"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [kafka]
    scope: phan_he
    round: 2
    legacy_ref: [KFK-06]
    code_ref: "frontend/script.js:15934"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15934)"
    check: >
      (throughput_mbs < kafka_nguong_throughput_mbs
      and vcpu_broker_khai >= kafka_vcpu_broker_thap)
      or (throughput_mbs >= kafka_nguong_throughput_mbs
      and vcpu_broker_khai >= kafka_vcpu_broker_cao)
    inputs:
      - {name: throughput_mbs,    unit: MB/s, required: true}
      - {name: vcpu_broker_khai,  unit: vCPU, required: true}
    note: >
      Quy ước nội bộ: dưới 50 MB/s dùng 8 vCPU/broker, từ 50 MB/s trở lên dùng 16.
      Dùng ">=" chứ không "==" — khai nhiều vCPU hơn không phải lỗi ở quy tắc này.
      Không có căn cứ trong Guideline, cần văn bản nội bộ (rules-crossmap.md mục 3).
    see_also: [ARC-23, ARC-25]
    message_template: >
      Kafka throughput {throughput_mbs} MB/s nhưng khai {vcpu_broker_khai} vCPU mỗi
      broker. Quy ước nội bộ: 8 vCPU khi dưới 50 MB/s, 16 vCPU khi từ 50 MB/s.

  # ===========================================================================
  # NHÓM RAM
  # ===========================================================================

  - id: RAM-01
    name: "Không overcommit RAM khi định cỡ"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R22]
    checklist_ref: [CL-3.x.14]
    severity: major
    source_doc: "TL-DINH-CO, mục A.1 Khái niệm, trang 6"
    check: "ty_le_overcommit_ram_khai == overcommit_ram"
    inputs:
      - {name: ty_le_overcommit_ram_khai, unit: "hệ số", required: true}
    note: >
      "[CHƯA CHẮC] MÂU THUẪN NGỮ CẢNH": R22 (khâu ĐỊNH CỠ) quy định OR_ram = 1, trong
      khi ALC-02 (R94, khâu CẤP PHÁT) cho phép tới 1.5. Hai ngưỡng phục vụ hai giai
      đoạn khác nhau, nhưng cần người thẩm định xác nhận để C4 không đánh giá sai khi
      so cùng một con số vào cả hai. rules-formulas.md điểm 9.
    see_also: [ALC-02, CPU-04]
    message_template: >
      Tỷ lệ overcommit RAM khai {ty_le_overcommit_ram_khai}. Khi ĐỊNH CỠ, Guideline quy
      định không overcommit RAM (hệ số = 1).

  - id: RAM-02
    name: "RAM sử dụng = tỷ lệ dùng 95th × dung lượng RAM"
    type: quantitative
    applies_to_equipment: [may_chu]
    scope: phan_he
    round: 2
    legacy_ref: [R45]
    checklist_ref: [CL-3.x.14]
    severity: critical
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 21"
    formula: "ram_95th_ty_le * dung_luong_ram_gb"
    inputs:
      - {name: ram_95th_ty_le,     unit: "tỷ lệ 0–1", required: true}
      - {name: dung_luong_ram_gb,  unit: GB,          required: true}
    compare_with: ram_su_dung_khai_gb
    tolerance: 0.02
    note: >
      Kết quả là RAM ĐANG DÙNG của hệ tham chiếu, chưa phải cấu hình đề xuất — còn phải
      qua KPI-13 (nhân Ksosánh, chia Kkpi_ram, nhân Ksaisố), rồi CỘNG THÊM phần HĐH
      (CPU-07) và hypervisor (CPU-08).
    see_also: [KPI-13, CPU-07, CPU-08]
    message_template: >
      RAM sử dụng khai {declared} GB, tính lại ({ram_95th_ty_le} × {dung_luong_ram_gb}
      GB) được {expected} GB.

  - id: RAM-03
    name: "Redis: dung lượng dữ liệu = số key × kích thước bản ghi"
    type: quantitative
    applies_to_equipment: [may_chu]
    applies_to_module: [redis]
    scope: phan_he
    round: 2
    legacy_ref: [RDS-02]
    code_ref: "frontend/script.js:15205"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:15205)"
    formula: "so_key * kich_thuoc_ban_ghi_byte / 1073741824"
    inputs:
      - {name: so_key,                  unit: key,  required: true}
      - {name: kich_thuoc_ban_ghi_byte, unit: byte, required: true}
    compare_with: dung_luong_du_lieu_khai_gb
    tolerance: 0.02
    note: >
      1073741824 = 1024³ (byte -> GB). `so_key` lấy từ STO-19 (RDS-01).
      Kết quả là ĐẦU VÀO quyết định mô hình Redis ở ARC-19 (dưới/từ 32 GB) và RAM mỗi
      node ở ARC-20.
      LƯU Ý: công thức này chưa gồm overhead của chính Redis (metadata, fragmentation).
      Code web app cũng không tính — ghi lại để hỏi khi có văn bản nội bộ.
    see_also: [STO-19, ARC-19, ARC-20]
    message_template: >
      Dung lượng dữ liệu Redis khai {declared} GB, tính lại ({so_key} key ×
      {kich_thuoc_ban_ghi_byte} byte) được {expected} GB.

  # ===========================================================================
  # NHÓM BAK — định cỡ sao lưu
  # BAK-01..09 Guideline · BAK-10..11 code web app
  # ===========================================================================

  - id: BAK-01
    name: "Tác vụ backup phải đáp ứng thời gian hoàn thành yêu cầu"
    type: quantitative
    applies_to_equipment: [sao_luu, luu_tru]
    scope: phan_he
    round: 2
    legacy_ref: [R39]
    checklist_ref: [CL-2.5, CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 20"
    check: "dung_luong_backup_gb / bang_thong_backup_gbs <= thoi_gian_yeu_cau_giay"
    inputs:
      - {name: dung_luong_backup_gb,    unit: GB,   required: true}
      - {name: bang_thong_backup_gbs,   unit: GB/s, required: true}
      - {name: thoi_gian_yeu_cau_giay,  unit: giây, required: true}
    note: >
      Ví dụ của Guideline: backup 1 TB trong 2 giờ cần tốc độ tối thiểu 500 GB/h,
      tức khoảng 1,14 GB/s — kéo theo yêu cầu vùng lưu trữ SSD và cổng 32 Gbps.
      RÀNG BUỘC KÈM THEO mà Guideline nêu nhưng không định lượng: mạng lưu trữ / mạng IP
      phục vụ backup KHÔNG được chiếm kênh traffic người dùng. Phần này C5 kiểm qua
      BAK-09; ở đây chỉ kiểm được phép tính thời gian.
      Thời gian hoàn thành backup là THÔNG SỐ ĐẦU VÀO (EVD-08 nhóm cùng bảng) — thiếu
      thì sinh finding "thiếu thông tin" (NT4).
    see_also: [BAK-09, EVD-08, STO-06]
    message_template: >
      Backup {dung_luong_backup_gb} GB với băng thông {bang_thong_backup_gbs} GB/s cần
      nhiều hơn {thoi_gian_yeu_cau_giay} giây yêu cầu. Đề nghị tăng băng thông hoặc
      xem lại chu kỳ sao lưu.

  - id: BAK-02
    name: "Tổng dung lượng sao lưu = sao lưu toàn bộ + sao lưu gia tăng"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R70]
    checklist_ref: [CL-3.2.19]
    severity: critical
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    formula: "dung_luong_toan_bo_gb + dung_luong_gia_tang_gb"
    inputs:
      - {name: dung_luong_toan_bo_gb,  unit: GB, required: true}
      - {name: dung_luong_gia_tang_gb, unit: GB, required: true}
    compare_with: tong_dung_luong_sao_luu_khai
    tolerance: 0.02
    note: >
      Cả hai số hạng tính THEO THỜI GIAN LƯU TRỮ dữ liệu — số bản full nhân dung lượng
      mỗi bản, cộng tổng các bản incremental trong chu kỳ giữ.
      Đây là dung lượng sao lưu; phần chỗ trống để RESTORE là quy tắc riêng, STO-06 (R58).
    see_also: [BAK-03, BAK-04, STO-06]
    message_template: >
      Tổng dung lượng sao lưu khai {declared} GB, tính lại ({dung_luong_toan_bo_gb} +
      {dung_luong_gia_tang_gb}) được {expected} GB.

  - id: BAK-03
    name: "Số tape cho sao lưu toàn bộ"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R71]
    checklist_ref: [CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    formula: >
      dung_luong_toan_bo_gb / dung_luong_1_tape_gb * so_ban
      * tape_he_so_du_phong
    inputs:
      - {name: dung_luong_toan_bo_gb,  unit: GB,   required: true}
      - {name: dung_luong_1_tape_gb,   unit: GB,   required: true}
      - {name: so_ban,                 unit: bản,  required: true}
    compare_with: so_tape_toan_bo_khai
    tolerance: 0.02
    note: >
      `dung_luong_1_tape_gb` tra theo thế hệ LTO ở BAK-07 (R75). `so_ban` tối thiểu 2
      theo BAK-06 (R74).
      "[CHƯA CHẮC]" `tape_he_so_du_phong` = 1.1 KHÔNG được Guideline ghi tường minh
      trong R71 — suy từ R74. Cần xác nhận; rules-formulas.md điểm 5.
      Kết quả làm tròn LÊN (`globals.lam_tron`).
    see_also: [BAK-04, BAK-06, BAK-07]
    message_template: >
      Số tape sao lưu toàn bộ khai {declared}, tính lại được {expected}
      (chênh {diff_pct}%).

  - id: BAK-04
    name: "Số tape cho sao lưu gia tăng"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R72]
    checklist_ref: [CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    formula: >
      dung_luong_gia_tang_gb / dung_luong_1_tape_gb * so_ban
      * tape_he_so_du_phong
    inputs:
      - {name: dung_luong_gia_tang_gb, unit: GB,  required: true}
      - {name: dung_luong_1_tape_gb,   unit: GB,  required: true}
      - {name: so_ban,                 unit: bản, required: true}
    compare_with: so_tape_gia_tang_khai
    tolerance: 0.02
    note: "Cùng công thức với BAK-03 nhưng dùng dung lượng gia tăng. Cùng điểm [CHƯA CHẮC] về hệ số 1.1."
    see_also: [BAK-03, BAK-06, BAK-07]
    message_template: >
      Số tape sao lưu gia tăng khai {declared}, tính lại được {expected}
      (chênh {diff_pct}%).

  - id: BAK-05
    name: "Số driver và số đường kết nối tối thiểu 02"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R73]
    checklist_ref: [CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    check: >
      so_driver_khai >= max(tape_driver_toi_thieu,
      dung_luong_giay_mbs / toc_do_1_tape_mbs)
      and so_duong_ket_noi_khai >= max(tape_duong_ket_noi_toi_thieu,
      dung_luong_giay_mbs / toc_do_1_duong_mbs)
    inputs:
      - {name: dung_luong_giay_mbs,    unit: MB/s,   required: true}
      - {name: toc_do_1_tape_mbs,      unit: MB/s,   required: true}
      - {name: toc_do_1_duong_mbs,     unit: MB/s,   required: true}
      - {name: so_driver_khai,         unit: driver, required: true}
      - {name: so_duong_ket_noi_khai,  unit: đường,  required: true}
    note: >
      `dung_luong_giay_mbs` = tổng dung lượng cần sao lưu chia thời gian yêu cầu (giây).
      `toc_do_1_tape_mbs` tra theo thế hệ LTO ở BAK-07.
      Sàn cứng 02 driver và 02 đường kết nối là để dự phòng, áp cả khi phép chia cho ra
      số nhỏ hơn. Kết quả phép chia làm tròn LÊN.
    see_also: [BAK-01, BAK-07]
    message_template: >
      Khai {so_driver_khai} driver / {so_duong_ket_noi_khai} đường kết nối, chưa đủ so
      với nhu cầu {dung_luong_giay_mbs} MB/s và mức tối thiểu 02.

  - id: BAK-06
    name: "Mỗi tập dữ liệu phải nằm trên ít nhất 02 băng từ khác nhau"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R74]
    checklist_ref: [CL-3.2.19]
    severity: critical
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    check: "so_ban >= tape_so_ban_toi_thieu"
    inputs:
      - {name: so_ban, unit: bản, required: true}
    note: >
      Một bản sao lưu duy nhất thì hỏng băng là mất dữ liệu — đây là lý do quy tắc để
      mức `critical`.
      Quy tắc này cũng là nguồn của hai hằng số dùng lại ở BAK-03/BAK-04:
      `tape_so_ban_toi_thieu` = 2 và `tape_he_so_du_phong` = 1.1.
    see_also: [BAK-03, BAK-04]
    message_template: >
      Chỉ khai {so_ban} bản sao lưu. Guideline yêu cầu mỗi tập dữ liệu nằm trên tối
      thiểu 02 băng từ khác nhau.

  - id: BAK-07
    name: "Dung lượng và tốc độ tape theo thế hệ LTO"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R75]
    checklist_ref: [CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    check: >
      dung_luong_1_tape_gb == dung_luong_chuan_lto
      and toc_do_1_tape_mbs == toc_do_chuan_lto
    inputs:
      - {name: the_he_lto,           unit: "LTO-3 … LTO-9", required: true, role: lookup}
      - {name: dung_luong_1_tape_gb, unit: GB,   required: true}
      - {name: toc_do_1_tape_mbs,    unit: MB/s, required: true}
      - {name: dung_luong_chuan_lto, unit: GB,   required: true}
      - {name: toc_do_chuan_lto,     unit: MB/s, required: true}
    note: >
      Bảng tra (capacity / tốc độ): LTO-3 400 GB / 80 · LTO-4 800 GB / 120 ·
      LTO-5 1500 GB / 140 · LTO-6 2500 GB / 160 · LTO-7 6 TB / 300 ·
      LTO-8 12 TB / 360 · LTO-9 18 TB / 400.
      Đây là dung lượng NÉN hay chưa nén tùy công bố của hãng — Guideline không nói rõ.
      Nếu tài liệu khai dung lượng nén (thường gấp 2–2,5 lần) thì C4 sẽ báo lệch; câu
      finding phải đề nghị làm rõ, không khẳng định sai ngay.
      Thiếu `the_he_lto` thì không tra được -> finding "thiếu thông tin" (NT4).
    see_also: [BAK-03, BAK-04, BAK-05]
    message_template: >
      Tape {the_he_lto} khai {dung_luong_1_tape_gb} GB / {toc_do_1_tape_mbs} MB/s, khác
      bảng chuẩn của Guideline ({dung_luong_chuan_lto} GB / {toc_do_chuan_lto} MB/s).

  - id: BAK-08
    name: "Số cleaning tape bằng số đầu đọc"
    type: quantitative
    applies_to_equipment: [sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R76]
    checklist_ref: [CL-3.2.19]
    severity: minor
    source_doc: "TL-DINH-CO, mục 6 Định cỡ thiết bị sao lưu, trang 31"
    formula: "so_dau_doc"
    inputs:
      - {name: so_dau_doc, unit: đầu đọc, required: true}
    compare_with: so_cleaning_tape_khai
    tolerance: 0
    note: >
      Tỷ lệ 1:1. Đây là hạng mục nhỏ nhưng hay bị quên hẳn trong bảng đề xuất — thiếu
      cleaning tape thì đầu đọc xuống cấp nhanh.
    see_also: [BAK-05]
    message_template: >
      Số cleaning tape khai {declared}, cần bằng số đầu đọc là {expected}.

  - id: BAK-09
    name: "Phải có giải pháp sao lưu và cộng thêm năng lực cho tác vụ sao lưu"
    type: qualitative
    applies_to_equipment: [may_chu, sao_luu]
    scope: phan_he
    round: 2
    legacy_ref: [R107]
    checklist_ref: [CL-3.x.19, CL-3.2.19]
    severity: major
    source_doc: "TL-DINH-CO, mục 4b Tính toán tài nguyên từng thành phần, trang 20"
    applies_when: "phan_he_co_du_lieu_can_sao_luu"
    inputs:
      - {name: phan_he_co_du_lieu_can_sao_luu, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi cả hai: (1) tài liệu CÓ PHẦN GIẢI PHÁP SAO LƯU PHỤC HỒI — nêu được đối
      tượng sao lưu, chu kỳ, nơi lưu bản sao (thiết bị/hệ thống khác), và cách phục hồi;
      (2) cấu hình máy chủ đề xuất CÓ TÍNH THÊM phần tài nguyên cho tác vụ sao lưu —
      nêu rõ phần cộng thêm là bao nhiêu (CPU/RAM/IOPS/băng thông trong cửa sổ backup),
      HOẶC nêu giải pháp sao lưu không tiêu tốn tài nguyên máy chủ (ví dụ snapshot ở
      tầng lưu trữ) và giải thích vì sao.
      KHÔNG ĐẠT khi: không có phần sao lưu nào trong tài liệu; có nêu sao lưu nhưng cấu
      hình máy chủ KHÔNG cộng thêm gì và cũng không giải thích vì sao không cần; hoặc
      chỉ nói "sử dụng hệ thống backup tập trung của Tập đoàn" mà không cho biết tác vụ
      sao lưu chiếm bao nhiêu tài nguyên của máy chủ nguồn.
      KHÔNG ÁP DỤNG khi phân hệ không lưu trạng thái và tài liệu nêu rõ không cần sao
      lưu (ví dụ node stateless thuần tính toán).
    examples:
      pass:
        - "Sao lưu: full CSDL hằng tuần + incremental hằng ngày, ghi sang thiết bị lưu
           trữ backup riêng, giữ 30 ngày. Cửa sổ backup 01:00–03:00. Tác vụ backup
           chiếm thêm ~4 vCPU và ~180 MB/s I/O trên mỗi node DB → cấu hình đề xuất đã
           cộng thêm 4 vCPU/node so với nhu cầu tải nghiệp vụ."
      fail:
        - "Dữ liệu được sao lưu hằng ngày sang hệ thống backup tập trung của Tập đoàn."
    see_also: [BAK-01, BAK-02, STO-06]
    note: >
      PHÂN VAI VỚI BAK-01 (R39): BAK-01 là định lượng, kiểm THỜI GIAN hoàn thành backup
      có đáp ứng yêu cầu không. BAK-09 kiểm phần CỘNG THÊM TÀI NGUYÊN vào cấu hình máy
      chủ. Hai việc khác nhau, đừng gộp; khi cả hai cùng trượt thì C7 gom một khối.

  - id: BAK-10
    name: "MariaDB: dung lượng backup = dữ liệu × số bản × tỷ lệ nén"
    type: quantitative
    applies_to_equipment: [sao_luu, luu_tru]
    applies_to_module: [mariadb]
    scope: phan_he
    round: 2
    legacy_ref: [MDB-05]
    code_ref: "frontend/script.js:14556"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:14556)"
    formula: "dung_luong_data_gb * so_ban_backup * ty_le_nen"
    inputs:
      - {name: dung_luong_data_gb, unit: GB,     required: true}
      - {name: so_ban_backup,      unit: bản,    required: true}
      - {name: ty_le_nen,          unit: "tỷ lệ", required: true}
    compare_with: dung_luong_backup_khai_gb
    tolerance: 0.02
    note: >
      Guideline có công thức sao lưu riêng ở BAK-02 (R70) theo full + incremental; quy
      ước nội bộ này đơn giản hơn (nhân số bản với tỷ lệ nén). Hai cách cho kết quả
      khác nhau — khi cả hai cùng áp được, ưu tiên BAK-02 vì có nguồn Guideline, và
      BAK-10 chỉ để đối chiếu với con số web app đang xuất ra.
      `dung_luong_data_gb` là dung lượng phân vùng /data sau khi qua KPI-13.
    see_also: [BAK-02, BAK-11, STO-18]
    message_template: >
      Dung lượng backup khai {declared} GB, tính lại theo quy ước nội bộ
      ({dung_luong_data_gb} × {so_ban_backup} bản × nén {ty_le_nen}) được {expected} GB.

  - id: BAK-11
    name: "MariaDB: dung lượng NAS bằng dung lượng backup"
    type: quantitative
    applies_to_equipment: [sao_luu, luu_tru]
    applies_to_module: [mariadb]
    scope: phan_he
    round: 2
    legacy_ref: [MDB-06]
    code_ref: "frontend/script.js:14559"
    severity: minor
    confidence_floor: high
    source_doc: "Quy ước nội bộ — chưa có văn bản (frontend/script.js:14559)"
    formula: "dung_luong_backup_khai_gb"
    inputs:
      - {name: dung_luong_backup_khai_gb, unit: GB, required: true}
    compare_with: dung_luong_nas_khai_gb
    tolerance: 0
    note: >
      Quan hệ 1:1 giữa dung lượng NAS và dung lượng backup theo cách web app tính.
      LƯU Ý quy ước này KHÔNG tính chỗ trống để RESTORE, trong khi STO-06 (R58) yêu cầu
      cộng thêm. Nếu dùng đúng Guideline thì NAS phải lớn hơn dung lượng backup —
      đây là điểm lệch nên nêu khi có văn bản nội bộ để đối chiếu.
    see_also: [BAK-10, STO-06]
    message_template: >
      Dung lượng NAS khai {declared} GB, theo quy ước nội bộ phải bằng dung lượng
      backup {expected} GB.

  # ===========================================================================
  # NHÓM PRC — thủ tục và quy trình
  # PRC-01..06 Guideline · PRC-07..10 checklist
  #
  # PRC-01, PRC-02, PRC-03, PRC-05, PRC-06 thuộc NHÓM KIỂM B: Copilot chỉ xác nhận
  # tài liệu CÓ NÊU / CÓ DẪN CHIẾU, KHÔNG xác minh được văn bản có thật hay chữ ký
  # hợp lệ. Câu finding BẮT BUỘC nói rõ giới hạn này — không nói thì người dùng hiểu
  # nhầm là đã qua thẩm định.
  # ===========================================================================

  - id: PRC-01
    name: "Thông số đầu vào phải được lãnh đạo xác nhận bằng văn bản"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R30]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, bảng quy trình định cỡ bước 1, trang 13"
    criteria: >
      ĐẠT khi một trong hai: (1) tài liệu DẪN CHIẾU CỤ THỂ văn bản xác nhận thông số
      đầu vào — nêu được SỐ HIỆU / NGÀY / NGƯỜI KÝ hoặc CHỨC DANH người ký; (2) tài
      liệu ĐÍNH KÈM văn bản đó và có nhắc tới trong phần sở cứ.
      Nếu yêu cầu đến từ đơn vị kinh doanh: phải có THÊM xác nhận của đơn vị/bộ phận
      liên quan, không chỉ lãnh đạo đơn vị chủ trì sản phẩm.
      KHÔNG ĐẠT khi: không nhắc gì tới việc thông số đầu vào đã được xác nhận; chỉ nói
      chung chung "đã được lãnh đạo phê duyệt" mà không có số hiệu, ngày hoặc chức danh
      người ký (không đủ để người thẩm định truy được văn bản); hoặc nguồn thông số đầu
      vào ghi là "theo ước tính của nhóm dự án" mà không có xác nhận.
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu: Copilot chỉ kiểm được tài liệu CÓ NÊU
      hoặc DẪN CHIẾU văn bản xác nhận hay không; KHÔNG xác minh được văn bản có thật,
      chữ ký có hợp lệ, người ký có đúng thẩm quyền.
    examples:
      pass:
        - "Thông số đầu vào (dự kiến 50.000 CCU giờ cao điểm) được lãnh đạo Trung tâm
           Sản phẩm xác nhận tại văn bản số 214/XN-TTSP ngày 03/6/2026 (đính kèm Phụ
           lục 3)."
      fail:
        - "Thông số đầu vào 50.000 CCU do nhóm dự án ước tính dựa trên kinh nghiệm
           triển khai các hệ thống tương tự, đã được lãnh đạo thống nhất."
    see_also: [PRC-02, EVD-09]

  - id: PRC-02
    name: "Biên bản kiểm thử hiệu năng phải được xác nhận bằng văn bản"
    type: qualitative
    applies_to_equipment: [tat_ca]
    scope: he_thong
    round: 2
    legacy_ref: [R31]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, bảng quy trình định cỡ bước 1, trang 13"
    applies_when: "co_dung_so_lieu_kiem_thu"
    inputs:
      - {name: co_dung_so_lieu_kiem_thu, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi: dẫn chiếu được biên bản kiểm thử với SỐ HIỆU / NGÀY / NGƯỜI KÝ hoặc CHỨC
      DANH, hoặc đính kèm biên bản và nhắc tới trong phần sở cứ.
      KHÔNG ĐẠT khi: trình bày kết quả kiểm thử nhưng không nhắc tới biên bản nào; hoặc
      chỉ nói "đã kiểm thử và được lãnh đạo thông qua" mà không có số hiệu, ngày,
      người ký.
      PHẠM VI: bản sizing có dùng SỐ LIỆU KIỂM THỬ HIỆU NĂNG làm cơ sở — tức Dạng II,
      và Dạng I khi đã kiểm thử. KHÔNG áp dụng khi bản sizing hoàn toàn dựa trên hệ
      tham chiếu đang vận hành (Dạng III thuần), không dùng số liệu kiểm thử nào.
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu: chỉ kiểm được tài liệu CÓ DẪN CHIẾU
      biên bản hay không; không xác minh được biên bản có thật, ai ký, ký có đúng
      thẩm quyền.
    examples:
      pass:
        - "Kết quả kiểm thử hiệu năng tại Biên bản số 88/BB-KTHN ngày 20/5/2026, do
           Giám đốc Trung tâm Kiểm thử ký xác nhận (đính kèm Phụ lục 2)."
      fail:
        - "Hệ thống đã được kiểm thử hiệu năng đạt 3.500 TPS và được lãnh đạo thông qua."
    see_also: [PRC-01, TST-01, TST-03, MTH-03]

  - id: PRC-03
    name: "Hệ triển khai trên hạ tầng Tập đoàn phải xin ý kiến thẩm định TCT VTNet"
    type: qualitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 2
    legacy_ref: [R33]
    checklist_ref: [CL-1.1]
    severity: major
    source_doc: "TL-DINH-CO, bảng quy trình định cỡ, trang 14"
    applies_when: "tren_ha_tang_tap_doan"
    inputs:
      - {name: tren_ha_tang_tap_doan, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi: tài liệu nêu rõ ĐÃ GỬI hoặc ĐANG CHỜ ý kiến thẩm định của TCT VTNet, kèm
      mốc thời gian hoặc số công văn nếu có.
      KHÔNG ĐẠT khi: không đề cập gì tới bước thẩm định VTNet trong khi hệ thống rõ ràng
      dùng hạ tầng Tập đoàn.
      KHÔNG ÁP DỤNG khi hệ thống triển khai trên hạ tầng riêng của đơn vị, hoặc phục vụ
      khách hàng ngoài.
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu: chỉ kiểm được tài liệu CÓ NÊU đã/đang
      xin ý kiến hay không.
    examples:
      pass:
        - "Tài liệu định cỡ đã gửi TCT VTNet xin ý kiến thẩm định tại công văn số
           156/CV-TTSP ngày 10/6/2026."
      fail:
        - "Hệ thống triển khai trên Cloud Tập đoàn, đề nghị cấp phát theo cấu hình tại
           mục 5."
    see_also: [PRC-05, PRC-06, ARC-10]

  - id: PRC-04
    name: "Tài liệu định cỡ phải hoàn thiện theo mẫu Phụ lục 01"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 2
    legacy_ref: [R34]
    enabled: false
    severity: major
    source_doc: "TL-DINH-CO, bảng quy trình định cỡ, trang 14"
    criteria: >
      CHƯA VIẾT ĐƯỢC TIÊU CHÍ — Phụ lục 01 (mẫu tài liệu định cỡ) KHÔNG có trong file
      PDF, tài liệu kết thúc ở trang 44/44. Không có mẫu thì không viết được tiêu chí
      "đủ mục" nào cả.
      Khi nhận được Phụ lục 01: liệt kê các đề mục bắt buộc của mẫu, tiêu chí ĐẠT là có
      đủ các đề mục đó theo đúng thứ tự và phân cấp.
    note: >
      `enabled: false` cho tới khi có Phụ lục 01 — bật lên khi chưa có mẫu là vi phạm
      NT2 (không có căn cứ để đối chiếu). Đang chờ ở PLAN.md mục 0.12(g).
      LƯU Ý: mục 1.16 (sinh mẫu Word chuẩn) KHÔNG còn phụ thuộc phụ lục này — đã chuyển
      sang sinh từ 57 mục checklist. Chỉ còn quy tắc này chờ.
    see_also: [EVD-12, EVD-16]

  - id: PRC-05
    name: "Chỉ cấp phát khi có đủ bốn loại hồ sơ"
    type: qualitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 2
    legacy_ref: [R92]
    checklist_ref: [CL-1.1]
    severity: critical
    source_doc: "TL-DINH-CO, mục B.2 Quy định cấp phát, trang 40"
    applies_when: "la_ho_so_xin_cap_phat"
    inputs:
      - {name: la_ho_so_xin_cap_phat, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi dẫn chiếu được đủ BỐN loại hồ sơ: (1) tờ trình đầu tư tài nguyên;
      (2) quy hoạch định cỡ; (3) kết quả kiểm thử hiệu năng; (4) tài liệu định cỡ.
      KHÔNG ĐẠT khi: thiếu bất kỳ loại nào trong bốn; hoặc hệ thống ĐỊNH CỠ THEO DẠNG I
      (chưa có sản phẩm) mà xin cấp phát luôn, không định cỡ lại theo phương pháp đã có
      sản phẩm phần mềm — vi phạm ràng buộc kèm theo của Guideline, mức `critical`.
      KHÔNG ÁP DỤNG khi hồ sơ chỉ xin THẨM ĐỊNH bản định cỡ, chưa xin cấp phát (trùng
      điều kiện của PRC-07).
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu: chỉ kiểm được tài liệu CÓ LIỆT KÊ hoặc
      DẪN CHIẾU bốn loại hồ sơ, không xác minh được chúng có thật.
    examples:
      pass:
        - "Hồ sơ gồm: Tờ trình đầu tư số 45/TTr-TTSP ngày 02/5/2026; Quy hoạch định cỡ
           đã được phê duyệt; Biên bản kiểm thử hiệu năng số 88/BB-KTHN ngày 20/5/2026;
           Tài liệu định cỡ này."
      fail:
        - "Đề nghị cấp phát tài nguyên theo cấu hình tại mục 5 của tài liệu này."
    see_also: [PRC-03, MTH-01, MTH-02, PRC-02]

  - id: PRC-06
    name: "Phương án cấp phát phải được thống nhất với TCT VTNet"
    type: qualitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 2
    legacy_ref: [R109]
    severity: minor
    source_doc: "TL-DINH-CO, mục B.2 Quy định cấp phát, trang 40"
    applies_when: "la_ho_so_xin_cap_phat"
    inputs:
      - {name: la_ho_so_xin_cap_phat, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi một trong hai: (1) tài liệu nêu HÌNH THỨC CẤP PHÁT đã thống nhất (vật lý
      tách biệt / Bare-Metal / VM / container) VÀ dẫn chiếu được việc thống nhất với
      TCT VTNet — nêu buổi làm việc, văn bản, hoặc ý kiến thẩm định đã có; (2) tài liệu
      ghi rõ ĐANG TRONG QUÁ TRÌNH thống nhất với TCT VTNet và nêu phương án đang đề xuất.
      KHÔNG ĐẠT khi: chọn hình thức cấp phát (đặc biệt là Bare-Metal hoặc vật lý tách
      biệt) mà không nhắc gì tới việc trao đổi/thống nhất với TCT VTNet; hoặc không nêu
      hình thức cấp phát nào.
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu: chỉ kiểm được tài liệu CÓ NÊU / DẪN
      CHIẾU việc đã thống nhất; không xác minh được cuộc thống nhất có thật hay biên
      bản có hợp lệ.
    examples:
      pass:
        - "Hình thức cấp phát: VM trên hạ tầng Cloud tập trung, riêng 06 datanode Hadoop
           cấp Bare-Metal. Phương án đã được thống nhất với TCT VTNet tại buổi làm việc
           ngày 12/6/2026 (biên bản kèm Phụ lục 4)."
      fail:
        - "Đề nghị cấp phát 08 máy chủ Bare-Metal cho cụm xử lý dữ liệu."
    see_also: [PRC-03, PRC-05, ARC-10, ARC-11]
    note: >
      `severity: minor` vì là yêu cầu THỦ TỤC và Copilot chỉ kiểm được bề mặt. Câu thông
      báo nên là lời nhắc bổ sung, không phải khẳng định hồ sơ sai.
      `checklist_ref` CỐ Ý ĐỂ TRỐNG — checklist không có mục nào phủ khâu cấp phát. Cùng
      nhóm với EVD-02, ALC-04, ALC-05; xem rules-crossmap.md mục 7.

  - id: PRC-07
    name: "Phải nêu nguồn tài nguyên cấp phát"
    type: qualitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 1
    legacy_ref: [CL-1.1]
    checklist_ref: [CL-1.1]
    severity: major
    source_doc: "CHECKLIST-TD, mục 1.1"
    applies_when: "la_ho_so_xin_cap_phat"
    inputs:
      - {name: la_ho_so_xin_cap_phat, unit: "đúng/sai", required: true}
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: tài liệu nêu
      nguồn tài nguyên dùng để cấp phát.
      KHÔNG ĐẠT khi không có thông tin nào về nguồn tài nguyên cấp phát.
      CHỈ ÁP DỤNG khi hồ sơ là YÊU CẦU CẤP PHÁT; hồ sơ chỉ xin thẩm định bản định cỡ thì
      bỏ qua mục này.
    see_also: [PRC-03, PRC-05, PRC-08]
    note: >
      Ô Ghi chú của chính dòng này trong file Excel BỊ CẮT CỤT giữa chừng — dừng ở
      "…sẽ đánh giá sau khi". Các dòng khác có đủ câu, nên dùng bản đầy đủ ở dòng 6.
      Nên báo đơn vị thẩm định sửa file nguồn.

  - id: PRC-08
    name: "Phải nêu mức độ SR làm căn cứ khối lượng đánh giá"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-1.2]
    checklist_ref: [CL-1.2]
    severity: minor
    enabled: false
    source_doc: "CHECKLIST-TD, mục 1.2"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: tài liệu nêu mức
      độ SR, làm căn cứ xác định khối lượng đánh giá.
      KHÔNG ĐẠT khi không có thông tin nào về mức độ SR.
    note: >
      `enabled: false` — "[CẦN XÁC NHẬN]" mức độ SR thuộc quy trình ITBrain, CHƯA RÕ có
      nằm trong tài liệu sizing hay không. Nếu không thì mục này NGOÀI PHẠM VI Copilot
      (thông tin nằm ở hệ thống ITBrain, không phải file Word).
      Đã gán mã để ổn định; bật lên khi đơn vị thẩm định trả lời.
    see_also: [PRC-07]

  - id: PRC-09
    name: "Phải nêu đầu mối, đơn vị phát triển và đơn vị định cỡ"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.3]
    checklist_ref: [CL-2.3]
    severity: major
    source_doc: "CHECKLIST-TD, mục 2.3"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: tài liệu nêu đầu
      mối liên hệ, đơn vị phát triển phần mềm, và đơn vị thực hiện định cỡ.
      KHÔNG ĐẠT khi không có thông tin nào về các đầu mối này, hoặc chỉ có tiêu đề trống.
    see_also: [PRC-01]
    note: >
      Liên quan PRC-01 (ai xác nhận thông số đầu vào) nhưng KHÁC VIỆC: PRC-09 hỏi ai
      LÀM, PRC-01 hỏi ai XÁC NHẬN. Đừng gộp.

  - id: PRC-10
    name: "Phải nêu thời gian cam kết triển khai và đổ tải"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.10a]
    checklist_ref: [CL-2.10a]
    severity: major
    source_doc: "CHECKLIST-TD, dòng 18 (thiếu số thứ tự trong file gốc)"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: tài liệu nêu thời
      gian cam kết triển khai hệ thống và thời gian bắt đầu đổ tải.
      KHÔNG ĐẠT khi không có mốc thời gian nào cho việc triển khai và đổ tải.
    see_also: [ALC-01, KPI-16]
    note: >
      Dòng 18 của file Excel có nội dung nhưng THIẾU số thứ tự; đã đặt mã tạm
      `CL-2.10a` (checklist-tham-dinh.md mục 8.2). Nên báo đơn vị thẩm định bổ sung.
      Là ĐẦU VÀO cho ALC-01 (R93 — cấp phát đảm bảo 06 tháng): không biết mốc đổ tải
      thì không kiểm được tài nguyên có đủ cho 06 tháng vận hành hay không.

  - id: PRC-11
    name: "Phải nêu mục đích sizing — định cỡ mới hay bổ sung cho hệ đang chạy"
    type: qualitative
    applies_to_equipment: [tai_lieu]
    scope: he_thong
    round: 1
    legacy_ref: [CL-2.1]
    checklist_ref: [CL-2.1]
    severity: major
    source_doc: "CHECKLIST-TD, mục 2.1"
    criteria: >
      TIÊU CHÍ MẶC ĐỊNH VÒNG 1: có thông tin thực chất là ĐẠT. Cụ thể: bảng "Thông tin
      hệ thống" có dòng nêu mục đích sizing, và nêu rõ đây là định cỡ MỚI hay định cỡ
      BỔ SUNG / NÂNG CẤP cho hệ thống, phân hệ đang chạy.
      KHÔNG ĐẠT khi bảng thông tin hệ thống không có dòng mục đích, hoặc chỉ ghi chung
      chung kiểu "phục vụ kinh doanh" mà không cho biết mới hay bổ sung.
    see_also: [MTH-01, MTH-04, PRC-09]
    note: >
      BỔ SUNG 2026-09-03, người dùng duyệt. Trước đây `CL-2.1` bị xếp trạng thái T
      (trùng) và chỉ gắn `checklist_ref` vào nhóm MTH, nên KHÔNG có quy tắc nào kiểm
      được việc tài liệu có nêu mục đích sizing hay không — dò `rules.yaml` cho
      "mục đích sizing" được 0 khớp.
      MTH-01..04 là Vòng 2 về PHƯƠNG PHÁP định cỡ (Dạng I/II/III); PRC-11 là Vòng 1 về
      sự CÓ MẶT của thông tin mục đích. Khác việc, đừng gộp.
      Căn cứ thực tế: 17 nhãn trong eval set từ PNX của nhiều hồ sơ khác nhau, người
      thẩm định lặp lại yêu cầu "Bổ sung mục đích sizing" / "Bổ sung thêm hàng mục đích
      sizing vào bảng (định cỡ mới, định cỡ cho nâng cấp ...)".
      Là ĐẦU VÀO cho MTH-01/MTH-04: không biết mới hay bổ sung thì không chọn được dạng
      định cỡ, và không kiểm được yêu cầu "cấp bổ sung phải tính phần TĂNG THÊM".
      `CL-2.4` (cơ sở định cỡ) vẫn chồng lấn `CL-2.1` — chưa gộp, chờ ý kiến đơn vị.

  # ===========================================================================
  # NHÓM ALC — cấp phát, thu hồi
  # ===========================================================================

  - id: ALC-01
    name: "Cấp phát phải đảm bảo hoạt động 06 tháng và áp hạn ngạch"
    type: quantitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 2
    legacy_ref: [R93]
    checklist_ref: [CL-2.10a]
    code_ref: "frontend/script.js:3843"
    severity: major
    source_doc: "TL-DINH-CO, mục B.2 Quy định cấp phát, trang 40"
    check: "chu_ky_dam_bao_thang >= 6 and co_ap_quota"
    inputs:
      - {name: chu_ky_dam_bao_thang, unit: tháng,      required: true}
      - {name: co_ap_quota,          unit: "đúng/sai", required: true}
    note: >
      "[CHƯA CHẮC] MÂU THUẪN CHƯA GIẢI với KPI-16": web app ghim tăng trưởng 01 NĂM khi
      định cỡ, Guideline quy định cấp phát đảm bảo 06 THÁNG. Có thể là hai mốc phục vụ
      hai việc khác nhau (định cỡ vs cấp phát), cũng có thể là lệch thật — xem
      rules-crossmap.md C-05. Dùng ">=" nên hồ sơ tính cho 12 tháng vẫn ĐẠT quy tắc
      này; KPI-16 đang `enabled: false` nên không sinh cảnh báo ngược chiều.
      Guideline còn yêu cầu theo dõi và điều chỉnh tài nguyên theo KPI sau khi cấp
      phát — phần đó thuộc vận hành, ngoài phạm vi bản sizing.
    see_also: [KPI-16, PRC-10, ALC-02]
    message_template: >
      Tài nguyên cấp phát tính cho {chu_ky_dam_bao_thang} tháng (Guideline yêu cầu tối
      thiểu 06 tháng), áp hạn ngạch: {co_ap_quota}.

  - id: ALC-02
    name: "Overcommit khi cấp phát ảo hóa: CPU tối đa 4, RAM tối đa 1.5"
    type: quantitative
    applies_to_equipment: [cap_phat, may_chu]
    scope: he_thong
    round: 2
    legacy_ref: [R94]
    severity: major
    source_doc: "TL-DINH-CO, mục B.2 Quy định cấp phát, trang 40"
    check: "or_cpu_khai <= overcommit_cpu and or_ram_khai <= 1.5"
    inputs:
      - {name: or_cpu_khai, unit: "hệ số", required: true}
      - {name: or_ram_khai, unit: "hệ số", required: true}
    note: >
      "[CHƯA CHẮC] KHÁC NGỮ CẢNH với RAM-01 (R22)": khâu ĐỊNH CỠ quy định OR_ram = 1,
      khâu CẤP PHÁT cho phép tới 1.5. Hai ngưỡng phục vụ hai giai đoạn khác nhau, nhưng
      cần người thẩm định xác nhận để C4 không so cùng một con số vào cả hai và báo mâu
      thuẫn giả. rules-formulas.md điểm 9.
      Ngưỡng 1.5 để thẳng trong `check` (không đưa vào `globals`) chính vì nó KHÁC
      `overcommit_ram` = 1 của khâu định cỡ — đặt chung một hằng số sẽ gây nhầm.
    see_also: [RAM-01, CPU-04]
    message_template: >
      Tỷ lệ overcommit khi cấp phát khai CPU {or_cpu_khai} / RAM {or_ram_khai}, vượt
      ngưỡng cho phép (CPU tối đa 4, RAM tối đa 1.5).

  - id: ALC-03
    name: "Thu hồi khi CPU dưới 15% hoặc RAM dưới 30% trong kỳ đánh giá"
    type: quantitative
    applies_to_equipment: [cap_phat]
    scope: phan_he
    round: 2
    legacy_ref: [R96]
    severity: minor
    source_doc: "TL-DINH-CO, mục B.3 Thu hồi, trang 41"
    applies_when: "la_ho_so_thu_hoi"
    check: "cpu_95th > 15 or ram_95th > 30"
    inputs:
      - {name: la_ho_so_thu_hoi, unit: "đúng/sai", required: true, role: lookup}
      - {name: cpu_95th,         unit: "%",        required: true}
      - {name: ram_95th,         unit: "%",        required: true}
    note: >
      Guideline quy định TCT VTNet rà soát tối thiểu 06 tháng một lần; máy chủ có CPU
      không quá 15% HOẶC RAM không quá 30% trong thời gian đánh giá thì XEM XÉT thu hồi.
      Đây là quy tắc của khâu VẬN HÀNH, chỉ áp khi bản sizing là hồ sơ thu hồi / tối ưu
      tài nguyên. Với hồ sơ cấp phát mới thì `applies_when` loại ra.
      `severity: minor` vì Guideline nói "xem xét thu hồi", không phải bắt buộc thu hồi.
    see_also: [ALC-04]
    message_template: >
      Máy chủ có CPU {cpu_95th}% / RAM {ram_95th}% trong kỳ đánh giá — thuộc diện xem
      xét thu hồi theo Guideline (CPU không quá 15% hoặc RAM không quá 30%).

  - id: ALC-04
    name: "Thu hồi: ưu tiên giảm số máy chủ trước khi giảm cấu hình"
    type: qualitative
    applies_to_equipment: [cap_phat]
    scope: he_thong
    round: 2
    legacy_ref: [R97]
    severity: minor
    source_doc: "TL-DINH-CO, mục B.3 Thu hồi, trang 41"
    applies_when: "la_ho_so_thu_hoi"
    inputs:
      - {name: la_ho_so_thu_hoi, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi đủ ba: (1) có SO SÁNH HAI PHƯƠNG ÁN — giảm số máy chủ so với giảm cấu
      hình từng máy; (2) với máy chủ ứng dụng chạy ảo hóa, chọn GIẢM SỐ MÁY CHỦ, hoặc
      giải trình vì sao không; (3) với cụm cluster (điển hình là DB), nêu rõ SỐ MÁY TỐI
      THIỂU theo mô hình cụm và không cắt xuống dưới mức đó.
      KHÔNG ĐẠT khi: cắt cấu hình từng máy mà không xét phương án giảm số máy; hoặc cắt
      số node cụm DB xuống dưới mức tối thiểu của mô hình (ví dụ cụm 3 node quorum cắt
      còn 2).
      KHÔNG ÁP DỤNG với hồ sơ xin cấp phát mới hoặc mở rộng — tức PHẦN LỚN bản sizing.
    examples:
      pass:
        - "Hai phương án: (a) giảm từ 08 xuống 04 máy ứng dụng, giữ nguyên 16 vCPU —
           tải lên 36%; (b) giữ 08 máy giảm còn 8 vCPU — cùng mức tải nhưng tốn thêm
           04 license OS. Chọn (a). Cụm MariaDB giữ nguyên 03 node theo yêu cầu quorum."
      fail:
        - "Do tải thấp, đề nghị giảm cấu hình mỗi máy chủ từ 16 vCPU xuống 8 vCPU."
    see_also: [ALC-03, ARC-03, ARC-09]
    note: >
      `checklist_ref` CỐ Ý ĐỂ TRỐNG — checklist chỉ phủ luồng CẤP PHÁT, không phủ luồng
      THU HỒI. Nghĩa là Vòng 1 không bắt được nếu tài liệu thiếu hẳn phần này; chỉ Vòng
      2 bắt được. Với R97 thì điều đó hợp lý.

  - id: ALC-05
    name: "Quy hoạch cấp phát tránh lưu lượng vòng và an toàn khi lỗi phần cứng"
    type: qualitative
    applies_to_equipment: [cap_phat, load_balancer, luu_tru, may_chu]
    scope: he_thong
    round: 2
    legacy_ref: [R108]
    checklist_ref: [CL-2.7, CL-3.x.5]
    severity: major
    source_doc: "TL-DINH-CO, mục B.1 Quan điểm cấp phát, trang 40"
    criteria: >
      Phải đạt CẢ HAI VẾ của trích dẫn.
      VẾ ĐƯỜNG ĐI LƯU LƯỢNG: mô hình vật lý cho thấy vị trí đặt LB và thiết bị lưu trữ
      so với các phân hệ dùng chúng, đủ để thấy lưu lượng không phải đi vòng qua nhiều
      lớp mạng; hoặc tài liệu nêu rõ yêu cầu đặt cùng zone / cùng lớp mạng.
      VẾ AN TOÀN KHI LỖI PHẦN CỨNG: các node ảo hóa dự phòng của cùng một cụm (điển hình
      là cặp DB) được nêu rõ là PHÂN BỔ TRÊN CÁC MÁY CHỦ VẬT LÝ KHÁC NHAU, hoặc nêu yêu
      cầu anti-affinity tương đương khi cấp phát.
      KHÔNG ĐẠT khi: có cặp DB dự phòng nhưng không nói gì về việc đặt trên host vật lý
      khác nhau (vi phạm cùng lúc ARC-07, vốn là quy tắc định lượng); mô hình vật lý
      không thể hiện vị trí LB/lưu trữ so với các phân hệ dùng chúng; hoặc đề xuất cấp
      phát nêu số lượng tài nguyên mà không có yêu cầu quy hoạch vị trí nào.
    examples:
      pass:
        - "Cụm MariaDB gồm 03 node đặt trên 03 host vật lý khác nhau (yêu cầu
           anti-affinity khi cấp phát). LB và thiết bị lưu trữ đặt cùng zone DMZ-App với
           cụm Application, lưu lượng App → LB → DB không đi qua lớp core."
      fail:
        - "Cụm MariaDB gồm 03 VM cấu hình 16 vCPU / 64 GB, cấp phát trên hạ tầng Cloud
           Tập đoàn."
    see_also: [ARC-07, ARC-10, EVD-14, FWL-04]
    note: >
      `checklist_ref` trỏ tới CL-2.7 / CL-3.x.5 (mô hình vật lý) là hai mục GẦN NHẤT —
      checklist không có mục riêng cho khâu cấp phát, nhưng thông tin này thực tế xuất
      hiện ở phần mô hình vật lý. Xem rules-crossmap.md mục 7.

  # ===========================================================================
  # NHÓM SAN — SAN switch
  # ===========================================================================

  - id: SAN-01
    name: "Số port SAN switch = tổng port dịch vụ × hệ số dự phòng"
    type: quantitative
    applies_to_equipment: [san_switch]
    scope: he_thong
    round: 2
    legacy_ref: [R77]
    severity: major
    source_doc: "TL-DINH-CO, mục 7 Định cỡ SAN switch, trang 33"
    formula: "tong_port_dich_vu * port_reserve"
    inputs:
      - {name: tong_port_dich_vu, unit: port, required: true}
    compare_with: so_port_san_khai
    tolerance: 0.02
    note: >
      `port_reserve` = 1.2, cùng hằng số với ARC-01 (R09). Kết quả làm tròn LÊN.
    see_also: [ARC-01, SAN-02]
    message_template: >
      Số port SAN switch khai {declared}, tính lại {tong_port_dich_vu} × 1.2 được
      {expected} port.

  - id: SAN-02
    name: "SAN switch: tối thiểu 02 thiết bị, chọn loại 24 hoặc 48 port"
    type: quantitative
    applies_to_equipment: [san_switch]
    scope: he_thong
    round: 2
    legacy_ref: [R78]
    severity: major
    source_doc: "TL-DINH-CO, mục 7 Định cỡ SAN switch, trang 33"
    check: >
      so_thiet_bi >= 2
      and ((port_active_1_thiet_bi < 24 and loai_switch_port == 24)
      or (port_active_1_thiet_bi >= 24 and port_active_1_thiet_bi <= 48
      and loai_switch_port == 48))
    inputs:
      - {name: so_thiet_bi,            unit: thiết bị, required: true}
      - {name: port_active_1_thiet_bi, unit: port,     required: true}
      - {name: loai_switch_port,       unit: "24 | 48", required: true}
    note: >
      `port_active_1_thiet_bi` = số port cần (SAN-01) chia số thiết bị.
      Sàn 02 thiết bị là yêu cầu dự phòng, trùng tinh thần ARC-04 (R12 — dự phòng 1+1).
      Guideline không nói gì về trường hợp cần trên 48 port; khi đó C4 sinh finding
      "vượt phân cấp Guideline, cần xác nhận" thay vì tự suy ra nhiều switch hơn.
    see_also: [SAN-01, ARC-04]
    message_template: >
      SAN switch khai {so_thiet_bi} thiết bị loại {loai_switch_port} port với
      {port_active_1_thiet_bi} port active mỗi thiết bị — chưa khớp phân cấp 24/48 port
      hoặc chưa đủ 02 thiết bị.

  # ===========================================================================
  # NHÓM LAN — LAN switch
  # ===========================================================================

  - id: LAN-01
    name: "Số port LAN switch = (port dịch vụ + port kiến trúc mạng) × hệ số dự phòng"
    type: quantitative
    applies_to_equipment: [lan_switch]
    scope: he_thong
    round: 2
    legacy_ref: [R79]
    severity: major
    source_doc: "TL-DINH-CO, mục 8 Định cỡ LAN switch, trang 33"
    formula: "(tong_port_dich_vu + port_kien_truc_mang) * port_reserve"
    inputs:
      - {name: tong_port_dich_vu,     unit: port, required: true}
      - {name: port_kien_truc_mang,   unit: port, required: true}
    compare_with: so_port_lan_khai
    tolerance: 0.02
    note: >
      Khác SAN-01 ở số hạng `port_kien_truc_mang` — port phục vụ chính kiến trúc mạng
      (uplink, stack, quản trị), không thuộc dịch vụ nào. Bỏ số hạng này là nguyên nhân
      phổ biến làm thiếu port.
      Phân cấp thiết bị: dưới 24 port dùng switch 24; từ 24 đến 48 dùng switch 48 hoặc
      stack 2×24.
    see_also: [ARC-01, LAN-02, LAN-03]
    message_template: >
      Số port LAN switch khai {declared}, tính lại ({tong_port_dich_vu} +
      {port_kien_truc_mang}) × 1.2 được {expected} port.

  - id: LAN-02
    name: "Chọn bandwidth port LAN theo lưu lượng trung bình mỗi port"
    type: quantitative
    applies_to_equipment: [lan_switch]
    scope: he_thong
    round: 2
    legacy_ref: [R80]
    severity: major
    source_doc: "TL-DINH-CO, mục 8 Định cỡ LAN switch, trang 33"
    check: "bandwidth_port_mbps >= bandwidth_toi_thieu_theo_luu_luong"
    inputs:
      - {name: luu_luong_port_tb_mbps,           unit: Mbps, required: true, role: lookup}
      - {name: bandwidth_port_mbps,              unit: Mbps, required: true}
      - {name: bandwidth_toi_thieu_theo_luu_luong, unit: Mbps, required: true}
    note: >
      Lưu lượng port trung bình = tổng lưu lượng dịch vụ chia số port dịch vụ.
      Phân cấp: dưới 100 Mbps chọn port 100M (Guideline khuyến nghị ƯU TIÊN 1000M nếu
      còn khả năng mở rộng); 100–1000 chọn 1000M; 1000 Mbps–10G chọn 10G khi không ghép
      port. C4 tra `bandwidth_toi_thieu_theo_luu_luong` từ bảng phân cấp này.
      Dùng ">=" vì chọn bandwidth cao hơn mức tối thiểu là hợp lệ — đúng với khuyến nghị
      ưu tiên 1000M của Guideline.
    see_also: [LAN-01, LAN-03, LAN-04]
    message_template: >
      Lưu lượng trung bình mỗi port {luu_luong_port_tb_mbps} Mbps nhưng chọn port
      {bandwidth_port_mbps} Mbps, dưới mức {bandwidth_toi_thieu_theo_luu_luong} Mbps
      theo phân cấp của Guideline.

  - id: LAN-03
    name: "Thông lượng thiết bị = bandwidth port × số port × 2"
    type: quantitative
    applies_to_equipment: [lan_switch]
    scope: he_thong
    round: 2
    legacy_ref: [R81]
    severity: major
    source_doc: "TL-DINH-CO, mục 8 Định cỡ LAN switch, trang 34"
    formula: "bandwidth_port_mbps * so_port * 2"
    inputs:
      - {name: bandwidth_port_mbps, unit: Mbps, required: true}
      - {name: so_port,             unit: port, required: true}
    compare_with: thong_luong_thiet_bi_khai_mbps
    tolerance: 0.02
    note: >
      Hệ số 2 là do full duplex (gửi và nhận đồng thời). Yêu cầu kèm theo của Guideline:
      throughput thiết bị phải KHÔNG NHỎ HƠN tổng bandwidth các port — công thức trên đã
      bảo đảm điều đó khi tính đúng.
    see_also: [LAN-02, LAN-04]
    message_template: >
      Thông lượng thiết bị khai {declared} Mbps, tính lại {bandwidth_port_mbps} ×
      {so_port} port × 2 được {expected} Mbps.

  - id: LAN-04
    name: "Ghép tối đa 04 port vật lý thành một port logic"
    type: quantitative
    applies_to_equipment: [lan_switch]
    scope: he_thong
    round: 2
    legacy_ref: [R82]
    severity: minor
    source_doc: "TL-DINH-CO, mục 8 Định cỡ LAN switch, trang 34"
    applies_when: "co_ghep_port"
    check: "so_port_ghep <= 4"
    inputs:
      - {name: co_ghep_port, unit: "đúng/sai", required: true, role: lookup}
      - {name: so_port_ghep, unit: port,       required: true}
    note: >
      Ghép port (link aggregation) là cách thay thế khi không muốn nâng lên bandwidth
      cao hơn — xem LAN-02, các phân cấp đều có ghi chú "nếu không ghép port".
    see_also: [LAN-02, LAN-03]
    message_template: >
      Khai ghép {so_port_ghep} port vật lý thành một port logic, vượt giới hạn 04 port
      của Guideline.

  # ===========================================================================
  # NHÓM FWL — firewall
  # FWL-01..03 Guideline · FWL-04 Guideline quy hoạch zone (chờ văn bản)
  # ===========================================================================

  - id: FWL-01
    name: "Số port firewall = (port các zone + port HA) × hệ số dự phòng"
    type: quantitative
    applies_to_equipment: [firewall]
    scope: he_thong
    round: 2
    legacy_ref: [R83]
    checklist_ref: [CL-3.x.12]
    severity: major
    source_doc: "TL-DINH-CO, mục 9 Định cỡ Firewall, trang 35"
    formula: "(tong_port_cac_zone + port_ha) * port_reserve"
    inputs:
      - {name: tong_port_cac_zone, unit: port, required: true}
      - {name: port_ha,            unit: port, required: true}
    compare_with: so_port_firewall_khai
    tolerance: 0.02
    note: >
      "[CHƯA CHẮC]" Guideline KHÔNG ghi tường minh giá trị `Kdph_port` cho firewall —
      đang suy từ ARC-01 (R09, = 1.2). Cần người thẩm định xác nhận;
      rules-formulas.md điểm 3.
      `port_ha` là port dành cho triển khai cặp firewall HA, không thuộc zone nào.
    see_also: [ARC-01, FWL-02, FWL-04]
    message_template: >
      Số port firewall khai {declared}, tính lại ({tong_port_cac_zone} port zone +
      {port_ha} port HA) × 1.2 được {expected} port.

  - id: FWL-02
    name: "Lưu lượng zone và thông lượng thiết bị firewall"
    type: quantitative
    applies_to_equipment: [firewall]
    scope: he_thong
    round: 2
    legacy_ref: [R84]
    checklist_ref: [CL-3.x.12]
    severity: critical
    source_doc: "TL-DINH-CO, mục 9 Định cỡ Firewall, trang 35"
    formula: "(tong_luu_luong_zone_up + tong_luu_luong_zone_down) * port_reserve"
    inputs:
      - {name: tong_luu_luong_zone_up,   unit: bps, required: true}
      - {name: tong_luu_luong_zone_down, unit: bps, required: true}
    compare_with: thong_luong_firewall_khai
    tolerance: 0.02
    note: >
      Chuỗi tính đầy đủ của Guideline: lưu lượng mỗi dịch vụ = số kết nối đồng thời ×
      lưu lượng mỗi kết nối; lưu lượng zone = tổng các dịch vụ trong zone; thông lượng
      thiết bị = tổng lưu lượng zone (cả chiều lên và xuống) × hệ số dự phòng.
      "[CHƯA CHẮC]" `Kdph_thongluong` cũng suy từ ARC-01 (1.2), Guideline không ghi rõ.
      LƯU LƯỢNG MỖI KẾT NỐI tính từ KÍCH THƯỚC BẢN TIN THỰC của ứng dụng (EVD-21 /
      CL-3.x.8), KHÔNG phải gói chuẩn 1518 Byte của FWL-03 — lẫn hai thứ là sai phương
      pháp, xem FWL-03.
    see_also: [ARC-01, FWL-03, EVD-21]
    message_template: >
      Thông lượng firewall khai {declared} bps, tính lại (lên {tong_luu_luong_zone_up} +
      xuống {tong_luu_luong_zone_down}) × 1.2 được {expected} bps.

  - id: FWL-03
    name: "Throughput firewall phải đo theo gói chuẩn 1518 Byte hoặc 512 Byte"
    type: quantitative
    applies_to_equipment: [firewall]
    scope: he_thong
    round: 2
    legacy_ref: [R85]
    checklist_ref: [CL-3.x.12]
    severity: major
    source_doc: "TL-DINH-CO, mục 9 Định cỡ Firewall, trang 35"
    check: "kich_co_goi_do_byte == 1518 or kich_co_goi_do_byte == 512"
    inputs:
      - {name: kich_co_goi_do_byte, unit: Byte, required: true}
    note: >
      ⚠️ PHÂN BIỆT HAI THỨ RẤT DỄ NHẦM, nhầm thì sai kết quả:
      • Gói chuẩn 1518 / 512 Byte (quy tắc này) — dùng để ĐỌC NĂNG LỰC throughput của
        thiết bị firewall trên CTKT. Là hằng số chuẩn của Guideline.
      • "Kích thước bản tin" (EVD-21 / CL-3.x.8) — kích cỡ gói tin THỰC TẾ của ứng dụng
        đang định cỡ, dùng để TÍNH BĂNG THÔNG CẦN (FWL-02). Là số liệu riêng từng dự án.
      Lấy 1518 Byte đi tính nhu cầu băng thông của ứng dụng là SAI PHƯƠNG PHÁP.
      Đã chốt 2026-08-25; xem rules-nguon-khac.md.
    see_also: [FWL-02, EVD-21, FWL-04]
    message_template: >
      Throughput firewall khai đo theo gói {kich_co_goi_do_byte} Byte. Guideline yêu cầu
      đo theo gói chuẩn 1518 Byte (hoặc 512 Byte).

  - id: FWL-04
    name: "Hệ thống có đường ra internet/public phải định cỡ firewall và LB"
    type: quantitative
    applies_to_equipment: [firewall, load_balancer]
    scope: he_thong
    round: 2
    legacy_ref: [ZONE-01]
    checklist_ref: [CL-3.x.9, CL-3.x.10, CL-3.x.11, CL-3.x.12]
    severity: critical
    source_doc: "GL-ZONE, quy tắc lõi — xác nhận trực tiếp 2026-08-25, chờ văn bản"
    applies_when: "co_duong_ra_public"
    check: "co_dinh_co_firewall and co_dinh_co_lb"
    inputs:
      - {name: co_duong_ra_public,   unit: "đúng/sai", required: true, role: lookup}
      - {name: co_dinh_co_firewall,  unit: "đúng/sai", required: true}
      - {name: co_dinh_co_lb,        unit: "đúng/sai", required: true}
    note: >
      ĐIỀU KIỆN KÍCH HOẠT: hệ thống có đường ra internet / public. Suy từ ARC-15 (nguồn
      request), ARC-16 (giao thức, port) và EVD-15 (luồng nghiệp vụ có giao tiếp ngoài).
      Thiếu ba mục đó thì không xác định được `co_duong_ra_public` -> finding "thiếu
      thông tin" (NT4), KHÔNG mặc định là không có.
      Cả hai phần định cỡ phải tính bằng BĂNG THÔNG và KÍCH THƯỚC BẢN TIN, không được
      khai cấu hình suông. Cách tính đã có sẵn: FWL-01, FWL-02, FWL-03 cho firewall;
      LBA-01, LBA-02 cho LB. Quy tắc này chỉ là ĐIỀU KIỆN BẮT BUỘC PHẢI LÀM (Vòng 1 —
      đủ mục), phần đúng số là Vòng 2 của các quy tắc kia.
      PHỤ THUỘC DỮ LIỆU: cần EVD-21 (lưu lượng dữ liệu mỗi request) làm đầu vào; thiếu
      thì không tính được băng thông -> finding "thiếu thông tin", KHÔNG tự lấy 1518
      Byte thay thế.
      NT2: chưa có văn bản Guideline quy hoạch zone; finding hợp lệ vì neo vào
      `computed_evidence`, nhưng bản thân ngưỡng chưa có sở cứ giấy tờ.
    see_also: [ARC-15, ARC-16, EVD-15, EVD-21, FWL-02, LBA-01]
    message_template: >
      Hệ thống có đường ra internet/public nhưng thiếu phần định cỡ bắt buộc (firewall:
      {co_dinh_co_firewall}, cân bằng tải: {co_dinh_co_lb}).

  # ===========================================================================
  # NHÓM LBA — cân bằng tải
  # ===========================================================================

  - id: LBA-01
    name: "Cân bằng tải: số port, CPS lớp 4, TPS lớp 7 và thông lượng"
    type: quantitative
    applies_to_equipment: [load_balancer]
    scope: he_thong
    round: 2
    legacy_ref: [R86]
    checklist_ref: [CL-3.x.11]
    code_ref: "frontend/script.js:13527-13530"
    severity: critical
    source_doc: "TL-DINH-CO, mục 10 Định cỡ thiết bị cân bằng tải, trang 37"
    formula: "tong_luu_luong_dich_vu * port_reserve"
    inputs:
      - {name: tong_luu_luong_dich_vu, unit: bps, required: true}
    compare_with: thong_luong_lb_khai
    tolerance: 0.02
    note: >
      Guideline cho bốn phép tính: số port = tổng port từng dịch vụ; CPS lớp 4 = tổng
      CPS × 1.2; TPS lớp 7 = tổng TPS × Kdph_TPS; thông lượng = tổng lưu lượng dịch vụ
      × 1.2. Quy tắc này số hóa phép THÔNG LƯỢNG vì đó là chỗ web app đang SAI.
      ❌ LỖI ĐANG CHẠY THẬT (rules-crossmap.md C-06): web app KHÔNG áp hệ số 1.2 nào cho
      LB, nên băng thông đang bị tính THIẾU 20%. Quy tắc này số hóa theo Guideline cho
      đúng; việc sửa code là của đội bảo trì web app.
      "[CHƯA CHẮC]" `Kdph_TPS` cho lớp 7 KHÔNG được Guideline cho giá trị. Các Kdph khác
      của LB đều 1.2 nên nghi cũng là 1.2, nhưng KHÔNG BỊA — phần TPS lớp 7 chưa số hóa,
      chờ xác nhận. rules-formulas.md điểm 4.
    see_also: [ARC-01, LBA-02, FWL-04]
    message_template: >
      Thông lượng cân bằng tải khai {declared} bps, tính lại {tong_luu_luong_dich_vu} ×
      1.2 được {expected} bps. Lưu ý hệ số dự phòng 1.2 hay bị bỏ sót.

  - id: LBA-02
    name: "Lưu lượng dịch vụ của cân bằng tải và chọn bandwidth port"
    type: quantitative
    applies_to_equipment: [load_balancer]
    scope: he_thong
    round: 2
    legacy_ref: [R87]
    checklist_ref: [CL-3.x.11]
    severity: major
    source_doc: "TL-DINH-CO, mục 10 Định cỡ thiết bị cân bằng tải, trang 37"
    formula: "cps * luu_luong_1_cps + tps * luu_luong_1_tps"
    inputs:
      - {name: cps,              unit: CPS, required: true}
      - {name: luu_luong_1_cps,  unit: bps, required: true}
      - {name: tps,              unit: TPS, required: true}
      - {name: luu_luong_1_tps,  unit: bps, required: true}
    compare_with: luu_luong_dich_vu_khai
    tolerance: 0.02
    note: >
      Phân cấp chọn port: dưới 1000 Mbps chọn 1000M; từ 1000 Mbps đến 10G chọn 10G khi
      không ghép port. Phần ghép port theo LAN-04 (tối đa 04 port).
      Kết quả là đầu vào của LBA-01 (thông lượng = lưu lượng × 1.2).
    see_also: [LBA-01, LAN-02, LAN-04]
    message_template: >
      Lưu lượng dịch vụ khai {declared} bps, tính lại ({cps} CPS × {luu_luong_1_cps} +
      {tps} TPS × {luu_luong_1_tps}) được {expected} bps.

  # ===========================================================================
  # NHÓM RCK — tủ Rack
  # ===========================================================================

  - id: RCK-01
    name: "Số RU chuẩn theo từng loại thiết bị"
    type: quantitative
    applies_to_equipment: [rack]
    scope: he_thong
    round: 2
    legacy_ref: [R88]
    severity: major
    source_doc: "TL-DINH-CO, mục 11 Định cỡ tủ Rack, trang 38"
    check: "ru_khai == ru_chuan_theo_loai"
    inputs:
      - {name: loai_thiet_bi,       unit: "may_chu | san_switch | luu_tru | sao_luu | lb | firewall | switch", required: true, role: lookup}
      - {name: ru_khai,             unit: RU, required: true}
      - {name: ru_chuan_theo_loai,  unit: RU, required: true}
    note: >
      Bảng RU chuẩn: máy chủ 2U · SAN switch 1U · thiết bị lưu trữ = số tray × 3U ·
      thiết bị sao lưu 8U · load balancer 1U · firewall 1U · switch 1U.
      "[CHƯA CHẮC]" Số RU mỗi tray của thiết bị lưu trữ PHỤ THUỘC HÃNG — Guideline lấy
      3U nhưng chưa có hằng số chung. Cần chốt chuẩn tray khi có danh mục thiết bị;
      rules-formulas.md điểm 11.
    see_also: [RCK-02, RCK-03]
    message_template: >
      Thiết bị loại {loai_thiet_bi} khai {ru_khai} RU, khác chuẩn
      {ru_chuan_theo_loai} RU của Guideline.

  - id: RCK-02
    name: "Số rack = tổng RU chia 38, làm tròn lên"
    type: quantitative
    applies_to_equipment: [rack]
    scope: he_thong
    round: 2
    legacy_ref: [R89]
    severity: major
    source_doc: "TL-DINH-CO, mục 11 Định cỡ tủ Rack, trang 38"
    formula: "ceil(tong_ru / 38)"
    inputs:
      - {name: tong_ru, unit: RU, required: true}
    compare_with: so_rack_khai
    tolerance: 0
    note: >
      Mẫu số là 38 chứ không phải 42: rack tiêu chuẩn 42U nhưng bỏ 2U trên cùng và 2U
      dưới cùng để tạo khoảng đi dây mạng và thao tác. Dùng 42 sẽ ra thiếu rack.
      `tong_ru` cộng từ RCK-01.
    see_also: [RCK-01, RCK-03]
    message_template: >
      Số rack khai {declared}, tính lại {tong_ru} RU / 38 làm tròn lên được {expected}
      rack.

  - id: RCK-03
    name: "Kích thước rack 42U, rộng 600mm, sâu tối thiểu 1000mm, 02 bộ PDU"
    type: quantitative
    applies_to_equipment: [rack]
    scope: he_thong
    round: 2
    legacy_ref: [R90]
    severity: major
    source_doc: "TL-DINH-CO, mục 11 Định cỡ tủ Rack, trang 38"
    check: >
      chieu_cao_u == 42 and chieu_rong_mm == 600
      and chieu_sau_mm >= 1000 and so_bo_pdu >= 2
    inputs:
      - {name: chieu_cao_u,   unit: U,  required: true}
      - {name: chieu_rong_mm, unit: mm, required: true}
      - {name: chieu_sau_mm,  unit: mm, required: true}
      - {name: so_bo_pdu,     unit: bộ, required: true}
    note: >
      "[CHƯA CHẮC] PHẦN CÔNG SUẤT CHƯA SỐ HÓA ĐƯỢC": Guideline còn yêu cầu nếu tổng công
      suất danh định của thiết bị vượt "mức công suất cho phép của rack" thì phải phân
      chia lại số rack — nhưng KHÔNG cho giá trị kW nào. Không có ngưỡng thì không viết
      `check` được, và bịa một con số là vi phạm NT2.
      Cần xác nhận ngưỡng công suất mỗi rack; rules-formulas.md điểm 8. Khi có thì bổ
      sung vào `check` và vào RCK-02 (số rack có thể tăng vì lý do công suất chứ không
      chỉ vì RU).
    see_also: [RCK-01, RCK-02]
    message_template: >
      Rack khai {chieu_cao_u}U / rộng {chieu_rong_mm}mm / sâu {chieu_sau_mm}mm /
      {so_bo_pdu} bộ PDU, chưa đạt chuẩn 42U, 600mm, tối thiểu 1000mm và 02 bộ PDU.

  # ===========================================================================
  # NHÓM TST — kiểm thử hiệu năng
  # ===========================================================================

  - id: TST-01
    name: "Kiểm thử tối thiểu 05 mẫu đầu vào, mỗi mẫu 05 lần"
    type: quantitative
    applies_to_equipment: [kiem_thu]
    scope: he_thong
    round: 2
    legacy_ref: [R41]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, mục 4a Chuẩn bị thông số đầu vào, trang 20"
    applies_when: "co_kiem_thu_hieu_nang"
    check: "so_mau >= 5 and so_lan_moi_mau >= 5"
    inputs:
      - {name: co_kiem_thu_hieu_nang, unit: "đúng/sai", required: true, role: lookup}
      - {name: so_mau,                unit: mẫu,        required: true}
      - {name: so_lan_moi_mau,        unit: lượt,       required: true}
    note: >
      Guideline yêu cầu thêm: các mẫu đầu vào phải TĂNG DẦN, và kiểm thử phải phủ TOÀN
      BỘ NGHIỆP VỤ CHÍNH. Hai ý đó là định tính, do TST-02 và MTH-03 kiểm.
      Là điều kiện nền của MTH-03 (Dạng II) — định cỡ bằng môi trường kiểm thử mà chỉ
      đo một mẫu thì không suy ra được bình quân tài nguyên mỗi giao dịch.
    see_also: [MTH-03, TST-02, PRC-02]
    message_template: >
      Kiểm thử khai {so_mau} mẫu × {so_lan_moi_mau} lần, chưa đạt mức tối thiểu 05 mẫu
      và 05 lần mỗi mẫu của Guideline.

  - id: TST-02
    name: "Nêu công cụ kiểm thử chuẩn theo loại đối tượng đo"
    type: qualitative
    applies_to_equipment: [kiem_thu]
    scope: he_thong
    round: 2
    legacy_ref: [R98]
    checklist_ref: [CL-2.5]
    severity: minor
    source_doc: "TL-DINH-CO, mục C Kiểm thử hiệu năng, trang 42"
    applies_when: "co_kiem_thu_hieu_nang"
    inputs:
      - {name: co_kiem_thu_hieu_nang, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi đủ ba: (1) nêu TÊN CÔNG CỤ đã dùng; (2) công cụ PHÙ HỢP VỚI ĐỐI TƯỢNG ĐO
      — CSDL nguồn mở dùng sysbench hoặc tương đương, ứng dụng dùng công cụ benchmark
      end-to-end như JMeter, ab; (3) nêu CHỈ SỐ ĐO ĐƯỢC đúng loại — CCU, RPS, TPS,
      latency.
      KHÔNG ĐẠT khi: không nêu công cụ; dùng công cụ đo tầng ứng dụng để kết luận năng
      lực CSDL hoặc ngược lại; hoặc nêu công cụ nhưng không có chỉ số đo nào kèm theo.
      KHÔNG ÁP DỤNG khi không có kiểm thử (Dạng I chưa hoàn thiện sản phẩm).
    examples:
      pass:
        - "CSDL MariaDB đo bằng sysbench (OLTP read-write, 5 triệu bản ghi): 12.400 TPS.
           Ứng dụng đo end-to-end bằng JMeter: 3.500 RPS, latency P95 = 240 ms."
      fail:
        - "Đã thực hiện kiểm thử hiệu năng, hệ thống đáp ứng yêu cầu đề ra."
    see_also: [TST-01, TST-03, MTH-03]
    note: >
      Guideline dùng chữ "CÓ THỂ SỬ DỤNG" nên công cụ khác vẫn chấp nhận được, miễn phù
      hợp đối tượng và có nêu rõ. Vì vậy `severity: minor` và tiêu chí KHÔNG ép đúng tên
      công cụ trong danh sách.

  - id: TST-03
    name: "Thống nhất công cụ đo với đơn vị định cỡ và lưu vết kết quả"
    type: qualitative
    applies_to_equipment: [kiem_thu]
    scope: he_thong
    round: 2
    legacy_ref: [R99]
    checklist_ref: [CL-2.5]
    severity: major
    source_doc: "TL-DINH-CO, mục C Kiểm thử hiệu năng, trang 43"
    applies_when: "co_kiem_thu_hieu_nang"
    inputs:
      - {name: co_kiem_thu_hieu_nang, unit: "đúng/sai", required: true}
    criteria: >
      ĐẠT khi cả hai: (1) nêu TÊN CÔNG CỤ dùng để đo và nói rõ ĐÃ THỐNG NHẤT với đơn vị
      quy hoạch định cỡ / triển khai; (2) nêu NƠI LƯU VẾT công thức, kịch bản kiểm thử
      và kết quả — để lần nâng cấp sau đo lại theo đúng cách.
      KHÔNG ĐẠT khi: nêu kết quả đo nhưng không nói dùng công cụ gì; nêu công cụ nhưng
      không nói đã thống nhất với ai (lần mở rộng sau đo bằng công cụ khác sẽ không so
      sánh được); hoặc không nói gì về việc lưu vết.
      GIỚI HẠN KIỂM — câu finding BẮT BUỘC nêu: chỉ kiểm được tài liệu CÓ NÊU công cụ
      đã thống nhất và nơi lưu vết; không xác minh được việc thống nhất có thật hay chữ
      ký có hợp lệ.
    examples:
      pass:
        - "Công cụ đo JMeter phiên bản 5.6, thống nhất với TCT VTNet tại biên bản họp
           ngày 12/5/2026. Kịch bản, công thức tính và kết quả lưu tại kho tài liệu dự
           án (mã DA-2026-114), có ký xác nhận của hai bên."
      fail:
        - "Kết quả kiểm thử: 3.500 RPS, latency P95 240 ms."
    see_also: [TST-01, TST-02, PRC-02]
    note: >
      Lý do Guideline yêu cầu: không có công cụ đo duy nhất cho mọi hệ, nên phải thống
      nhất TRƯỚC để lần nâng cấp sau đo lại cùng cách mà so sánh được. Đây là quy tắc
      phục vụ VÒNG ĐỜI hệ thống, không chỉ lần định cỡ này.
