services:
  backend:
    container_name: sizing-backend
    build:
      context: ./backend1
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081 2>&1 | grep -q '.' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-net

  nginx:
    container_name: sizing-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "9000:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-net

  # --------------------------------------------------------------- Copilot --
  # AI tự kiểm bản định cỡ. Hai dịch vụ dùng CHUNG một image, khác nhau ở
  # `command`: `copilot` chạy API, `copilot-ui` chạy giao diện nộp bài.
  #
  # Giao diện KHÔNG tự chạy pipeline (mục B3, 2026-09-09): một tài liệu tốn ~16
  # phút, giữ kết nối chừng ấy thì proxy cắt rồi người dùng bấm lại — nhân đôi
  # tải lên đúng cái cổng vốn đã là nút thắt. Nó nộp cho API rồi tra bằng MÃ
  # VIỆC, nên đóng tab không mất kết quả.
  copilot:
    container_name: sizing-copilot
    build:
      context: .
      dockerfile: Dockerfile.copilot
      args:
        # `uv` lúc BUILD đi qua proxy công ty (registry bị chặn trực tiếp).
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        # Đóng dấu phiên bản:  $env:COMMIT = git rev-parse --short HEAD
        - COMMIT=${COMMIT:-unknown}
    image: sizing-copilot:dev
    ports:
      - "8902:8000"
    volumes:
      # ⚠️ TẠO FILE NÀY TRƯỚC khi `up`. Bind-mount một file chưa tồn tại thì
      # Docker tạo một THƯ MỤC trùng tên, và lỗi sau đó rất khó đoán.
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      # Trạng thái công việc (3.2) và đệm lời gọi model (2.12) nằm ở
      # `/app/.cache`, KHÔNG phải `/app/data` — bản 2026-09-11 gắn nhầm chỗ nên
      # việc đang chạy mất sạch mỗi lần container khởi động lại.
      - copilot-cache:/app/.cache
    # Nạp TOÀN BỘ .env vào container: khoá model, proxy (chỉ tác dụng lúc chạy
    # nếu code đọc chúng), v.v. — để Docker Desktop nút Run dùng được ngay mà
    # không cần điền từng biến tay. `environment` bên dưới GHỐP ĐÈ lên env_file
    # nên ràng buộc "khoá qua biến môi trường" vẫn giữ nguyên.
    env_file:
      - .env
    environment:
      - SIZING_COPILOT_API_KEY=${SIZING_COPILOT_API_KEY}
      # CSDL Giai đoạn 5. TRỐNG = Copilot chạy như trước, không cần CSDL.
      # Bật: postgresql+psycopg://copilot:<mật khẩu>@copilot-db:5432/copilot
      - SIZING_COPILOT_DB_URL=${SIZING_COPILOT_DB_URL:-}
      # ⚠️ GỠ HẲN proxy lúc CHẠY. `env_file: .env` nạp HTTP_PROXY/HTTPS_PROXY
      # vào container — hai biến ấy chỉ cần lúc BUILD để `uv` kéo gói, còn lúc
      # chạy thì chúng đẩy mọi lời gọi model qua Squid của công ty.
      #
      # Hỏng thật 2026-09-16: 43/43 lượt gọi C3 và 16/16 lượt C5 đều trả về
      # TRANG HTML LỖI CỦA SQUID thay vì JSON, `truong_co_gia_tri` bằng 0, mà
      # việc vẫn báo "xong" với 61 finding. Trông như một bản thẩm định.
      #
      # `NO_PROXY` KHÔNG cứu được: bản cũ ghi `10.*`, mà httpx (thư viện dưới
      # `openai` SDK) khớp no_proxy theo hậu tố tên miền hoặc địa chỉ IP, không
      # theo ký tự đại diện — `10.*` không bao giờ khớp `10.221.58.70`. Đặt
      # rỗng bốn biến là cách duy nhất chắc chắn, vì `environment` đè `env_file`.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,copilot
    deploy:
      resources:
        limits:
          # C3/C5 chạy 12 luồng song song, mỗi luồng giữ ngữ cảnh tài liệu.
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - app-net

  copilot-ui:
    container_name: sizing-copilot-ui
    image: sizing-copilot:dev
    depends_on:
      copilot:
        condition: service_healthy
    ports:
      - "8903:8501"
    env_file:
      - .env
    environment:
      # `copilot` là tên dịch vụ trong mạng của compose. Mặc định của giao diện
      # là `http://localhost:8000`, tức BÊN TRONG chính container giao diện —
      # không có gì ở đó. `environment` ĐÈ lên giá trị SIZING_COPILOT_API đọc
      # từ .env, nên trong mạng compose luôn dùng đúng địa chỉ này.
      - SIZING_COPILOT_API=http://copilot:8000
      # ⚠️ CỐ Ý KHÔNG có `SIZING_COPILOT_API_KEY` ở `environment`. Giao diện nộp
      # bài cho API chứ không gọi model (mục B3), nên khoá chỉ đặt ở dịch vụ
      # `copilot`. Thanh bên lấy trạng thái model TỪ `/health` của API — trước
      # 2026-09-14 nó tự dựng client tại chỗ, thiếu khoá là giấu luôn chế độ
      # «Thẩm định đầy đủ». LƯU Ý: `env_file` phía trên vẫn nạp khoá vào container
      # (để nút Run của Docker Desktop dùng được ngay) nhưng code giao diện KHÔNG
      # đọc biến đó — nó chỉ gọi API.
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    # Ghi đè HEALTHCHECK của image (trỏ 8000 — cổng của dịch vụ API): trong
    # container GIAO DIỆN, Streamlit chạy ở 8501 nên trước đây luôn "unhealthy"
    # dù ứng dụng chạy bình thường. Endpoint `_stcore/health` là health check
    # chính thức của Streamlit.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always
    networks:
      - app-net

  # ------------------------------------------------------------ CSDL GĐ 5 --
  # PostgreSQL CHỈ cho Copilot (5.0). KHÔNG dùng chung CSDL của tool sizing
  # đang chạy — code đang phát triển không được ghi vào CSDL đang vận hành.
  #
  # Ba quyết định để một lần `git pull` KHÔNG làm thay đổi gì trên máy nội bộ:
  #
  # 1. KHÔNG mở cổng ra máy chủ (không có `ports:`). Copilot nói chuyện với nó
  #    qua mạng compose ở `copilot-db:5432`. Mở cổng là thêm một chỗ có thể trùng
  #    với PostgreSQL sẵn có trên máy (backend Spring dùng một CSDL), và thêm một
  #    CSDL lộ ra mạng. Xem dữ liệu: `docker compose exec copilot-db psql -U copilot`.
  # 2. `copilot` KHÔNG `depends_on` dịch vụ này. Chưa bật CSDL thì Copilot chạy
  #    y như trước; `docker compose up -d copilot copilot-ui` không kéo image
  #    postgres, không khởi động thêm gì.
  # 3. Mật khẩu KHÔNG có giá trị mặc định và KHÔNG dùng `:?`. `:?` làm MỌI lệnh
  #    compose hỏng khi thiếu biến — kể cả lệnh chỉ động tới `copilot`.
  #    Thiếu mật khẩu thì chỉ riêng service này từ chối khởi động.
  copilot-db:
    container_name: sizing-copilot-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${SIZING_COPILOT_DB_NAME:-copilot}
      - POSTGRES_USER=${SIZING_COPILOT_DB_USER:-copilot}
      - POSTGRES_PASSWORD=${SIZING_COPILOT_DB_PASSWORD:-}
    volumes:
      - copilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    networks:
      - app-net

volumes:
  copilot-cache:
  copilot-db-data:

networks:
  app-net:
