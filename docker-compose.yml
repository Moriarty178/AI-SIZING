services:
  backend:
    container_name: sizing-backend
    build:
      context: ./backend1
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081 2>&1 | grep -q '.' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-net

  nginx:
    container_name: sizing-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "9000:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-net

  copilot:
    container_name: sizing-copilot
    build:
      context: .
      dockerfile: Dockerfile.copilot
    ports:
      - "8902:8000"
    # settings.yaml không commit (gitignore) — mount qua volume; API key qua env.
    # Gateway nội bộ 10.221.58.70:8401 phải với tới được từ mạng của server.
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      - copilot-data:/app/data
    environment:
      - SIZING_COPILOT_API_KEY=${SIZING_COPILOT_API_KEY}
    deploy:
      resources:
        limits:
          memory: 4G        # C3 song song 6-8 luồng giữ nhiều ngữ cảnh tài liệu
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - app-net

volumes:
  copilot-data:

networks:
  app-net: