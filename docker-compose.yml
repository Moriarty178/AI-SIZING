services:
  backend:
    container_name: sizing-backend
    build:
      context: ./backend1
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081 2>&1 | grep -q '.' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-net

  nginx:
    container_name: sizing-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "9000:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-net

  # --------------------------------------------------------------- Copilot --
  # AI tự kiểm bản định cỡ. Hai dịch vụ dùng CHUNG một image, khác nhau ở
  # `command`: `copilot` chạy API, `copilot-ui` chạy giao diện nộp bài.
  #
  # Giao diện KHÔNG tự chạy pipeline (mục B3, 2026-09-09): một tài liệu tốn ~16
  # phút, giữ kết nối chừng ấy thì proxy cắt rồi người dùng bấm lại — nhân đôi
  # tải lên đúng cái cổng vốn đã là nút thắt. Nó nộp cho API rồi tra bằng MÃ
  # VIỆC, nên đóng tab không mất kết quả.
  copilot:
    container_name: sizing-copilot
    build:
      context: .
      dockerfile: Dockerfile.copilot
      args:
        # `uv` lúc BUILD đi qua proxy công ty (registry bị chặn trực tiếp).
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        # Đóng dấu phiên bản:  $env:COMMIT = git rev-parse --short HEAD
        - COMMIT=${COMMIT:-unknown}
    image: sizing-copilot:dev
    ports:
      - "8902:8000"
    volumes:
      # ⚠️ TẠO FILE NÀY TRƯỚC khi `up`. Bind-mount một file chưa tồn tại thì
      # Docker tạo một THƯ MỤC trùng tên, và lỗi sau đó rất khó đoán.
      - ./config/settings.yaml:/app/config/settings.yaml:ro
      # Trạng thái công việc (3.2) và đệm lời gọi model (2.12) nằm ở
      # `/app/.cache`, KHÔNG phải `/app/data` — bản 2026-09-11 gắn nhầm chỗ nên
      # việc đang chạy mất sạch mỗi lần container khởi động lại.
      - copilot-cache:/app/.cache
    # Nạp TOÀN BỘ .env vào container: khoá model, proxy (chỉ tác dụng lúc chạy
    # nếu code đọc chúng), v.v. — để Docker Desktop nút Run dùng được ngay mà
    # không cần điền từng biến tay. `environment` bên dưới GHỐP ĐÈ lên env_file
    # nên ràng buộc "khoá qua biến môi trường" vẫn giữ nguyên.
    env_file:
      - .env
    environment:
      - SIZING_COPILOT_API_KEY=${SIZING_COPILOT_API_KEY}
      # Proxy từ .env chỉ để BUILD uv kéo gói. Lúc CHẠY, gateway model là địa
      # chỉ nội bộ (10.221.58.70) — không được đi qua proxy công ty.
      - NO_PROXY=localhost,127.0.0.1,10.*,192.168.*,172.16.*,copilot
    deploy:
      resources:
        limits:
          # C3/C5 chạy 12 luồng song song, mỗi luồng giữ ngữ cảnh tài liệu.
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - app-net

  copilot-ui:
    container_name: sizing-copilot-ui
    image: sizing-copilot:dev
    depends_on:
      copilot:
        condition: service_healthy
    ports:
      - "8903:8501"
    env_file:
      - .env
    environment:
      # `copilot` là tên dịch vụ trong mạng của compose. Mặc định của giao diện
      # là `http://localhost:8000`, tức BÊN TRONG chính container giao diện —
      # không có gì ở đó. `environment` ĐÈ lên giá trị SIZING_COPILOT_API đọc
      # từ .env, nên trong mạng compose luôn dùng đúng địa chỉ này.
      - SIZING_COPILOT_API=http://copilot:8000
      # ⚠️ CỐ Ý KHÔNG có `SIZING_COPILOT_API_KEY` ở `environment`. Giao diện nộp
      # bài cho API chứ không gọi model (mục B3), nên khoá chỉ đặt ở dịch vụ
      # `copilot`. Thanh bên lấy trạng thái model TỪ `/health` của API — trước
      # 2026-09-14 nó tự dựng client tại chỗ, thiếu khoá là giấu luôn chế độ
      # «Thẩm định đầy đủ». LƯU Ý: `env_file` phía trên vẫn nạp khoá vào container
      # (để nút Run của Docker Desktop dùng được ngay) nhưng code giao diện KHÔNG
      # đọc biến đó — nó chỉ gọi API.
    volumes:
      - ./config/settings.yaml:/app/config/settings.yaml:ro
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    # Ghi đè HEALTHCHECK của image (trỏ 8000 — cổng của dịch vụ API): trong
    # container GIAO DIỆN, Streamlit chạy ở 8501 nên trước đây luôn "unhealthy"
    # dù ứng dụng chạy bình thường. Endpoint `_stcore/health` là health check
    # chính thức của Streamlit.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=4)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always
    networks:
      - app-net

volumes:
  copilot-cache:

networks:
  app-net:
