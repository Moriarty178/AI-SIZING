services:
  backend:
    container_name: sizing-backend
    build:
      context: ./backend1
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081 2>&1 | grep -q '.' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-net

  nginx:
    container_name: sizing-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "9000:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-net

networks:
  app-net: