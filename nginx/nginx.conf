server {
    listen 8080;

    # Increase max body size for direct uploads to nginx (though our uploads go through API)
    client_max_body_size 100M;
    client_body_timeout 300s;

    # frontend
    location / {
        root /usr/share/nginx/html/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # dashboard
    location /dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # proxy Sizing Copilot (GĐ 6.2)
    #
    # Đi qua nginx chứ KHÔNG để trình duyệt gọi thẳng cổng 8902: cùng gốc thì
    # không phải bật CORS ở FastAPI, và người dùng chỉ cần mở một cổng (8080/9000).
    # Cổng 8902/8903 giữ nguyên cho Admin và cho script nghiệm thu.
    #
    # API vốn BẤT ĐỒNG BỘ: `POST /copilot/review` trả 202 kèm mã việc rồi FE tự
    # hỏi lại. Nên timeout dưới đây là cho lúc TẢI FILE LÊN, không phải để giữ
    # một kết nối suốt 16–22 phút thẩm định.
    #
    # ⚠️ Không xác thực. Người dùng chốt 2026-09-21: mở cho mọi người đã đăng
    # nhập. Copilot tự nó KHÔNG kiểm danh tính (5.0a) — kể cả endpoint Admin, nó
    # chỉ đọc `vai` trong header. Ai mở được trang là gọi được.
    #
    # ⚠️ `proxy_pass http://copilot:8000/` viết thẳng tên máy thì nginx phân giải
    # DNS NGAY LÚC NẠP CẤU HÌNH, và **không khởi động được** nếu `copilot` đang
    # tắt — tức tắt Copilot là sập luôn cả Tool Sizing, đúng thứ tiêu chí T6 cấm.
    # Đặt đích vào BIẾN thì nginx hoãn phân giải tới từng yêu cầu; lúc đó Copilot
    # tắt chỉ làm riêng tab thẩm định lỗi 502. Dùng biến thì nginx KHÔNG tự cắt
    # tiền tố `location` nữa, nên phải `rewrite` lấy lại phần đuôi.
    # `127.0.0.11` là DNS nội bộ của Docker.
    location /copilot/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $copilot_upstream copilot:8000;
        rewrite ^/copilot/(.*)$ /$1 break;
        proxy_pass http://$copilot_upstream;

        client_max_body_size 100M;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy backend
    location /api/ {
        proxy_pass http://backend:8081/api/;

        # Increase max body size for file uploads (100MB)
        client_max_body_size 100M;

        # Increase timeouts for large uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}